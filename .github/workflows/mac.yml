# Mac-Testversion: baut Silkreader für Apple-Chip (arm64) und Intel (x64), testet auf echtem macOS
# und legt die Pakete als Vorabversion „mac-v<Version>“ ins öffentliche Download-Repo.
# Nicht von Apple beglaubigt (dafür bräuchte es ein Apple-Entwicklerkonto): beim ersten Öffnen
# Rechtsklick → „Öffnen“. Updates: die App meldet neue Mac-Versionen und führt zur Download-Seite.
name: Mac-Testversion

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Ins Download-Repo hochladen'
        type: boolean
        default: true
      from_run:
        description: 'Nur veröffentlichen: Pakete aus diesem früheren Lauf (Run-ID) übernehmen, nicht neu bauen'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  mac:
    if: ${{ inputs.from_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testwerkzeug
        run: npm i --no-save playwright-core@1.56.1

      - name: Feste Regeln und Lernen
        run: |
          node test/facts.mjs
          node test/letters.mjs
          node test/learn.mjs

      - name: Codeschutz (verschleiern + Bytecode)
        run: node build/protect.js

      - name: Auf echtem macOS testen
        run: node test/mac.mjs mac-test

      - name: Bauen (ad hoc signiert, nicht beglaubigt)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never -c.mac.identity=-

      # Die fertige App so testen, wie Nutzer sie bekommen: aus der DMG installieren und starten
      - name: Gebaute App aus der DMG testen
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/silk
          cp -R /Volumes/silk/Silkreader.app /Applications/
          hdiutil detach /Volumes/silk
          codesign --verify --deep --verbose=1 /Applications/Silkreader.app || echo "::warning::Signaturprüfung (ad hoc) meldet etwas"
          MAC_APP=/Applications/Silkreader.app/Contents/MacOS/Silkreader node test/mac.mjs mac-test/app

      - name: Ergebnisse
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: silkreader-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

      - name: Bildschirmfotos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screens-mac-${{ matrix.arch }}
          path: mac-test/
          if-no-files-found: ignore

  publish:
    needs: mac
    if: ${{ inputs.publish && !cancelled() && (needs.mac.result == 'success' || inputs.from_run != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: silkreader-mac-*
          merge-multiple: true
          path: mac
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Im Download-Repo als Mac-Testversion veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "::error title=RELEASES_TOKEN fehlt::"; exit 1; fi
          find mac -type f | head -20
          version=$(node -p "require('./package.json').version")
          repo=Sebbilore/silkreader-download
          files=$(find mac -type f \( -name '*.dmg' -o -name '*.zip' \) | sort)
          echo "$files"
          if [ -z "$files" ]; then echo "::error title=Keine Mac-Pakete::"; exit 1; fi
          gh release delete "mac-v$version" --repo $repo --yes --cleanup-tag 2>/dev/null || true
          gh release create "mac-v$version" $files --repo $repo --prerelease --latest=false \
            --title "Mac-Testversion $version" \
            --notes "Silkreader $version für macOS (Testversion). Apple-Chip (M1–M4): **arm64**, ältere Intel-Macs: **x64**.

          **Erstes Öffnen:** Die App ist nicht von Apple beglaubigt. Ziehe Silkreader in den Programme-Ordner, dann **Rechtsklick → Öffnen → Öffnen**. Danach startet sie normal.
          Erlaube unter **Systemeinstellungen → Datenschutz & Sicherheit → Bedienungshilfen** den Zugriff, damit die Spinne markierten Text lesen kann."
