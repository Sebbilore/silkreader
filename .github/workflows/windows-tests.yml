# Testet Silkreader auf einem echten Windows-PC (GitHub Actions): echter Editor, echte Tasten
# und Mausbewegungen, Texterkennung und die Update-Signaturprüfung am veröffentlichten Installer.
# Läuft bei jeder Änderung am Code und vor jedem Release (siehe release.yml).
name: Windows-Test

on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'package-lock.json', '.github/workflows/windows-tests.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testwerkzeug
        run: npm i --no-save playwright-core@1.56.1

      - name: Feste Regeln und Lernen (Testbriefe)
        run: |
          node test/facts.mjs
          node test/letters.mjs
          node test/learn.mjs

      - name: Zuletzt veröffentlichten Installer holen (für die Signaturprüfung)
        shell: pwsh
        run: |
          gh release download --repo ${{ github.repository }} --pattern "Silkreader-Setup-*.exe" --dir signed
          Get-ChildItem signed

      - name: Silkreader auf Windows testen
        shell: pwsh
        run: |
          $exe = (Get-ChildItem signed\*.exe | Select-Object -First 1).FullName
          node test/windows.mjs win-test $exe

      - name: Bildschirmfotos und Protokoll
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test
          path: win-test
          retention-days: 14

  # Echte KI (eingebautes Modell, nur Prozessor) auf echtem Windows: Analyse, langes Dokument,
  # Übersetzen, Dauer, Arbeitsspeicher und Prozessorlast. Die Modelle (1 GB und 2,5 GB) werden zwischengespeichert.
  ai:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SILK_MODEL_DIR: ${{ github.workspace }}\silk-models
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testwerkzeug
        run: npm i --no-save playwright-core@1.56.1

      - name: KI-Modell aus dem Zwischenspeicher
        uses: actions/cache@v5
        with:
          path: silk-models
          key: silk-models-qwen2.5-1.5b-qwen3-4b-v1

      # Getestet wird genau das, was ausgeliefert wird: verschleiert und mit Bytecode
      - name: Codeschutz anwenden (wie beim Bauen)
        run: node build/protect.js

      - name: Echte KI auf Windows testen
        shell: pwsh
        run: node test/windows-ai.mjs win-ai

      - name: KI-Test mit allen Testbriefen (schnelles und gründliches Modell)
        if: always()
        shell: pwsh
        run: node test/bench.mjs win-ai/bench

      - name: Ergebnisse
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-ai
          path: win-ai
          retention-days: 14
