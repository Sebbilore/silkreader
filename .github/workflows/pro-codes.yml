# Gratis-Codes für Silkreader Pro erzeugen (für Freunde, Gewinnspiele, Creator).
# Start: Actions → Pro-Codes → Run workflow. Die Codes stehen danach in der Zusammenfassung des Laufs.
# Ist das Repo öffentlich, werden die Codes nur verschlüsselt ausgegeben: dafür beim Start einen öffentlichen
# RSA-Schlüssel (PEM, Base64) als „empfaenger“ angeben – lesen kann sie nur, wer den passenden privaten Schlüssel hat.
name: Pro-Codes

on:
  workflow_dispatch:
    inputs:
      anzahl:
        description: Wie viele Codes?
        default: '1'
      monate:
        description: Gültig für wie viele Monate? (0 = unbegrenzt)
        default: '0'
      notiz:
        description: Notiz (z. B. „für Max“)
        default: ''
      empfaenger:
        description: 'Nur bei öffentlichem Repo: öffentlicher RSA-Schlüssel (PEM als Base64) – die Codes werden damit verschlüsselt'
        default: ''

jobs:
  codes:
    runs-on: ubuntu-latest
    steps:
      - name: Nur privat oder verschlüsselt
        if: ${{ !github.event.repository.private && inputs.empfaenger == '' }}
        run: |
          echo "::error title=Repo ist öffentlich::Codes werden nur erzeugt, wenn das Repo privat ist oder ein Empfänger-Schlüssel angegeben ist (sonst könnte sie jeder sehen)."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Codes erzeugen
        if: ${{ inputs.empfaenger == '' }}
        env:
          PRO_SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY }}
          ANZAHL: ${{ inputs.anzahl }}
          MONATE: ${{ inputs.monate }}
          NOTIZ: ${{ inputs.notiz }}
        run: node scripts/pro-codes.mjs "$ANZAHL" "$MONATE" "$NOTIZ" >> "$GITHUB_STEP_SUMMARY"
      - name: Codes erzeugen (verschlüsselt)
        if: ${{ inputs.empfaenger != '' }}
        env:
          PRO_SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY }}
          ANZAHL: ${{ inputs.anzahl }}
          MONATE: ${{ inputs.monate }}
          NOTIZ: ${{ inputs.notiz }}
          EMPFAENGER: ${{ inputs.empfaenger }}
        run: |
          node scripts/pro-codes.mjs "$ANZAHL" "$MONATE" "$NOTIZ" > codes.txt 2> err.txt || { echo "::error title=Code-Erzeugung fehlgeschlagen::$(tr '\n' ' ' < err.txt)"; exit 1; }
          enc=$(node -e "
            const c = require('crypto'), fs = require('fs');
            const pub = Buffer.from(process.env.EMPFAENGER, 'base64').toString('utf8');
            const key = c.randomBytes(32), iv = c.randomBytes(12);
            const ci = c.createCipheriv('aes-256-gcm', key, iv);
            const data = Buffer.concat([ci.update(fs.readFileSync('codes.txt')), ci.final()]);
            const wrapped = c.publicEncrypt({ key: pub, oaepHash: 'sha256' }, key);
            console.log([wrapped, iv, ci.getAuthTag(), data].map((b) => b.toString('base64')).join('.'));
          " 2> err.txt) || { echo "::error title=Verschlüsseln fehlgeschlagen::$(tr '\n' ' ' < err.txt | cut -c1-600)"; exit 1; }
          rm codes.txt
          echo "::notice title=Pro-Codes (verschlüsselt)::$enc"
