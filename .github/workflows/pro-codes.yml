# Gratis-Codes für Silkreader Pro erzeugen (für Freunde, Gewinnspiele, Creator).
# Start: Actions → Pro-Codes → Run workflow. Die Codes stehen danach in der Zusammenfassung des Laufs.
# Ist das Repo öffentlich, werden die Codes nur verschlüsselt ausgegeben: dafür beim Start einen öffentlichen
# RSA-Schlüssel (PEM, Base64) als „empfaenger“ angeben – lesen kann sie nur, wer den passenden privaten Schlüssel hat.
name: Pro-Codes

on:
  workflow_dispatch:
    inputs:
      anzahl:
        description: Wie viele Codes?
        default: '1'
      dauer:
        description: 'Wie lange gültig? (Standard: lebenslang)'
        type: choice
        default: lebenslang
        options:
          - lebenslang
          - 1 Woche
          - 2 Wochen
          - 1 Monat
          - 3 Monate
          - 6 Monate
          - 1 Jahr
          - 2 Jahre
      bis:
        description: 'Oder genau bis (Datum, z. B. 31.12.2027) – ersetzt die Dauer, leer lassen für die Auswahl oben'
        default: ''
      notiz:
        description: Notiz (z. B. „für Max“)
        default: ''
      empfaenger:
        description: 'Nur bei öffentlichem Repo: öffentlicher RSA-Schlüssel (PEM als Base64) – die Codes werden damit verschlüsselt'
        default: ''

jobs:
  codes:
    runs-on: ubuntu-latest
    steps:
      - name: Nur privat oder verschlüsselt
        if: ${{ !github.event.repository.private && inputs.empfaenger == '' }}
        env:
          PW: ${{ secrets.PRO_CODES_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error title=Repo ist öffentlich::Codes werden nur erzeugt, wenn das Repo privat ist, das Secret PRO_CODES_PASSWORD gesetzt ist oder ein Empfänger-Schlüssel angegeben ist (sonst könnte sie jeder sehen)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Codes erzeugen
        if: ${{ inputs.empfaenger == '' && github.event.repository.private }}
        env:
          PRO_SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY }}
          ANZAHL: ${{ inputs.anzahl }}
          DAUER: ${{ inputs.dauer }}
          BIS: ${{ inputs.bis }}
          NOTIZ: ${{ inputs.notiz }}
        run: node scripts/pro-codes.mjs "$ANZAHL" "$DAUER" "$NOTIZ" "$BIS" >> "$GITHUB_STEP_SUMMARY"
      - name: Codes erzeugen (verschlüsselt)
        if: ${{ inputs.empfaenger != '' }}
        env:
          PRO_SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY }}
          ANZAHL: ${{ inputs.anzahl }}
          DAUER: ${{ inputs.dauer }}
          BIS: ${{ inputs.bis }}
          NOTIZ: ${{ inputs.notiz }}
          EMPFAENGER: ${{ inputs.empfaenger }}
        run: |
          node scripts/pro-codes.mjs "$ANZAHL" "$DAUER" "$NOTIZ" "$BIS" > codes.txt 2> err.txt || { echo "::error title=Code-Erzeugung fehlgeschlagen::$(tr '\n' ' ' < err.txt)"; exit 1; }
          enc=$(node -e "
            const c = require('crypto'), fs = require('fs');
            const pub = Buffer.from(process.env.EMPFAENGER, 'base64').toString('utf8');
            const key = c.randomBytes(32), iv = c.randomBytes(12);
            const ci = c.createCipheriv('aes-256-gcm', key, iv);
            const data = Buffer.concat([ci.update(fs.readFileSync('codes.txt')), ci.final()]);
            const wrapped = c.publicEncrypt({ key: pub, oaepHash: 'sha256' }, key);
            console.log([wrapped, iv, ci.getAuthTag(), data].map((b) => b.toString('base64')).join('.'));
          " 2> err.txt) || { echo "::error title=Verschlüsseln fehlgeschlagen::$(tr '\n' ' ' < err.txt | cut -c1-600)"; exit 1; }
          rm codes.txt
          echo "::notice title=Pro-Codes (verschlüsselt)::$enc"
      # Öffentliches Repo: Codes mit deinem Passwort (Secret PRO_CODES_PASSWORD) verschlüsseln.
      # Entschlüsseln: docs/pro-codes.html im Browser öffnen (erzeugt auch direkt Codes) – läuft nur bei dir, nichts wird gesendet.
      - name: Codes erzeugen (mit Passwort verschlüsselt)
        if: ${{ inputs.empfaenger == '' && !github.event.repository.private }}
        env:
          PRO_SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY }}
          PW: ${{ secrets.PRO_CODES_PASSWORD }}
          ANZAHL: ${{ inputs.anzahl }}
          DAUER: ${{ inputs.dauer }}
          BIS: ${{ inputs.bis }}
          NOTIZ: ${{ inputs.notiz }}
        run: |
          node scripts/pro-codes.mjs "$ANZAHL" "$DAUER" "$NOTIZ" "$BIS" > codes.txt 2> err.txt || { echo "::error title=Code-Erzeugung fehlgeschlagen::$(tr '\n' ' ' < err.txt)"; exit 1; }
          enc=$(node -e "
            const c = require('crypto'), fs = require('fs');
            const salt = c.randomBytes(16), iv = c.randomBytes(12);
            const key = c.pbkdf2Sync(process.env.PW, salt, 250000, 32, 'sha256');
            const ci = c.createCipheriv('aes-256-gcm', key, iv);
            const data = Buffer.concat([ci.update(fs.readFileSync('codes.txt')), ci.final(), ci.getAuthTag()]);
            console.log('SPW1.' + [salt, iv, data].map((b) => b.toString('base64')).join('.'));
          ")
          rm codes.txt
          echo "::notice title=Pro-Codes (mit deinem Passwort verschlüsselt)::$enc"
          { echo '## Pro-Codes (verschlüsselt)'; echo; echo 'In docs/pro-codes.html („Von Hand öffnen“) einfügen und mit deinem Passwort öffnen:'; echo; echo '```'; echo "$enc"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
