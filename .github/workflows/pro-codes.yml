# Gratis-Codes für Silkreader Pro erzeugen (für Freunde, Gewinnspiele, Creator).
# Start: Actions → Pro-Codes → Run workflow. Die Codes stehen danach in der Zusammenfassung des Laufs.
# Läuft nur, wenn das Repo privat ist – sonst könnte jeder die Codes sehen.
name: Pro-Codes

on:
  workflow_dispatch:
    inputs:
      anzahl:
        description: Wie viele Codes?
        default: '1'
      monate:
        description: Gültig für wie viele Monate? (0 = unbegrenzt)
        default: '0'
      notiz:
        description: Notiz (z. B. „für Max“)
        default: ''

jobs:
  codes:
    runs-on: ubuntu-latest
    steps:
      - name: Nur in privaten Repos
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error title=Repo ist öffentlich::Codes werden nur erzeugt, wenn das Repo privat ist (sonst könnte sie jeder sehen)."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Codes erzeugen
        env:
          PRO_SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY }}
          ANZAHL: ${{ inputs.anzahl }}
          MONATE: ${{ inputs.monate }}
          NOTIZ: ${{ inputs.notiz }}
        run: node scripts/pro-codes.mjs "$ANZAHL" "$MONATE" "$NOTIZ" >> "$GITHUB_STEP_SUMMARY"
