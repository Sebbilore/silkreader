# Sobald sich die Versionsnummer in package.json auf main ändert, baut dieser Workflow den
# signierten Windows-Installer und veröffentlicht ihn als GitHub-Release (Tag v<Version>).
# Die installierte App holt sich von dort automatisch Updates (electron-updater).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Erst auf echtem Windows testen – schlägt dabei etwas Wichtiges fehl, wird nichts veröffentlicht.
  tests:
    uses: ./.github/workflows/windows-tests.yml

  windows:
    needs: tests
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Gibt es diese Version schon?
        id: check
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $done = $releases | Where-Object { $_.tag_name -eq "v$version" -and -not $_.draft -and ($_.assets.name -contains 'latest.yml') }
          if ($done) {
            Write-Host "Release v$version ist schon vollständig veröffentlicht – nichts zu tun."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Version v$version wird gebaut."
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Signatur-Zertifikat bereitstellen
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SILKREADER_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw "Secret SILKREADER_PFX_BASE64 fehlt (Settings → Secrets and variables → Actions)." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\silkreader.pfx", [Convert]::FromBase64String($env:PFX_BASE64.Trim()))

      - name: Bauen und signieren
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          CSC_LINK: ${{ runner.temp }}\silkreader.pfx
          CSC_KEY_PASSWORD: ${{ secrets.SILKREADER_PFX_PASSWORD }}
        run: |
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Ende des Logs als Annotation ausgeben, damit der Fehler auf der Übersichtsseite steht
            $tail = (Get-Content build.log -Tail 60) -join '%0A'
            Write-Output "::error title=Build fehlgeschlagen::$tail"
            exit 1
          }

      # Genau ein Release pro Version: halbfertige Einträge dieser Version entfernen,
      # dann das Release mit allen Dateien in einem Schritt anlegen.
      - name: Veröffentlichen
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.check.outputs.version }}"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in $releases | Where-Object { $_.tag_name -eq "v$version" }) {
            Write-Host "Entferne alten Eintrag $($r.id)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)" | Out-Null
          }
          $files = @("dist\latest.yml") + (Get-ChildItem dist\*.exe, dist\*.blockmap | ForEach-Object { $_.FullName })
          gh release create "v$version" @files --repo "${{ github.repository }}" --title "$version" --notes "Silkreader $version" --target "${{ github.sha }}" --latest

      # Öffentliches Download-Repo (ohne Code): README, Datenschutz und Änderungen aktualisieren, dann das Release anlegen.
      # Von dort holen sich installierte Versionen ab 1.21 ihre Updates. Braucht das Secret RELEASES_TOKEN
      # (Fine-grained Token mit „Contents: Read and write“ nur für Sebbilore/silkreader-download).
      - name: Im Download-Repo veröffentlichen
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Output "::error title=RELEASES_TOKEN fehlt::Ohne dieses Secret bekommen neue Versionen keine Updates."; exit 1 }
          $repo = "Sebbilore/silkreader-download"
          $version = "${{ steps.check.outputs.version }}"
          git clone "https://x-access-token:$($env:GH_TOKEN)@github.com/$repo.git" dl 2>&1 | Out-Null
          Copy-Item download-repo\* dl\ -Force
          Copy-Item CHANGELOG.md dl\ -Force
          git -C dl config user.name "Silkreader"
          git -C dl config user.email "noreply@anthropic.com"
          git -C dl add -A
          git -C dl diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git -C dl commit -m "Silkreader $version" | Out-Null; git -C dl push origin HEAD:main 2>&1 | Out-Null }
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in $releases | Where-Object { $_.tag_name -eq "v$version" }) { gh api -X DELETE "repos/$repo/releases/$($r.id)" | Out-Null }
          $files = @("dist\latest.yml") + (Get-ChildItem dist\*.exe, dist\*.blockmap | ForEach-Object { $_.FullName })
          gh release create "v$version" @files --repo $repo --title "$version" --notes "Silkreader $version – alle Änderungen: https://github.com/$repo/blob/main/CHANGELOG.md" --latest
