# Sobald sich die Versionsnummer in package.json auf main ändert, baut dieser Workflow den
# signierten Windows-Installer und veröffentlicht ihn als GitHub-Release (Tag v<Version>).
# Die installierte App holt sich von dort automatisch Updates (electron-updater).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gibt es diese Version schon?
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$version" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$version existiert bereits – nichts zu tun."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Neue Version v$version wird gebaut."
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Signatur-Zertifikat bereitstellen
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SILKREADER_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw "Secret SILKREADER_PFX_BASE64 fehlt (Settings → Secrets and variables → Actions)." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\silkreader.pfx", [Convert]::FromBase64String($env:PFX_BASE64.Trim()))

      - name: Bauen, signieren und veröffentlichen
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish always 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Ende des Logs als Annotation ausgeben, damit der Fehler auf der Übersichtsseite steht
            $tail = (Get-Content build.log -Tail 60) -join '%0A'
            Write-Output "::error title=Build fehlgeschlagen::$tail"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.temp }}\silkreader.pfx
          CSC_KEY_PASSWORD: ${{ secrets.SILKREADER_PFX_PASSWORD }}
