name: Problem / Fehler
description: Etwas funktioniert nicht wie erwartet / Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert? / What happened?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert? / What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: In welchem Programm war der Text? / Which program was the text in?
      placeholder: z. B. Word, Chrome, Outlook, PDF-Reader
  - type: input
    id: version
    attributes:
      label: Silkreader-Version und Windows-Version
      placeholder: z. B. Silkreader 1.16.0, Windows 11 23H2
  - type: textarea
    id: log
    attributes:
      label: Protokoll / Log (optional)
      description: Tray-Symbol → Rechtsklick → „Protokoll öffnen“. Es enthält keine gelesenen Texte. / Tray icon → right-click → “Open log”. It contains no texts you read.
      render: text
