<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Silkreader</title>
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<script src="eggs.js"></script>
<script src="a11y.js"></script>
<script src="icons.js"></script>
<script src="facts.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13.5px/1.6 var(--font); color: var(--text); }
  /* Die Blase hängt an einem Seidenfaden unter der Spinne */
  #bubble { position: absolute; left: 10px; right: 10px; top: 16px; max-height: calc(100% - 26px); border-radius: var(--r-l);
    display: flex; flex-direction: column; transform-origin: var(--arrow, 50%) 0; animation: silk-pop var(--t-slow) var(--ease-spring); }
  #bubble.closing { animation: silk-out .18s ease-in forwards; }
  #thread { position: absolute; top: 0; left: calc(var(--arrow, 50%) - 6px); width: 12px; height: 20px; overflow: visible; pointer-events: none; }
  #thread line { stroke: var(--silk); stroke-width: 1; }
  #thread circle { fill: var(--dew); filter: drop-shadow(0 0 2px rgba(255,255,255,.8)); }
  header { display: flex; align-items: flex-start; gap: 8px; padding: 12px 10px 6px 16px; -webkit-app-region: drag; }
  header .t { font: 600 14px/1.35 var(--font); color: var(--text); flex: 1; padding-top: 5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  header .mark { flex: none; width: 20px; height: 20px; margin-top: 5px; color: var(--pink); } .back:not(.hidden) + .mark { display: none; }
  .x { -webkit-app-region: no-drag; background: none; border: none; color: var(--muted); cursor: pointer; width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--r-s);
    transition: color var(--t-fast), background var(--t-fast); }
  .x:hover { color: var(--text); background: var(--line); }
  .x .icon { width: 14px; height: 14px; }
  main { overflow: auto; padding: 4px 16px 6px; min-height: 40px; }
  main::-webkit-scrollbar { width: 6px; } main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  b { color: var(--strong); font-weight: 600; }
  .rise { animation: silk-rise .42s var(--ease-out) both; }
  ul { margin: 0; padding-left: 16px; } li { margin: 0 0 8px; } li::marker { color: var(--faint); }
  .lead li { font-size: 14px; line-height: 1.5; }
  .h2 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .weave { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; }
  .weave svg { width: 26px; height: 26px; flex: none; overflow: visible; }
  .weave .sp { stroke: var(--silk); stroke-width: .7; opacity: .55; }
  .weave .spiral { fill: none; stroke: var(--pink); stroke-width: 1.1; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--pink-glow));
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset .5s var(--ease-out); filter: none; }
  .weave.indet svg { animation: silk-spin 6s linear infinite; }
  .weave.indet .spiral { animation: weaveLoop 1.8s var(--ease-out) infinite; }
  @keyframes weaveLoop { 0% { stroke-dashoffset: var(--len); opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .stage { color: var(--muted); font-size: 12.5px; }
  .cur { color: var(--pink); animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } }
  /* "Mehr ▾": alles Weitere ausgeklappt */
  .more { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); transition: color var(--t-fast); }
  .more:hover { color: var(--strong); }
  #details { display: none; padding-top: 6px; } #details.open { display: block; }
  .sec { margin: 10px 0 0; } .sec > .h { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; } .sec > .h.sub { font-size: 12px; font-weight: 400; color: var(--muted); }
  .jump { cursor: pointer; border-radius: 6px; } .jump:hover { color: var(--strong); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
  .find { padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 6px; }
  .find .k { font-size: 12px; font-weight: 600; color: var(--muted); }
  .find .d { color: var(--muted); font-size: 12px; }
  .figs { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 12.5px; }
  .figs span:nth-child(odd) { color: var(--muted); } .figs span:nth-child(even) { text-align: right; }
  .dl { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 8px 0; } .dl .icon { width: 15px; height: 15px; color: var(--muted); }
  .dl .when { font-weight: 600; white-space: nowrap; } .dl .what { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link { background: none; border: none; color: var(--pink-2); font: inherit; font-size: 12.5px; cursor: pointer; padding: 0; white-space: nowrap; }
  .link:hover { text-decoration: underline; }
  .answer { margin: 10px 0 2px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); animation: silk-rise .35s var(--ease-out); }
  .answer .q { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .out { white-space: pre-wrap; }
  .error { color: var(--bad); }
  footer { padding: 8px 10px 10px 16px; display: flex; flex-direction: column; gap: 8px; }
  .ask { width: calc(100% - 6px); height: 34px; background: var(--raised); border: 1px solid var(--control-line); border-bottom-color: var(--faint); border-radius: var(--r-s); color: var(--text); font: inherit; font-size: 13px;
    padding: 0 12px; outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  .ask:focus { border-bottom-color: var(--pink); box-shadow: inset 0 -1px 0 var(--pink); } .ask::placeholder { color: var(--faint); }
  .actions { display: flex; gap: 2px; align-items: center; margin-left: -8px; position: relative; }
  .actions .link { color: var(--text); display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: var(--r-s); font-size: 13px; transition: background var(--t-fast); }
  .actions .link .icon { width: 15px; height: 15px; }
  .actions .link:hover { background: var(--line); text-decoration: none; }
  .actions .spacer { flex: 1; }
  .actions .mbtn { width: 32px; justify-content: center; padding: 0; }
  .menu { position: absolute; right: 0; bottom: 36px; min-width: 190px; padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-l); box-shadow: var(--shadow); z-index: 5; animation: silk-rise var(--t-mid) var(--ease-out); }
  .menu .link { display: flex; width: 100%; height: 32px; padding: 0 10px; } .menu .link:hover { background: var(--line); }
  .hidden { display: none !important; }
  /* Zahlen-Prüfung: ✓ steht im Text, ≈ gerechnet, ? nicht gefunden */
  .ck { font-size: 11px; margin-left: 4px; color: var(--ok); font-weight: 700; } .ck.calc { color: var(--muted); } .ck.miss { color: var(--warn); }
  .unsure { text-decoration: underline dotted var(--warn); text-underline-offset: 3px; cursor: help; }
  /* Brief-Karte: Was muss ich tun? */
  .letter { margin: 4px 0 12px; padding: 12px 14px 14px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--card); }
  .letter .lh { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .letter .lh b { color: var(--muted); font-size: 12px; font-weight: 400; }
  .letter .lh b::after { content: ':'; }
  .letter .big { font-size: 19px; font-weight: 600; line-height: 1.3; color: var(--strong); }
  .letter .when2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 3px 0 8px; font-size: 13.5px; }
  .days { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: var(--r-s); padding: 0 6px; white-space: nowrap; } .days.calm { color: var(--muted); background: var(--line); }
  .todo { list-style: none; padding: 0; margin: 0 0 8px; } .todo li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; margin: 3px 0; }
  .todo li::before { content: ""; flex: none; width: 10px; height: 10px; border: 1.5px solid var(--faint); border-radius: 3px; transform: translateY(1px); }
  .kv { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13px; align-items: baseline; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { height: 32px; padding: 0 14px; border: 1px solid var(--control-line); border-radius: var(--r-s); background: var(--raised); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); } .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; } .btn.primary:hover { filter: brightness(1.08); }
  .kv > span:nth-child(3n+1) { color: var(--muted); } .kv code { font: inherit; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .letter .row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
  .review { margin: 12px 0 2px; padding: 10px 12px; border-radius: var(--r-l); background: var(--card); border: 1px solid var(--line); font-size: 13px; }
  .review .row { display: flex; gap: 14px; margin-top: 6px; } .review .link.dim { color: var(--muted); }
  .fr { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); } .fr:first-child { border-top: none; }
  .fr .ft { flex: 1; min-width: 0; font-size: 12.5px; } .fr .fw { color: var(--muted); } .fr.soon .fw { color: var(--warn); font-weight: 600; }
  .fr .fn { font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr .fs { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr .fa { display: flex; gap: 14px; margin-top: 4px; }
  .fchk { flex: none; width: 18px; height: 18px; margin-top: 1px; border: 1.5px solid var(--faint); border-radius: var(--r-s); background: none; cursor: pointer; padding: 0; }
  .fr.done .fchk { background: var(--primary); border-color: var(--primary); } .fr.done .ft { opacity: .55; } .fr.done .fn { text-decoration: line-through; }
  details.sec summary { cursor: pointer; }
  .pro-on { color: var(--ok); font-weight: 600; margin: 4px 0 8px; } .pro-why { margin: 2px 0 8px; font-size: 13.5px; } .pro-soon { margin: 0 0 10px; color: var(--strong); font-size: 19px; font-weight: 600; }
  .pro-list { list-style: none; padding: 0; margin: 0 0 8px; font-size: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; } .pro-list li { margin: 0; }
  .pro-list li.hit span { color: var(--strong); font-weight: 600; }
  .go { background: var(--primary); color: var(--on-primary); border: none; border-radius: var(--r-s); height: 32px; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .go:hover { filter: brightness(1.08); } .go.small { padding: 0 14px; } .coderow { display: flex; gap: 8px; } .coderow input { flex: 1; min-width: 0; margin: 0; }
  .letter.locked .lh { margin-bottom: 4px; }
  .letter .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; } .letter .note.warn, .letter .warn { color: var(--warn); }
  .tpl { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; align-items: baseline; }
  .entry .fold { flex: none; background: none; border: 1px solid var(--line-2); border-radius: var(--r-s); color: var(--muted); font: inherit; font-size: 11.5px; padding: 0 7px; cursor: pointer; }
  .entry .fold.on { background: var(--line); border-color: transparent; color: var(--text); } .fpick { margin: 4px 0 8px; } .fpick .chip { font-size: 11px; }
  .aiNote .sent { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; color: var(--ok); } .aiNote .sent .icon { width: 11px; height: 11px; } .aiNote .sent.cloud { color: var(--muted); }
  .langpick { margin: 12px 0 2px; } .langpick .h { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .aiNote { font-size: 12px; color: var(--faint); margin: 12px 0 2px; }
  .where { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 7px; }
  .where .icon { width: 13px; height: 13px; }
  .where.cloud { color: var(--pink-2); }
  .news li { margin-bottom: 9px; }
  .about { text-align: center; padding: 4px 0 6px; }
  .about svg.sp { width: 64px; height: 64px; }
  .about h2 { font: 600 18px var(--font-display); margin: 6px 0 0; }
  .about .v { color: var(--muted); font-size: 12px; }
  .about p { color: var(--muted); font-size: 13px; margin: 10px 0; text-align: left; }
  .linklist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 8px 0 4px; text-align: left; }
  .linklist .link { display: inline-flex; gap: 6px; align-items: center; color: var(--text); } .linklist .link:hover { color: var(--strong); text-decoration: underline; }
  .linklist .icon { width: 14px; height: 14px; color: var(--muted); }
  textarea.rep { height: 90px; }
  /* Zurück-Pfeil im Kopf */
  .back:hover { color: var(--strong); }
  /* Lupe: Originalstelle direkt in der Blase */
  .lupe { margin: 4px 0 10px; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); font-size: 13px; color: var(--muted); animation: silk-rise .2s var(--ease-out); }
  .lupe mark { background: var(--pink-soft); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .lupe .row { display: flex; gap: 14px; margin-top: 6px; }
  .figs .lupe { grid-column: 1 / -1; }
  .lupe .none { font-style: italic; }
  /* Mini-Blase: einfügen, Zwischenablage, Datei */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .chip { background: none; border: 1px solid transparent; color: var(--muted); font: inherit; font-size: 13px; border-radius: var(--r-s);
    height: 30px; padding: 0 10px; cursor: pointer; transition: color var(--t-fast), background var(--t-fast); }
  .chip:hover { color: var(--text); background: var(--line); } .chip.on { color: var(--strong); font-weight: 600; background: linear-gradient(var(--pink), var(--pink)) center bottom 2px / calc(100% - 20px) 3px no-repeat; }
  textarea.in { width: 100%; resize: none; background: var(--raised); border: 1px solid var(--control-line); border-bottom-color: var(--faint); border-radius: var(--r-s); color: var(--text);
    font: inherit; font-size: 13px; padding: 9px 12px; outline: none; height: 80px; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  textarea.in:focus { border-bottom-color: var(--pink); box-shadow: inset 0 -1px 0 var(--pink); }
  textarea.in::placeholder { color: var(--faint); }
  .quick .link { display: inline-flex; align-items: center; gap: 6px; } .quick .link .icon { width: 14px; height: 14px; color: var(--muted); }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .quick .link { color: var(--text); height: 32px; padding: 0 12px; border: 1px solid var(--control-line); border-radius: var(--r-s); background: var(--raised); font-size: 13px; } .quick .link:hover { border-color: var(--faint); text-decoration: none; }
  .clip { font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .icon { width: 13px; height: 13px; vertical-align: -2px; }
  .clip:hover { color: var(--text); }
  .entry { padding: 7px 8px; margin: 0 -8px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; border-radius: var(--r-s); }
  .entry:hover { background: var(--line); }
  .entry .t { flex: 1; min-width: 0; } .entry b { display: block; font-weight: 400; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry small { color: var(--muted); font-size: 11px; }

  .entry .del { background: none; border: none; color: var(--muted); cursor: pointer; visibility: hidden; padding: 0 2px; }
  .entry:hover .del { visibility: visible; } .entry .del:hover { color: var(--bad); }
  /* Einstellungen in der Blase */
  .set { margin: 0 0 12px; } .set > .h { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .set select { background: var(--raised); color: var(--text); border: 1px solid var(--control-line); border-radius: var(--r-s); font: inherit; font-size: 13px; height: 30px; padding: 0 8px; }
  .tog { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 6px 0; cursor: pointer; }
  .tog input { accent-color: var(--primary); }
</style>
</head>
<body>
<svg id="thread" viewBox="0 0 12 20"><line x1="6" y1="0" x2="6" y2="16"/><circle cx="6" cy="16" r="1.6"/></svg>
<div id="bubble" class="glass">
  <header><button class="back x hidden" id="back" title="Zurück"></button><svg class="mark" viewBox="-36 -30 72 60" aria-hidden="true"><g stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -5L18 -15L24 -4M10 -1L21 -7L28 4M10 3L20 2L26 13M8 7L16 9L20 20M-8 -5L-18 -15L-24 -4M-10 -1L-21 -7L-28 4M-10 3L-20 2L-26 13M-8 7L-16 9L-20 20"/></g><circle r="11" fill="currentColor"/></svg><span class="t" id="title">Silkreader</span><span class="where hidden" id="where"></span><button class="x" id="close" title="Schließen (Esc)"></button></header>
  <main id="main"></main>
  <footer id="foot" class="hidden"></footer>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Zahlen, Beträge und Prozente fett
  const emph = (s) => esc(s).replace(/(?<![\p{L}\d][-/]|[\p{L}\d])(\d[\d.,]*\s?(?:%|€|Prozent|Euro|Mio\.?|Mrd\.?|Millionen|Milliarden|Tage|Monate|Jahre)?)/gu, '<b>$1</b>');
  function bullets(text) {
    let parts = String(text || '').split(/\n+|\s*•\s*/).map((t) => t.replace(/^[-–*]\s+/, '').trim()).filter(Boolean);
    if (parts.length === 1 && parts[0].length > 160) parts = parts[0].split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ0-9])/);
    return parts;
  }

  let P = null, result = null, state = 'idle', run = 0;
  $('close').innerHTML = silkIcon('close');
  $('back').innerHTML = silkIcon('back');
  $('close').setAttribute('aria-label', T('Schließen'));
  $('back').setAttribute('aria-label', T('Zurück'));
  document.getElementById('bubble').setAttribute('role', 'dialog');
  document.getElementById('main').setAttribute('aria-live', 'polite'); // Ergebnisse werden vorgelesen, sobald sie da sind

  // Fortschritt als Spinnennetz, das gewebt wird (ohne Schritte: in Dauerschleife)
  const SPIRAL = (() => { let d = '', n = 8 * 3.2; for (let k = 0; k <= n; k++) { const a = (k / 8) * Math.PI * 2 - Math.PI / 2, r = 2 + (k / n) * 9; d += `${k ? 'L' : 'M'}${(Math.cos(a) * r).toFixed(2)} ${(Math.sin(a) * r).toFixed(2)}`; } return d; })();
  const weave = (label) => `<div class="weave indet" id="weave"><svg viewBox="-12 -12 24 24" style="--len:190">
    ${Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2 - Math.PI / 2; return `<line class="sp" x1="0" y1="0" x2="${(Math.cos(a) * 11.5).toFixed(2)}" y2="${(Math.sin(a) * 11.5).toFixed(2)}"/>`; }).join('')}
    <path class="spiral" d="${SPIRAL}"/></svg><span class="stage" id="stage">${label}</span></div>`;
  function weaveProgress(p) {
    const w = $('weave'); if (!w) return;
    w.classList.remove('indet');
    w.querySelector('.spiral').style.strokeDashoffset = (190 * (1 - Math.max(0.04, Math.min(1, p)))).toFixed(1);
  }

  // ---------- Fristen im Text finden (für den Kalender) – feste Regeln aus facts.js ----------
  const findDeadlines = (text) => SilkFacts.findDeadlines(text, { max: 3 });

  // ---------- Analyse ----------
  async function analyze() {
    state = 'running';
    const myRun = ++run;
    $('foot').classList.add('hidden');
    P.quickShown = false;
    $('main').innerHTML = `${weave('Die Spinne liest …')}<div id="live"></div>`;
    const res = await window.spider.analyze(P.doc);
    if (myRun !== run) return;
    if (!res.ok) return showError(res, analyze);
    result = res.result;
    showResult();
  }

  window.spider.onProgress(({ summary, stage, quick, notes }) => {
    if (state !== 'running' || !$('stage')) return;
    if (quick) {
      // Kurzfassung steht – Details kommen darunter
      P.quickShown = true;
      if (quick.title) $('title').textContent = quick.title;
      $('main').innerHTML = `<ul class="lead" data-noi18n>${bullets(quick.summary).map((b) => `<li>${emph(b)}</li>`).join('')}</ul>${weave('Sucht Zahlen, Fristen und Details …')}<div id="live"></div>`;
      return;
    }
    if (notes?.length) {
      // Langes Dokument: Zwischenstand aus den bisher gelesenen Abschnitten
      const box = $('live');
      if (!box.querySelector('.sofar')) box.innerHTML = `<div class="sec sofar"><div class="h">${T('Bisher gefunden')}</div><ul class="muted" data-noi18n></ul></div>`;
      box.querySelector('.sofar ul').insertAdjacentHTML('beforeend', notes.slice(0, 2).map((n) => `<li class="rise">${emph(n)}</li>`).join(''));
      return;
    }
    if (stage?.stage) $('stage').textContent = stage.stage;
    if (stage?.steps) weaveProgress(stage.step / stage.steps);
    if (summary && !P.quickShown) $('live').innerHTML = `<ul class="lead" data-noi18n>${bullets(summary).map((b) => `<li>${emph(b)}</li>`).join('')}</ul><span class="cur">▍</span>`;
    else if (summary) $('live').innerHTML = '';
  });

  // Zahlen-Prüfung: Zahlen, die so nicht im Originaltext stehen, gestrichelt markieren
  let srcNums = null;
  function emphChecked(t) {
    const html = emph(t);
    if (!srcNums) return html;
    return html.replace(/<b>([^<]*)<\/b>/g, (all, inner) => (SilkFacts.unknownNumbers(inner.replace(/&amp;/g, '&'), srcNums).length
      ? `<b class="unsure" title="${T('Steht so nicht im Text – bitte prüfen')}">${inner}</b>` : all));
  }
  const CK = { ok: ['✓', 'Steht so im Text'], calc: ['≈', 'Aus dem Text berechnet'], missing: ['?', 'Nicht im Text gefunden – bitte prüfen'] };
  const ck = (f) => { const c = CK[f.check]; return c ? `<span class="ck ${f.check === 'missing' ? 'miss' : f.check === 'calc' ? 'calc' : ''}" title="${T(c[1])}">${c[0]}</span>` : ''; };

  // „Einspruch“ (Steuer, Bußgeld) oder „Widerspruch“ – wie im Brief; auf Englisch immer „objection“
  const objWord = (L, cap = false) => (I18N.lang === 'en' ? (cap ? 'Objection' : 'an objection') : (L.objection || 'Widerspruch'));
  // Brief-Karte: Was muss ich tun? Bis wann? Was kostet es? (feste Regeln + Handlungen der KI)
  // Langes Datum und „noch X Tage“ für die Aufgabe oben
  const longDay = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString(I18N.locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  function daysChip(iso) {
    const n = Math.round((new Date(`${iso}T00:00:00`) - new Date(new Date().toDateString())) / 864e5);
    const t = n < 0 ? T('abgelaufen') : n === 0 ? T('heute') : n === 1 ? T('morgen') : T('noch {n} Tage', { n });
    return `<span class="days${n > 14 ? ' calm' : ''}">${t}</span>`;
  }
  function letterCard(L, r) {
    const day = (d) => new Date(`${d.iso}T00:00:00`).toLocaleDateString(I18N.locale); // aus dem Notizbuch kommt das Datum als Text
    const due = L.deadlines[0];
    const pay = L.amount && (L.iban || /rechnung|mahnung/.test(L.kind) || /nachzahlung|zu zahlen|offen|forderung/.test(L.amount.label));
    const obj = L.canObject ? L.deadlines.find((d) => /widerspruch|einspruch|rechtsbehelf/i.test(d.sentence)) : null;
    // Die eine Aufgabe groß, darunter das Datum; alles Weitere als Liste
    let big = null, bigDate = null;
    const todo = [];
    if (pay) { big = T('{a} bezahlen', { a: L.amount.text }); bigDate = due; }
    if (L.canObject) {
      const t = obj ? T('Bei Bedarf {w} einlegen', { w: objWord(L) }) : T('Prüfen, ob du {w} einlegen willst', { w: objWord(L) });
      if (!big) { big = t; bigDate = obj; } else todo.push(obj ? `${t} ${T('bis {d}', { d: day(obj) })}` : t);
    }
    if (!big && due) { big = T('Frist beachten'); bigDate = due; }
    const actions = (r.findings || []).filter((f) => f.kind === 'Handlung').slice(0, 3).map((f) => f.title);
    const kv = [];
    if (L.amount && !pay) kv.push([T('Betrag'), `<b>${esc(L.amount.text)}</b>`, '']);
    if (L.recipient) kv.push([T('An'), `<span data-noi18n>${esc(L.recipient)}</span>`, '']);
    if (L.iban) kv.push(['IBAN', `<code data-noi18n>${esc(L.iban)}</code>`, `<button class="link" data-copy="${esc(L.iban.replace(/\s+/g, ''))}">${T('Kopieren')}</button>`]);
    for (const ref of L.refs) kv.push([T(ref.label), `<code data-noi18n>${esc(ref.value)}</code>`, `<button class="link" data-copy="${esc(ref.value)}">${T('Kopieren')}</button>`]);
    L.deadlines.slice(0, 2).forEach((d, i) => { if (d !== bigDate) kv.push([T('Frist'), `<b>${day(d)}</b>${d.relative ? ` <span class="muted">${T(d.fromLetter ? '(ab Briefdatum)' : '(ca., ab heute)')}</span>` : ''}`, `<button class="link" data-ldl="${i}">${T('In den Kalender')}</button>`]); });
    const bigIdx = bigDate ? L.deadlines.indexOf(bigDate) : -1;
    return `<div class="letter rise">
      <div class="lh"><b>${T(L.label)}</b><span>${T('Was du tun musst')}</span></div>
      ${big ? `<div class="big">${esc(big)}</div>` : ''}
      ${bigDate ? `<div class="when2"><span>${T('bis {d}', { d: longDay(bigDate.iso) })}${bigDate.relative ? ` <span class="muted">${T(bigDate.fromLetter ? '(ab Briefdatum)' : '(ca., ab heute)')}</span>` : ''}</span>${daysChip(bigDate.iso)}</div>` : ''}
      ${todo.length || actions.length ? `<ul class="todo">${todo.map((t) => `<li><span>${esc(t)}</span></li>`).join('')}${actions.map((t) => `<li data-noi18n><span>${emphChecked(t)}</span></li>`).join('')}</ul>` : ''}
      ${kv.length ? `<div class="kv">${kv.map(([k, v, x]) => `<span>${k}</span><span>${v}</span><span>${x}</span>`).join('')}</div>` : ''}
      <div class="btnrow">${bigIdx >= 0 ? `<button class="btn primary" data-ldl="${bigIdx}">${T('In den Kalender')}</button>` : ''}<button class="btn" id="lReply">${T('Antwort schreiben')}</button></div>
      <div class="row"><button class="link" id="lExplain">${T('In meiner Sprache erklären')}</button></div>
      ${tplRow([...(L.canObject ? ['objection'] : []), ...(L.amount ? ['installments'] : []), 'extension', 'question'], L)}
    </div>`;
  }
  // ---------- Antwort-Vorlagen (Pro) ----------
  const PH = ' Lass fehlende Angaben als Platzhalter in [eckigen Klammern]. Nenne Datum des Schreibens und Aktenzeichen, Kunden-, Vertrags- oder Rechnungsnummer.';
  const TEMPLATES = {
    objection: (L) => [T('{w} schreiben', { w: objWord(L, true) }), `Schreibe einen sachlichen, höflichen ${L.objection || 'Widerspruch'} gegen dieses Schreiben (Überschrift: „${L.objection || 'Widerspruch'}“) und bitte um Bestätigung des Eingangs.${PH}`],
    installments: () => [T('Ratenzahlung'), `Schreibe eine höfliche Bitte um Ratenzahlung für den offenen Betrag. Schlage eine monatliche Rate von [Betrag] € ab [Datum] vor und bitte um schriftliche Bestätigung.${PH}`],
    extension: () => [T('Fristverlängerung'), `Schreibe eine höfliche Bitte um Verlängerung der Frist um [Anzahl] Wochen mit kurzer Begründung [Grund].${PH}`],
    question: () => [T('Rückfrage'), `Schreibe eine höfliche Rückfrage zu diesem Schreiben: Bitte um Erklärung von [Punkt] bzw. um Zusendung von [Unterlagen].${PH}`],
    cancel: () => [T('Kündigung'), `Schreibe eine Kündigung dieses Vertrags zum nächstmöglichen Termin. Bitte um schriftliche Bestätigung der Kündigung mit Datum des Vertragsendes.${PH}`],
  };
  const tplRow = (keys, L = {}) => `<div class="tpl"><span class="muted">${T('Vorlage:')}</span>${keys.map((k) => `<button class="link" data-tpl="${k}">${esc(TEMPLATES[k](L)[0])}</button>`).join('')}</div>`;

  // ---------- Vertrags-Check (Pro) ----------
  function contractCard(C) {
    const day = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString(I18N.locale);
    const mon = (n) => (n >= 12 && n % 12 === 0 ? T(n === 12 ? '{n} Jahr' : '{n} Jahre', { n: n / 12 }) : T(n === 1 ? '{n} Monat' : '{n} Monate', { n: Math.round(n * 10) / 10 }));
    const kv = [];
    if (C.term) kv.push([T('Laufzeit'), mon(C.term), '']);
    if (C.start) kv.push([T('Beginn'), day(C.start), '']);
    if (C.end) kv.push([T('Ende'), `<b>${day(C.end)}</b>`, '']);
    if (C.notice != null) kv.push([T('Kündigungsfrist'), mon(C.notice), '']);
    if (C.cancelBy) kv.push([T('Kündigen bis'), C.cancelPassed ? `<span class="warn">${day(C.cancelBy)} – ${T('verpasst')}</span>` : `<b>${day(C.cancelBy)}</b>`, C.cancelPassed ? '' : `<button class="link" data-cal="${C.cancelBy}">${T('In den Kalender')}</button>`]);
    if (C.renew) kv.push([T('Danach'), C.renew.months ? T('verlängert sich um {m}', { m: mon(C.renew.months) }) : C.renew.indefinite ? T('läuft unbefristet weiter') : T('verlängert sich automatisch'), '']);
    if (C.monthly) kv.push([T('Kosten'), T('{p} pro Monat', { p: C.monthly }), '']);
    return `<div class="letter contract rise">
      <div class="lh"><b>${T('Vertrag')}</b><span>${T('Laufzeit und Kündigung')}</span></div>
      ${C.cancelBy && !C.cancelPassed ? `<div class="big">${T('Kündigen bis {d}', { d: day(C.cancelBy) })}</div><div class="when2">${daysChip(C.cancelBy)}<span class="muted">${T('sonst verlängert sich der Vertrag')}</span></div>` : ''}
      ${kv.length ? `<div class="kv">${kv.map(([k, v, x]) => `<span>${k}</span><span>${v}</span><span>${x}</span>`).join('')}</div>` : ''}
      ${C.priceChange ? `<div class="note warn">${T('Preiserhöhungen sind möglich – bei einer Erhöhung hast du oft ein Sonderkündigungsrecht.')}</div>` : ''}
      ${C.monthlyAfter ? `<div class="note">${T('Gut zu wissen: Bei Verträgen ab März 2022 kannst du nach der Mindestlaufzeit meist monatlich kündigen.')}</div>` : ''}
      ${C.cancelBy && !C.cancelPassed ? `<div class="note">${T('Die Kündigungsfrist steht im Fristen-Netz – Silkreader erinnert dich rechtzeitig.')}</div>` : ''}
      <div class="btnrow"><button class="btn primary" data-tpl="cancel">${T('Kündigung schreiben')}</button><button class="btn" id="lExplain">${T('In meiner Sprache erklären')}</button></div>
    </div>`;
  }

  // Antwort/Widerspruch zum Brief schreiben – „Zurück“ führt wieder zum Ergebnis
  function replyToLetter(extra) {
    const saved = { P, result };
    setBack(function resultAgain() { P = saved.P; result = saved.result; showResult(); });
    P = { kind: 'transform', mode: 'reply', text: saved.P.doc.pages.join('\n\n'), extra };
    $('title').textContent = T('Antwort-Entwurf');
    transform();
  }

  // ---------- In meiner Sprache: Text für Menschen erklären, die kaum Deutsch können ----------
  async function explainPicker() {
    document.querySelector('.langpick')?.remove();
    const st = await window.spider.getSettings();
    const box = document.createElement('div');
    box.className = 'langpick rise';
    const weak = st.provider === 'builtin' && st.qualityPossible && !st.qualityReady;
    box.innerHTML = `<div class="h">${T('Erklären auf …')}</div>${weak ? `<div class="muted" style="margin:0 0 6px">${T('Tipp: Mit dem gründlichen KI-Modell werden andere Sprachen deutlich besser.')} <button class="link" id="qualityLink2">${T('Einstellungen')}</button></div>` : ''}<div class="chips" data-noi18n>${Object.entries(st.explainLangs).map(([k, n]) => `<button class="chip${k === st.explainLang ? ' on' : ''}" data-x="${k}" lang="${k}">${esc(n)}</button>`).join('')}</div>`;
    $('main').appendChild(box);
    $('qualityLink2')?.addEventListener('click', () => window.spider.openSettings());
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    box.addEventListener('click', (e) => {
      const code = e.target.closest('[data-x]')?.dataset.x; if (!code) return;
      const saved = { P, result };
      setBack(function resultAgain() { P = saved.P; result = saved.result; showResult(); });
      P = { kind: 'transform', mode: `explain:${code}`, text: saved.P.doc.pages.join('\n\n'), title: st.explainLangs[code] };
      $('title').textContent = st.explainLangs[code];
      transform();
    });
  }

  function showResult() {
    state = 'done';
    const r = result;
    const text = P.doc.pages.join('\n');
    srcNums = SilkFacts.numbersIn(text);
    $('title').textContent = r.title || P.doc.title;
    const L = r.letter || null;
    const deadlines = L ? [] : findDeadlines(text); // Briefe zeigen ihre Fristen in der Karte
    const figs = r.figures.slice(0, 8);
    $('main').innerHTML = `
      ${L ? letterCard(L, r) : r.letterLocked ? `<div class="letter locked"><div class="lh"><b>${T(r.letterLocked)}</b><span>${T('Was muss ich tun? Betrag, Frist, IBAN zum Kopieren')}</span></div><button class="link" id="lPro">${T('Mit Silkreader Pro anzeigen')}</button></div>` : ''}
      ${r.contract ? contractCard(r.contract) : r.contractLocked ? `<div class="letter locked"><div class="lh"><b>${T('Vertrag')}</b><span>${T('Laufzeit, Kündigen bis, Verlängerung')}</span></div><button class="link" id="cPro">${T('Mit Silkreader Pro anzeigen')}</button></div>` : ''}
      ${L || r.contract ? `<div class="h2">${T('Worum es geht')}</div>` : ''}
      <ul class="lead" data-noi18n>${bullets(r.summary).map((b) => `<li>${emphChecked(b)}</li>`).join('')}</ul>
      ${deadlines.map((d, i) => `<div class="dl">${silkIcon('calendar')}<span class="when">${d.date.toLocaleDateString(I18N.locale)}</span><span class="what" data-noi18n title="${esc(d.sentence)}">${esc(d.sentence)}</span><button class="link" data-dl="${i}">${T('In den Kalender')}</button></div>`).join('')}
      <button class="more" id="moreBtn">${T('Mehr aus dem Text')}</button>
      <div id="details">
        ${r.key_points.length ? `<div class="sec"><div class="h">Kernaussagen</div><ul data-noi18n>${r.key_points.map((p, i) => `<li class="jump" data-type="point" data-index="${i}">${emphChecked(p)}</li>`).join('')}</ul></div>` : ''}
        ${r.findings.length ? `<div class="sec"><div class="h">Erkenntnisse</div>${r.findings.map((f, i) => `<div class="find jump" data-type="finding" data-index="${i}"><span class="k">${esc(f.kind)}</span> <span data-noi18n>${emph(f.title)}</span>${f.detail ? `<div class="d" data-noi18n>${emph(f.detail)}</div>` : ''}</div>`).join('')}</div>` : ''}
        ${figs.length ? `<div class="sec"><div class="h">Angaben</div><div class="figs" data-noi18n>${figs.map((f, i) => `<span class="jump" data-type="figure" data-index="${i}">${esc(f.label)}</span><span><b>${esc(f.value)}</b>${ck(f)}</span>`).join('')}</div></div>` : ''}
        ${r.note ? `<div class="sec muted" data-noi18n>${esc(r.note)}</div>` : ''}
        <div class="sec quick"><button class="link" id="exPdf">${silkIcon('file')}${T('Als PDF speichern')}</button><button class="link" id="exPrint">${silkIcon('copy')}${T('Drucken')}</button></div>
      </div>
      <div id="answers"></div>
      <div class="aiNote">${r.checks?.unsure?.length ? `<span>${T('Gestrichelte Zahlen stehen so nicht im Text – bitte prüfen.')}</span> ` : ''}<span>${T('KI-Ergebnis. Beträge und Fristen bitte im Original prüfen.')}</span>${r.sentBytes === 0 ? `<br><span class="sent">${silkIcon('lock')}<span>${T('0 Bytes ins Internet gesendet')}</span></span>` : r.sentBytes ? `<br><span class="sent cloud">${silkIcon('cloud')}<span>${T('{kb} KB an Claude gesendet', { kb: Math.max(1, Math.round(r.sentBytes / 1024)) })}</span></span>` : ''}</div>`;
    $('moreBtn').addEventListener('click', () => {
      const open = $('details').classList.toggle('open');
      $('moreBtn').textContent = open ? T('Weniger anzeigen') : T('Mehr aus dem Text');
    });
    $('main').querySelectorAll('.jump').forEach((row) => row.addEventListener('click', () =>
      toggleLupe(row, { type: row.dataset.type, index: Number(row.dataset.index) })));
    const addCal = async (btn, d) => {
      const ok = await window.spider.addCalendar({ title: `${T('Frist')}: ${r.title || P.doc.title}`, date: d.iso, note: d.sentence });
      btn.textContent = ok ? T('Im Kalender geöffnet') : T('nicht möglich');
    };
    $('main').querySelectorAll('[data-dl]').forEach((btn) => btn.addEventListener('click', () => addCal(btn, deadlines[Number(btn.dataset.dl)])));
    $('main').querySelectorAll('[data-ldl]').forEach((btn) => btn.addEventListener('click', () => addCal(btn, L.deadlines[Number(btn.dataset.ldl)])));
    $('main').querySelectorAll('[data-copy]').forEach((btn) => btn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = T('Kopiert');
    }));
    $('lReply')?.addEventListener('click', () => replyToLetter(''));
    $('main').querySelectorAll('[data-tpl]').forEach((b) => b.addEventListener('click', () => replyToLetter(TEMPLATES[b.dataset.tpl](L || {})[1])));
    $('main').querySelectorAll('[data-cal]').forEach((b) => b.addEventListener('click', () => addCal(b, { iso: b.dataset.cal, sentence: T('Spätestens kündigen, sonst verlängert sich der Vertrag.') })));
    $('cPro')?.addEventListener('click', () => { const saved = { P, result }; setBack(function resultAgain() { P = saved.P; result = saved.result; showResult(); }); proView('contract'); });
    $('main').scrollTop = 0;
    footer({ ask: true, actions: [['Kopieren', copyResult], ['Vorlesen', () => speak(bullets(r.summary).join('. '))], ['Sprache', explainPicker], ['Festhalten', keepResult], ['Lesemodus', () => window.spider.openReader(P.doc, result, null)], ['Als PDF speichern', () => window.spider.exportResult(P.doc, result, 'pdf')], ['Drucken', () => window.spider.exportResult(P.doc, result, 'print')]] });
    $('lExplain')?.addEventListener('click', explainPicker);
    $('exPdf')?.addEventListener('click', async (e) => { const ok = await window.spider.exportResult(P.doc, result, 'pdf'); if (ok) e.target.closest('button').lastChild.textContent = T('Gespeichert'); });
    $('exPrint')?.addEventListener('click', () => window.spider.exportResult(P.doc, result, 'print'));
    $('lPro')?.addEventListener('click', () => { const saved = { P, result }; setBack(function resultAgain() { P = saved.P; result = saved.result; showResult(); }); proView('letter'); });
    maybeAskReview();
  }

  // ---------- Bewertung: nach ein paar erfolgreichen Nutzungen einmal fragen ----------
  async function maybeAskReview() {
    const at = run;
    if (!(await window.spider.reviewState()) || state !== 'done' || at !== run || document.querySelector('.review')) return;
    const box = document.createElement('div');
    box.className = 'review rise';
    box.innerHTML = `<div>${T('Hilft dir die Spinne? Eine kurze Bewertung im Store hilft ihr sehr.')}</div>
      <div class="row"><button class="link" data-r="yes">${T('Ja, bewerten')}</button><button class="link dim" data-r="meh">${T('Geht so')}</button><button class="link dim" data-r="later">${T('Später')}</button></div>`;
    $('main').appendChild(box);
    box.addEventListener('click', (e) => {
      const a = e.target.closest('[data-r]')?.dataset.r; if (!a) return;
      window.spider.reviewAnswer(a);
      if (a === 'yes') box.innerHTML = T('Danke! 🕷');
      else if (a === 'meh') { box.innerHTML = `${T('Schade – was können wir besser machen?')} <button class="link" id="revRep">${T('Problem melden')}</button>`; $('revRep').addEventListener('click', () => { setBack(null); report(); }); }
      else box.remove();
    });
  }

  // ---------- Vorlesen (Windows-Stimmen, offline) – die Spinne bewegt dabei den Mund ----------
  let speaking = false;
  const VOICE_LANG = { de: 'de-DE', en: 'en-US', tr: 'tr-TR', ar: 'ar-SA', uk: 'uk-UA', ru: 'ru-RU', pl: 'pl-PL', ro: 'ro-RO' };
  function speak(text, label = 'Vorlesen', langCode = null) {
    const synth = window.speechSynthesis;
    if (speaking) { synth.cancel(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const voices = synth.getVoices();
    const lang = langCode || (/[äöüß]|\b(der|die|und|ist)\b/i.test(text) ? 'de' : 'en');
    u.voice = voices.find((v) => v.lang.toLowerCase().startsWith(lang)) || null;
    u.lang = VOICE_LANG[lang] || 'en-US';
    u.rate = 1.05;
    const btn = $('foot').querySelector(`[data-a="${label}"]`);
    const set = (on) => {
      speaking = on;
      window.spider.rigTalk(on);
      if (btn) btn.innerHTML = `${silkIcon(on ? 'stop' : 'speak')}<span>${on ? 'Stopp' : label}</span>`;
    };
    u.onend = u.onerror = () => set(false);
    set(true);
    synth.speak(u);
  }
  const stopSpeaking = () => { if (speaking) window.speechSynthesis.cancel(); };

  // ---------- Frage an den Text ----------
  // Fragen an die Spinne selbst beantwortet sie ohne KI (und freut sich)
  const SMALLTALK = [
    [/^(hallo|hi|hey|moin|servus|hello)\b[\s!.,]*(spinne|silk\w*|spider)?[\s!.]*$/i, 'Hallo! Schön, dass du da bist.', 'hello'],
    [/wer bist du|was bist du|who are you|what are you/i, 'Ich bin Silkreader, eine kleine Spinne. Ich lese deine Briefe hier auf dem PC und erkläre sie dir.', 'flip'],
    [/^(danke|vielen dank|thanks|thank you)\b/i, 'Gern geschehen!', 'heart'],
    [/sinn des lebens|meaning of life|^42$/i, '42. Aber frag mich lieber etwas zu deinem Text.', 'twirl'],
    [/magst du (mich|fliegen)|do you like (me|flies)/i, 'Fliegen? Lieber Briefe. Und dich mag ich sowieso.', 'heart'],
  ];
  async function ask(q) {
    const talk = SMALLTALK.find(([re]) => re.test(q.trim()));
    if (talk) {
      const box = document.createElement('div');
      box.className = 'answer';
      box.innerHTML = `<div class="q">${esc(q)}</div><div class="a">${esc(T(talk[1]))}</div>`;
      $('answers').appendChild(box);
      box.scrollIntoView({ block: 'nearest' });
      window.spider.easterEgg(talk[2]);
      return;
    }
    const box = document.createElement('div');
    box.className = 'answer';
    box.innerHTML = `<div class="q">${esc(q)}</div><div class="a muted">Die Spinne sucht …</div>`;
    $('answers').appendChild(box);
    box.scrollIntoView({ block: 'nearest' });
    const res = await window.spider.ask(P.doc, q);
    const a = box.querySelector('.a');
    if (!res.ok) { a.className = 'a error'; a.textContent = res.error; return; }
    a.className = 'a';
    a.innerHTML = emph(res.answer) + (res.quote ? ` <button class="link">Stelle zeigen →</button>` : '');

  // ---------- Lupe: wo steht das im Text? ----------
  function queryFor(focus) {
    if (focus.type === 'figure') { const f = result.figures[focus.index]; return f ? (f.quote || `${f.label} ${f.value}`) : ''; }
    if (focus.type === 'point') return result.key_points[focus.index] || '';
    if (focus.type === 'finding') { const f = result.findings[focus.index]; return f ? `${f.title} ${f.detail}` : ''; }
    return focus.quote || '';
  }
  const tokens = (q) => (q.toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N},.%€-]*/gu) || [])
    .map((t) => t.replace(/[.,]+$/, '')).filter((t) => t.length > 3 || /\d/.test(t));
  const numKey = (t) => t.replace(/[.\s]/g, '').replace(',', '.');
  function findSource(query, text) {
    if (!query.trim()) return null;
    // 1. wörtlich (Zitat), Leerräume egal
    const words = query.trim().split(/\s+/);
    if (words.length >= 3) {
      const re = new RegExp(words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+'), 'i');
      const m = re.exec(text);
      if (m) return around(text, m.index, m.index + m[0].length);
    }
    // 2. Satz mit den meisten gemeinsamen Wörtern (Zahlen zählen dreifach)
    const want = tokens(query);
    if (!want.length) return null;
    const sents = [...text.matchAll(/[^.!?\n]+(?:[.!?]+|\n|$)/g)];
    let best = null, bestScore = 0;
    for (const m of sents) {
      const have = new Set(tokens(m[0]).map((t) => (/\d/.test(t) ? numKey(t) : t)));
      let score = 0;
      for (const t of want) if (have.has(/\d/.test(t) ? numKey(t) : t)) score += /\d/.test(t) ? 3 : 1;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    if (!best || bestScore < 2) return null;
    const lead = best[0].length - best[0].trimStart().length;
    return around(text, best.index + lead, best.index + best[0].trimEnd().length);
  }
  function around(text, start, end) {
    let a = Math.max(0, text.lastIndexOf('.', start - 2) + 1, start - 160);
    let b = text.indexOf('.', end + 1); b = Math.min(b < 0 ? text.length : b + 1, end + 160);
    return { start, end, before: text.slice(a, start).replace(/\s+/g, ' ').trimStart(), hit: text.slice(start, end), after: text.slice(end, b).replace(/\s+/g, ' ').trimEnd(), cutA: a > 0, cutB: b < text.length };
  }
  function toggleLupe(anchor, focus, afterEl = null) {
    // In der Zahlentabelle hinter dem Wert einfügen (über beide Spalten)
    if (anchor.parentElement?.classList.contains('figs')) anchor = anchor.nextElementSibling;
    const next = (afterEl || anchor).nextElementSibling;
    if (next?.classList.contains('lupe')) { next.remove(); return; }
    document.querySelectorAll('.lupe').forEach((l) => l.remove());
    const text = P.doc.pages.join('\n\n');
    const src = findSource(queryFor(focus), text);
    const box = document.createElement('div');
    box.className = 'lupe';
    box.dataset.noi18n = '';
    box.innerHTML = src
      ? `${src.cutA ? '… ' : ''}${esc(src.before)}<mark>${emph(src.hit)}</mark>${esc(src.after)}${src.cutB ? ' …' : ''}`
      : `<span class="none">${T('Diese Stelle steht so nicht wörtlich im Text.')}</span>`;
    const row = document.createElement('div');
    row.className = 'row';
    // Die Lupe zeigt Dokumenttext (nie übersetzen) – ihre Knöpfe deshalb direkt übersetzt einsetzen
    if (src && P.doc.screenAt) row.innerHTML += `<button class="link" data-l="screen">${T('Auf dem Bildschirm zeigen')}</button>`;
    row.innerHTML += `<button class="link" data-l="reader">${T('Im Lesemodus')}</button>`;
    box.appendChild(row);
    row.querySelector('[data-l="screen"]')?.addEventListener('click', async (e) => {
      const ok = await window.spider.showOnScreen({ screenAt: P.doc.screenAt, start: src.start, end: src.end });
      if (!ok) e.target.textContent = T('nicht mehr auf dem Bildschirm');
    });
    row.querySelector('[data-l="reader"]').addEventListener('click', () => window.spider.openReader(P.doc, result, focus));
    (afterEl ? afterEl.closest('.answer') || anchor : anchor).after(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

      $(id).addEventListener('change', (e) => window.spider.saveSettings({ [id === 'hatch' ? 'hatchAnimation' : id]: e.target.checked }));
    }
    footer({ actions: [['Tastenkürzel & mehr …', () => window.spider.openSettings()], ['Über', () => { setBack(settings); about(); }]] });
  }

  // ---------- Über Silkreader ----------
  // ---------- Silkreader Pro ----------
  async function proView(feature = null) {
    state = 'done';
    $('title').textContent = 'Silkreader Pro';
    const st = await window.spider.proState();
    const until = st.until ? new Date(st.until).toLocaleDateString(I18N.locale) : null;
    const list = Object.entries(st.features).map(([k, n]) => `<li class="${k === feature ? 'hit' : ''}"><span>${T(n)}</span></li>`).join('');
    $('main').innerHTML = `
      ${st.active
        ? `<div class="pro-on">✓ ${T('Pro ist aktiv')}${st.source === 'code' ? ` <span class="muted">· ${until ? T('per Code, gültig bis {d}', { d: until }) : T('per Code, unbegrenzt')}</span>` : st.source === 'store' ? ` <span class="muted">· ${T('über den Microsoft Store')}</span>` : ''}</div>`
        : feature ? `<p class="pro-why">${T('{f} gibt es mit Silkreader Pro.', { f: T(st.features[feature] || feature) })}</p>` : `<p class="pro-why">${T('Mehr aus deinen Briefen holen.')}</p>`}
      <ul class="pro-list">${list}</ul>
      <p class="muted" style="margin:4px 0 10px">${T('Immer frei: Zusammenfassen, Fragen an den Text, Fristen, Notizbuch, In deiner Sprache.')}</p>
      ${st.active ? '' : `${st.comingSoon ? `<p class="pro-soon">${T('Kommt bald')}</p>` : st.canBuy ? `<button class="go" id="proBuy">${T('Pro im Microsoft Store holen')}</button>` : st.viaStoreApp ? `<p class="muted" style="margin:0 0 8px">${T('Pro kaufen geht in der Silkreader-Version aus dem Microsoft Store.')}</p><button class="go" id="proBuy">${T('Silkreader im Microsoft Store öffnen')}</button>` : ''}
      <div class="set" style="margin-top:12px"><div class="h">${T('Du hast einen Code?')}</div>
        <div class="coderow"><input class="ask" id="proCode" placeholder="SILK-…" spellcheck="false" data-noi18n><button class="go small" id="proRedeem">${T('Einlösen')}</button></div>
        <div class="muted" id="proMsg"></div></div>`}`;
    $('proBuy')?.addEventListener('click', async () => {
      await window.spider.proBuy();
      // Nach dem Kauf im Store: beim Zurückkommen Lizenz neu prüfen
      window.addEventListener('focus', async function again() { window.removeEventListener('focus', again); const s2 = await window.spider.proRefresh(); if (s2.active) proView(); }, { once: true });
    });
    const redeem = async () => {
      const code = $('proCode').value.trim(); if (!code) return;
      const r = await window.spider.proRedeem(code);
      if (r.ok) { proView(); flashTitle(T('Pro ist aktiv ✓')); } else { $('proMsg').textContent = r.error; $('proMsg').className = 'error'; }
    };
    $('proRedeem')?.addEventListener('click', redeem);
    $('proCode')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') redeem(); });
    $('foot').classList.add('hidden');
  }
  const flashTitle = (t) => { const el = $('title'); const old = el.textContent; el.textContent = t; setTimeout(() => { if (el.textContent === t) el.textContent = old; }, 2200); };

  async function about() {
    state = 'done';
    $('title').textContent = 'Über Silkreader';
    const info = await window.spider.appInfo();
    $('main').innerHTML = `<div class="about">
      <svg class="sp" id="aboutSpider" viewBox="-36 -30 72 60"><g stroke="var(--pink)" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 -5L18 -15L24 -4M10 -1L21 -7L28 4M10 3L20 2L26 13M8 7L16 9L20 20M-8 -5L-18 -15L-24 -4M-10 -1L-21 -7L-28 4M-10 3L-20 2L-26 13M-8 7L-16 9L-20 20"/></g>
        <circle r="11" fill="#2b2b2b" stroke="var(--pink)" stroke-width="1.2"/><ellipse cx="-4.4" cy="-1.6" rx="3.9" ry="4.4" fill="#fff"/><ellipse cx="4.4" cy="-1.6" rx="3.9" ry="4.4" fill="#fff"/>
        <circle cx="-4" cy="-1" r="1.9" fill="#111"/><circle cx="4.8" cy="-1" r="1.9" fill="#111"/><path d="M-2.6 5.4Q0 8.4 2.6 5.4" stroke="var(--pink)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <h2>Silkreader</h2><div class="v">Version ${esc(info.version)}</div>
      <p>Eine Spinne, die für dich liest.</p>
      <p>Zusammenfassungen und Antworten erstellt eine KI. Sie kann sich irren – bei Verträgen, Fristen und Zahlen bitte immer das Original prüfen.</p>
      <div class="linklist">
        <button class="link" id="aPriv">${silkIcon('info')}<span>Datenschutz</span></button>
        <button class="link" id="aLic">${silkIcon('file')}<span>Lizenzen</span></button>
        <button class="link" id="aNew">${silkIcon('notebook')}<span>Was ist neu?</span></button>
        <button class="link" id="aRep">${silkIcon('bug')}<span>Problem melden</span></button>
        <button class="link" id="aPro">${silkIcon('keep')}<span>Silkreader Pro</span></button>
      </div>
      <div class="v" style="margin-top:12px">© 2026 Sebbilore · ${T('Alle Rechte vorbehalten')}</div></div>`;
    $('aPriv').addEventListener('click', () => window.spider.openPrivacy());
    $('aLic').addEventListener('click', () => window.spider.openLicenses());
    $('aNew').addEventListener('click', () => window.spider.openExternal(`${info.downloadRepo}/releases`));
    $('aRep').addEventListener('click', () => { setBack(about); report(); });
    $('aPro').addEventListener('click', () => { setBack(about); proView(); });
    // Fünfmal auf die Spinne klicken: Sie dreht sich und verrät etwas über sich
    let pokes = 0;
    $('aboutSpider').style.cursor = 'pointer';
    $('aboutSpider').addEventListener('click', (e) => {
      const sp = e.currentTarget;
      sp.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: 500, easing: 'ease-out' });
      if (++pokes === 5) {
        pokes = 0;
        window.spider.easterEgg('dance');
        sp.insertAdjacentHTML('afterend', `<p class="muted" style="text-align:center">${T('Gebaut aus acht Beinen Neugier und sehr viel Seide.')}</p>`);
      }
    });
    $('foot').classList.add('hidden');
  }

  // ---------- Problem melden ----------
  function report() {
    state = 'done';
    $('title').textContent = 'Problem melden';
    $('main').innerHTML = `<p class="muted" style="margin:0 0 8px">Beschreibe kurz, was passiert ist. Beim Senden öffnet sich GitHub im Browser – dort siehst du alles, bevor es abgeschickt wird (GitHub-Konto nötig).</p>
      <textarea class="in rep" id="repText" placeholder="Was ist passiert?"></textarea>
      <label class="tog"><input type="checkbox" id="repLog" checked> Protokoll der letzten Abläufe anhängen (keine Texte, nur technische Schritte)</label>`;
    footer({ actions: [['Im Browser öffnen', async () => {
      if (!$('repText').value.trim()) { $('repText').focus(); return; }
      await window.spider.reportProblem({ text: $('repText').value.trim(), withLog: $('repLog').checked });
      close();
    }], ['Protokoll öffnen', () => window.spider.openLog()]] });
    setTimeout(() => $('repText')?.focus(), 60);
  }

  // ---------- Zurück ----------
  let backFn = null;
  function setBack(fn) { backFn = fn; $('back').classList.toggle('hidden', !fn); }
  $('back').addEventListener('click', () => { const fn = backFn; setBack(null); run++; document.querySelectorAll('.lupe').forEach((l) => l.remove()); if (fn) { P = { kind: fn.name, mode: P.mode }; fn(); } });

  // ---------- Hilfen ----------
  const toggleMenu = (open) => { const m = $('actMenu'); if (!m) return; m.classList.toggle('hidden', !open); $('moreActs').setAttribute('aria-expanded', String(open)); if (open) m.querySelector('.link')?.focus(); };
  document.addEventListener('click', (e) => { if (!e.target.closest('#actMenu, #moreActs')) toggleMenu(false); });
  // Fußleiste: die wichtigsten Aktionen sichtbar, der Rest im „…“-Menü
  function footer({ ask: withAsk = false, actions = [], visible = null }) {
    const f = $('foot');
    const n = visible ?? (actions.length <= 4 ? actions.length : 3);
    const btn = ([l]) => `<button class="link" data-a="${l}">${ACTION_ICONS[l] ? silkIcon(ACTION_ICONS[l]) : ''}<span>${T(l)}</span></button>`;
    const rest = actions.slice(n);
    f.innerHTML = `${withAsk ? `<input class="ask" id="askIn" placeholder="${T('Frage zum Text stellen')}" aria-label="${T('Frage zum Text stellen')}">` : ''}<div class="actions">${actions.slice(0, n).map(btn).join('')}${rest.length ? `<span class="spacer"></span><button class="link mbtn" id="moreActs" aria-label="${T('Weitere Aktionen')}" aria-haspopup="menu" aria-expanded="false">${silkIcon('more')}</button><div class="menu hidden" id="actMenu" role="menu">${rest.map(btn).join('')}</div>` : ''}</div>`;
    actions.forEach(([l, fn]) => f.querySelector(`[data-a="${l}"]`).addEventListener('click', (e) => { if (e.currentTarget.closest('.menu')) toggleMenu(false); fn(); }));
    $('moreActs')?.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu($('actMenu').classList.contains('hidden')); });
    $('askIn')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) { ask(e.target.value.trim()); e.target.value = ''; }
    });
    f.classList.remove('hidden');
  }
  const ACTION_ICONS = { 'Alle Änderungen': 'notebook', 'Im Browser öffnen': 'send', 'Protokoll öffnen': 'file', 'Über': 'info', Vorlesen: 'speak', Kürzer: 'shorter', Förmlicher: 'tone', Lockerer: 'tone', Kopieren: 'copy', Festhalten: 'keep', 'Als PDF speichern': 'file', Drucken: 'file', Lesemodus: 'reader', Sprache: 'translate', Fristen: 'calendar', Notizbuch: 'notebook', Einstellungen: 'settings', 'Tastenkürzel & mehr …': 'settings', 'Erneut versuchen': 'send' };
  function flash(label, text) { const b = $('foot').querySelector(`[data-a="${label}"] span`); if (!b) return; b.textContent = T(text); setTimeout(() => (b.textContent = T(label)), 1300); }
  function showError(res, retry) {
    state = 'error';
    $('main').innerHTML = `<p class="error">${esc(res.error)}</p>`;
    footer({ actions: [['Erneut versuchen', retry], ...(res.needsKey ? [['Einstellungen', () => window.spider.openSettings()]] : [])] });
  }
  function markdown(r) {
    return [`# ${r.title}`, '', ...bullets(r.summary).map((b) => `- ${b}`), '', `## ${T('Kernaussagen')}`, ...r.key_points.map((p) => `- ${p}`), '',
      `## ${T('Erkenntnisse')}`, ...r.findings.map((f) => `- **[${T(f.kind)}] ${f.title}** – ${f.detail}`), '',
      `## ${T('Angaben')}`, ...r.figures.map((f) => `- ${f.label}: ${f.value} (${T(`S. ${f.page}`)})`)].join('\n');
  }
  async function copyResult() { await navigator.clipboard.writeText(markdown(result)); flash('Kopieren', 'Kopiert'); }
  async function keepResult() { await window.spider.cocoonAddText(markdown(result)); flash('Festhalten', 'Im Netz'); }
  function close() {
    stopSpeaking();
    run++; state = 'idle';
    $('bubble').classList.add('closing');
    setTimeout(() => window.spider.popupClose(), 160);
  }
  $('close').addEventListener('click', close);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && state === 'done' && P.kind === 'analyze' && !getSelection().toString() && document.activeElement?.id !== 'askIn') { e.preventDefault(); copyResult(); }
  });

  // Fenstergröße an den Inhalt anpassen (sonst schluckt der leere Rest Klicks)
  let sizeQueued = false;
  function reportSize() {
    if (sizeQueued) return;
    sizeQueued = true;
    requestAnimationFrame(() => {
      sizeQueued = false;
      const head = document.querySelector('header').offsetHeight;
      const foot = $('foot').classList.contains('hidden') ? 0 : $('foot').offsetHeight;
      window.spider.popupSize(14 + head + $('main').scrollHeight + foot + 14);
    });
  }
  new MutationObserver(reportSize).observe($('bubble'), { childList: true, subtree: true, characterData: true, attributes: true });
  // Kleine Bedien-Blasen schließen sich, wenn man woanders hinklickt
  let busyDialog = false;
  window.addEventListener('blur', () => setTimeout(() => {
    if (busyDialog || document.hasFocus() || !P || !['home', 'notebook', 'settings'].includes(P.kind)) return;
    if ($('homeIn')?.value.trim()) return;
    close();
  }, 250));

  // Bleibt der Text auf dem PC oder geht er an Claude? Klein im Kopf der Blase anzeigen
  async function showWhere() {
    const el = $('where');
    if (!['analyze', 'transform', 'compare'].includes(P.kind) || (P.kind === 'analyze' && P.result)) { el.classList.add('hidden'); return; }
    const st = await window.spider.getSettings();
    const cloud = st.provider === 'claude';
    el.className = `where${cloud ? ' cloud' : ''}`;
    el.innerHTML = `${silkIcon(cloud ? 'cloud' : 'lock')}<span>${T(cloud ? 'an Claude' : 'auf diesem PC')}</span>`;
    el.title = T(cloud ? 'Dieser Text wird an Claude (Anthropic) geschickt.' : 'Dieser Text bleibt auf deinem PC.');
  }

  // ---------- Was ist neu? ----------
  function whatsNew() {
    state = 'done';
    $('title').textContent = T('Neu in Silkreader {v}', { v: P.version });
    $('main').innerHTML = `<ul class="news" data-noi18n>${P.items.map((x) => `<li class="rise">${esc(x)}</li>`).join('')}</ul>`;
    footer({ actions: [['Alle Änderungen', () => window.spider.openExternal('https://github.com/Sebbilore/silkreader-download/blob/main/CHANGELOG.md')], ['OK', close]] });
  }

  window.spider.onPopupDoc((payload) => {
    stopSpeaking();
    P = payload; result = null; run++;
    showWhere();
    setBack(null);
    document.documentElement.style.setProperty('--arrow', `${payload.arrow}px`);
    $('bubble').classList.remove('closing');
    $('bubble').style.animation = 'none'; void $('bubble').offsetWidth; $('bubble').style.animation = '';
    $('foot').classList.add('hidden');
    if (P.kind === 'analyze' && P.result) { result = P.result; showResult(); }
    else if (P.kind === 'analyze') { $('title').textContent = P.doc.title; analyze(); }
    else if (P.kind === 'home') home();
    else if (P.kind === 'notebook') notebook();
    else if (P.kind === 'deadlines') deadlines();
    else if (P.kind === 'pro') proView(P.feature || null);
    else if (P.kind === 'settings') settings();
    else if (P.kind === 'about') about();
    else if (P.kind === 'whatsnew') whatsNew();
    else if (P.kind === 'report') report();
    else if (P.kind === 'transform') { $('title').textContent = P.title; transform(); }
    else if (P.kind === 'compare') { $('title').textContent = P.title; compare(); }
    else { state = 'done'; $('title').textContent = P.title; $('main').innerHTML = `<p>${esc(P.text)}</p>`; footer({ actions: [['OK', close]] }); }
  });
</script>
</body>
</html>
