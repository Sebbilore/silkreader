<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Silkreader</title>
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<script src="a11y.js"></script>
<script src="icons.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13.5px/1.6 var(--font); color: var(--text); }
  /* Die Blase hängt an einem Seidenfaden unter der Spinne */
  #bubble { position: absolute; left: 10px; right: 10px; top: 16px; max-height: calc(100% - 26px); border-radius: var(--r-l);
    display: flex; flex-direction: column; transform-origin: var(--arrow, 50%) 0; animation: silk-pop var(--t-slow) var(--ease-spring); }
  #bubble.closing { animation: silk-out .18s ease-in forwards; }
  #bubble::before { content: ''; position: absolute; left: 18%; right: 18%; top: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent); opacity: .7; }
  #thread { position: absolute; top: 0; left: calc(var(--arrow, 50%) - 6px); width: 12px; height: 20px; overflow: visible; pointer-events: none; }
  #thread line { stroke: var(--silk); stroke-width: 1; }
  #thread circle { fill: var(--dew); filter: drop-shadow(0 0 2px rgba(255,255,255,.8)); }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 4px 18px; -webkit-app-region: drag; }
  header .t { font: 600 11.5px var(--font); letter-spacing: .2px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { -webkit-app-region: no-drag; background: none; border: none; color: var(--faint); cursor: pointer; padding: 2px; line-height: 0; border-radius: 6px;
    transition: color var(--t-fast), background var(--t-fast); }
  .x:hover { color: var(--text); background: var(--line); }
  .x .icon { width: 14px; height: 14px; }
  main { overflow: auto; padding: 4px 18px 6px; min-height: 40px; }
  main::-webkit-scrollbar { width: 6px; } main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  b { color: #fff; font-weight: 650; }
  .rise { animation: silk-rise .42s var(--ease-out) both; }
  ul { margin: 0; padding-left: 16px; } li { margin: 0 0 8px; } li::marker { color: var(--pink); }
  .lead li { font-size: 14px; }
  .muted { color: var(--muted); font-size: 12px; }
  .weave { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; }
  .weave svg { width: 26px; height: 26px; flex: none; overflow: visible; }
  .weave .sp { stroke: var(--silk); stroke-width: .7; opacity: .55; }
  .weave .spiral { fill: none; stroke: var(--pink); stroke-width: 1.1; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--pink-glow));
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset .5s var(--ease-out); }
  .weave.indet svg { animation: silk-spin 6s linear infinite; }
  .weave.indet .spiral { animation: weaveLoop 1.8s var(--ease-out) infinite; }
  @keyframes weaveLoop { 0% { stroke-dashoffset: var(--len); opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .stage { color: var(--muted); font-size: 12.5px; }
  .cur { color: var(--pink); animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } }
  /* "Mehr ▾": alles Weitere ausgeklappt */
  .more { background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 0; transition: color var(--t-fast); }
  .more:hover { color: var(--pink); }
  #details { display: none; padding-top: 6px; } #details.open { display: block; }
  .sec { margin: 10px 0 0; } .sec > .h { font-size: 11px; color: var(--muted); letter-spacing: .3px; margin-bottom: 4px; }
  .jump { cursor: pointer; border-radius: 6px; } .jump:hover { color: #fff; text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 3px; }
  .find { padding-left: 10px; border-left: 1.5px solid var(--pink); margin-bottom: 8px; }
  .find .k { font-size: 10.5px; color: var(--pink); text-transform: uppercase; letter-spacing: .6px; }
  .find .d { color: var(--muted); font-size: 12px; }
  .figs { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 12.5px; }
  .figs span:nth-child(odd) { color: var(--muted); } .figs span:nth-child(even) { text-align: right; }
  .dl { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; margin: 6px 0; }
  .dl .when { font-weight: 650; white-space: nowrap; } .dl .what { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link { background: none; border: none; color: var(--pink); font: inherit; font-size: 12px; cursor: pointer; padding: 0; white-space: nowrap; }
  .link:hover { text-decoration: underline; }
  .answer { margin: 10px 0 2px; padding: 10px 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: var(--r-m); animation: silk-rise .35s var(--ease-out); }
  .answer .q { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .out { white-space: pre-wrap; }
  .error { color: #ffc2d8; }
  footer { padding: 8px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
  .ask { width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: var(--r-pill); color: var(--text); font: inherit; font-size: 12.5px;
    padding: 6px 14px; outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  .ask:focus { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); } .ask::placeholder { color: var(--faint); }
  .actions { display: flex; gap: 16px; flex-wrap: wrap; }
  .actions .link { color: var(--muted); display: inline-flex; align-items: center; gap: 5px; transition: color var(--t-fast); }
  .actions .link .icon { width: 13px; height: 13px; }
  .actions .link:hover { color: var(--pink); text-decoration: none; }
  .hidden { display: none !important; }
  .aiNote { font-size: 10.5px; color: var(--faint); margin: 10px 0 2px; }
  .where { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .where .icon { width: 13px; height: 13px; }
  .where.cloud { color: var(--pink-2); }
  .news li { margin-bottom: 9px; }
  .about { text-align: center; padding: 4px 0 6px; }
  .about svg.sp { width: 64px; height: 64px; }
  .about h2 { font: 650 17px var(--font-display); margin: 6px 0 0; }
  .about .v { color: var(--muted); font-size: 12px; }
  .about p { color: var(--muted); font-size: 12.5px; margin: 10px 0; text-align: left; }
  .linklist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 8px 0 4px; text-align: left; }
  .linklist .link { display: inline-flex; gap: 6px; align-items: center; color: var(--text); } .linklist .link:hover { color: var(--pink); }
  .linklist .icon { width: 14px; height: 14px; color: var(--muted); }
  textarea.rep { height: 90px; }
  /* Zurück-Pfeil im Kopf */
  .back:hover { color: var(--pink); }
  /* Lupe: Originalstelle direkt in der Blase */
  .lupe { margin: 4px 0 10px; padding: 9px 12px; background: rgba(255,255,255,.035); border: 1px solid var(--line); border-left: 2px solid var(--pink);
    border-radius: var(--r-s) var(--r-m) var(--r-m) var(--r-s); font-size: 12.5px; color: var(--muted); animation: silk-rise .3s var(--ease-out); }
  .lupe mark { background: var(--pink-soft); color: var(--text); border-radius: 3px; padding: 0 2px; box-shadow: inset 0 -1.5px 0 var(--pink); }
  .lupe .row { display: flex; gap: 14px; margin-top: 6px; }
  .figs .lupe { grid-column: 1 / -1; }
  .lupe .none { font-style: italic; }
  /* Mini-Blase: einfügen, Zwischenablage, Datei */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .chip { background: rgba(255,255,255,.03); border: 1px solid var(--line); color: var(--muted); font: inherit; font-size: 11.5px; border-radius: var(--r-pill);
    padding: 2px 11px; cursor: pointer; transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast); }
  .chip:hover { color: var(--text); border-color: var(--line-2); } .chip.on { border-color: var(--pink); color: #fff; background: var(--pink-soft); }
  textarea.in { width: 100%; resize: none; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: var(--r-m); color: var(--text);
    font: inherit; font-size: 13px; padding: 9px 12px; outline: none; height: 64px; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  textarea.in:focus { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
  textarea.in::placeholder { color: var(--faint); }
  .quick .link { display: inline-flex; align-items: center; gap: 6px; } .quick .link .icon { width: 14px; height: 14px; color: var(--muted); }
  .quick { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 2px; }
  .quick .link { color: var(--text); } .quick .link:hover { color: var(--pink); }
  .clip { font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .icon { width: 13px; height: 13px; vertical-align: -2px; }
  .clip:hover { color: var(--text); }
  .entry { padding: 6px 0; cursor: pointer; display: flex; gap: 10px; align-items: baseline; border-top: 1px solid var(--line); }
  .entry:first-child { border-top: none; }
  .entry .t { flex: 1; min-width: 0; } .entry b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry small { color: var(--muted); font-size: 11px; }
  .entry:hover b { color: var(--pink); }
  .entry .del { background: none; border: none; color: var(--muted); cursor: pointer; visibility: hidden; padding: 0 2px; }
  .entry:hover .del { visibility: visible; } .entry .del:hover { color: var(--pink); }
  /* Einstellungen in der Blase */
  .set { margin: 0 0 12px; } .set > .h { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .set select { background: rgba(255,255,255,.04); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 12.5px; padding: 3px 6px; }
  .tog { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 6px 0; cursor: pointer; }
  .tog input { accent-color: #ff2d8a; }
</style>
</head>
<body>
<svg id="thread" viewBox="0 0 12 20"><line x1="6" y1="0" x2="6" y2="16"/><circle cx="6" cy="16" r="1.6"/></svg>
<div id="bubble" class="glass">
  <header><button class="back x hidden" id="back" title="Zurück"></button><span class="t" id="title">Silkreader</span><span class="where hidden" id="where"></span><button class="x" id="close" title="Schließen (Esc)"></button></header>
  <main id="main"></main>
  <footer id="foot" class="hidden"></footer>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Zahlen, Beträge und Prozente fett
  const emph = (s) => esc(s).replace(/(\d[\d.,]*\s?(?:%|€|Prozent|Euro|Mio\.?|Mrd\.?|Millionen|Milliarden|Tage|Monate|Jahre)?)/g, '<b>$1</b>');
  function bullets(text) {
    let parts = String(text || '').split(/\n+|\s*•\s*/).map((t) => t.replace(/^[-–*]\s+/, '').trim()).filter(Boolean);
    if (parts.length === 1 && parts[0].length > 160) parts = parts[0].split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ0-9])/);
    return parts;
  }

  let P = null, result = null, state = 'idle', run = 0;
  $('close').innerHTML = silkIcon('close');
  $('back').innerHTML = silkIcon('back');
  $('close').setAttribute('aria-label', T('Schließen'));
  $('back').setAttribute('aria-label', T('Zurück'));
  document.getElementById('bubble').setAttribute('role', 'dialog');
  document.getElementById('main').setAttribute('aria-live', 'polite'); // Ergebnisse werden vorgelesen, sobald sie da sind

  // Fortschritt als Spinnennetz, das gewebt wird (ohne Schritte: in Dauerschleife)
  const SPIRAL = (() => { let d = '', n = 8 * 3.2; for (let k = 0; k <= n; k++) { const a = (k / 8) * Math.PI * 2 - Math.PI / 2, r = 2 + (k / n) * 9; d += `${k ? 'L' : 'M'}${(Math.cos(a) * r).toFixed(2)} ${(Math.sin(a) * r).toFixed(2)}`; } return d; })();
  const weave = (label) => `<div class="weave indet" id="weave"><svg viewBox="-12 -12 24 24" style="--len:190">
    ${Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2 - Math.PI / 2; return `<line class="sp" x1="0" y1="0" x2="${(Math.cos(a) * 11.5).toFixed(2)}" y2="${(Math.sin(a) * 11.5).toFixed(2)}"/>`; }).join('')}
    <path class="spiral" d="${SPIRAL}"/></svg><span class="stage" id="stage">${label}</span></div>`;
  function weaveProgress(p) {
    const w = $('weave'); if (!w) return;
    w.classList.remove('indet');
    w.querySelector('.spiral').style.strokeDashoffset = (190 * (1 - Math.max(0.04, Math.min(1, p)))).toFixed(1);
  }

  // ---------- Fristen im Text finden (für den Kalender) ----------
  const MONTHS = { januar: 1, februar: 2, märz: 3, maerz: 3, april: 4, mai: 5, juni: 6, juli: 7, august: 8, september: 9, oktober: 10, november: 11, dezember: 12 };
  function findDeadlines(text) {
    const out = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const re = /(\d{1,2})\.\s?(?:(\d{1,2})\.\s?|\s*(Januar|Februar|März|Maerz|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s+)(\d{4}|\d{2}\b)|(\d{4})-(\d{2})-(\d{2})/gi;
    let m;
    while ((m = re.exec(text)) && out.length < 12) {
      let d, mo, y;
      if (m[5]) { y = +m[5]; mo = +m[6]; d = +m[7]; }
      else { d = +m[1]; mo = m[2] ? +m[2] : MONTHS[m[3].toLowerCase()]; y = +m[4]; if (y < 100) y += 2000; }
      const date = new Date(y, mo - 1, d);
      if (isNaN(date) || date.getDate() !== d || date < today || y > today.getFullYear() + 5) continue;
      // Satz um das Datum herum als Beschreibung
      const from = Math.max(text.lastIndexOf('.', m.index - 2) + 1, m.index - 120);
      const to = Math.min(text.length, (text.indexOf('.', m.index + m[0].length) + 1) || text.length, m.index + 160);
      const sentence = text.slice(from, to).replace(/\s+/g, ' ').trim();
      const iso = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      if (!out.some((o) => o.iso === iso)) out.push({ iso, date, sentence });
    }
    return out.sort((a, b) => a.date - b.date).slice(0, 3);
  }

  // ---------- Analyse ----------
  async function analyze() {
    state = 'running';
    const myRun = ++run;
    $('foot').classList.add('hidden');
    $('main').innerHTML = `${weave('Die Spinne liest …')}<div id="live"></div>`;
    const res = await window.spider.analyze(P.doc);
    if (myRun !== run) return;
    if (!res.ok) return showError(res, analyze);
    result = res.result;
    showResult();
  }

  window.spider.onProgress(({ summary, stage }) => {
    if (state !== 'running' || !$('stage')) return;
    if (stage?.stage) $('stage').textContent = stage.stage;
    if (stage?.steps) weaveProgress(stage.step / stage.steps);
    if (summary) $('live').innerHTML = `<ul class="lead" data-noi18n>${bullets(summary).map((b) => `<li>${emph(b)}</li>`).join('')}</ul><span class="cur">▍</span>`;
  });

  function showResult() {
    state = 'done';
    const r = result;
    $('title').textContent = r.title || P.doc.title;
    const deadlines = findDeadlines(P.doc.pages.join('\n'));
    const figs = r.figures.slice(0, 8);
    $('main').innerHTML = `
      <ul class="lead" data-noi18n>${bullets(r.summary).map((b, i) => `<li class="rise" style="animation-delay:${i * 70}ms">${emph(b)}</li>`).join('')}</ul>
      ${deadlines.map((d, i) => `<div class="dl"><span class="when">📅 ${d.date.toLocaleDateString(I18N.locale)}</span><span class="what" data-noi18n title="${esc(d.sentence)}">${esc(d.sentence)}</span><button class="link" data-dl="${i}">+ Kalender</button></div>`).join('')}
      <button class="more" id="moreBtn">Mehr ▾</button>
      <div id="details">
        ${r.key_points.length ? `<div class="sec"><div class="h">Kernaussagen</div><ul data-noi18n>${r.key_points.map((p, i) => `<li class="jump" data-type="point" data-index="${i}">${emph(p)}</li>`).join('')}</ul></div>` : ''}
        ${r.findings.length ? `<div class="sec"><div class="h">Erkenntnisse</div>${r.findings.map((f, i) => `<div class="find jump" data-type="finding" data-index="${i}"><span class="k">${esc(f.kind)}</span> <span data-noi18n>${emph(f.title)}</span>${f.detail ? `<div class="d" data-noi18n>${emph(f.detail)}</div>` : ''}</div>`).join('')}</div>` : ''}
        ${figs.length ? `<div class="sec"><div class="h">Angaben</div><div class="figs" data-noi18n>${figs.map((f, i) => `<span class="jump" data-type="figure" data-index="${i}">${esc(f.label)}</span><span><b>${esc(f.value)}</b></span>`).join('')}</div></div>` : ''}
        ${r.note ? `<div class="sec muted" data-noi18n>${esc(r.note)}</div>` : ''}
      </div>
      <div id="answers"></div>
      <div class="aiNote">KI-Ergebnis · wichtige Angaben bitte im Original prüfen</div>`;
    $('moreBtn').addEventListener('click', () => {
      const open = $('details').classList.toggle('open');
      $('moreBtn').textContent = open ? 'Weniger ▴' : 'Mehr ▾';
    });
    $('main').querySelectorAll('.jump').forEach((row) => row.addEventListener('click', () =>
      toggleLupe(row, { type: row.dataset.type, index: Number(row.dataset.index) })));
    $('main').querySelectorAll('[data-dl]').forEach((btn) => btn.addEventListener('click', async () => {
      const d = deadlines[Number(btn.dataset.dl)];
      const ok = await window.spider.addCalendar({ title: `Frist: ${r.title || P.doc.title}`, date: d.iso, note: d.sentence });
      btn.textContent = ok ? '✓ geöffnet' : 'nicht möglich';
    }));
    $('main').scrollTop = 0;
    footer({ ask: true, actions: [['Kopieren', copyResult], ['Vorlesen', () => speak(bullets(r.summary).join('. '))], ['Festhalten', keepResult], ['Lesemodus', () => window.spider.openReader(P.doc, result, null)]] });
  }

  // ---------- Vorlesen (Windows-Stimmen, offline) – die Spinne bewegt dabei den Mund ----------
  let speaking = false;
  function speak(text, label = 'Vorlesen') {
    const synth = window.speechSynthesis;
    if (speaking) { synth.cancel(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const voices = synth.getVoices();
    const lang = /[äöüß]|\b(der|die|und|ist)\b/i.test(text) ? 'de' : 'en';
    u.voice = voices.find((v) => v.lang.toLowerCase().startsWith(lang)) || null;
    u.lang = lang === 'de' ? 'de-DE' : 'en-US';
    u.rate = 1.05;
    const btn = $('foot').querySelector(`[data-a="${label}"]`);
    const set = (on) => {
      speaking = on;
      window.spider.rigTalk(on);
      if (btn) btn.innerHTML = `${silkIcon(on ? 'stop' : 'speak')}<span>${on ? 'Stopp' : label}</span>`;
    };
    u.onend = u.onerror = () => set(false);
    set(true);
    synth.speak(u);
  }
  const stopSpeaking = () => { if (speaking) window.speechSynthesis.cancel(); };

  // ---------- Frage an den Text ----------
  async function ask(q) {
    const box = document.createElement('div');
    box.className = 'answer';
    box.innerHTML = `<div class="q">${esc(q)}</div><div class="a muted">Die Spinne sucht …</div>`;
    $('answers').appendChild(box);
    box.scrollIntoView({ block: 'nearest' });
    const res = await window.spider.ask(P.doc, q);
    const a = box.querySelector('.a');
    if (!res.ok) { a.className = 'a error'; a.textContent = res.error; return; }
    a.className = 'a';
    a.innerHTML = emph(res.answer) + (res.quote ? ` <button class="link">Stelle zeigen →</button>` : '');
    a.querySelector('.link')?.addEventListener('click', (e) => toggleLupe(box, { type: 'quote', quote: res.quote }, e.target));
    box.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Übersetzen / leichte Sprache / Antwort-Entwurf ----------
  async function transform() {
    state = 'running';
    const myRun = ++run;
    $('foot').classList.add('hidden');
    $('main').innerHTML = `${weave('Die Spinne schreibt …')}<div class="out" id="out" data-noi18n></div>`;
    const res = await window.spider.transform(P.mode, P.text, P.extra || '');
    if (myRun !== run) return;
    if (!res.ok) return showError(res, transform);
    state = 'done';
    $('main').innerHTML = `<div class="out rise" data-noi18n>${esc(res.text)}</div>${res.truncated ? '<div class="muted" style="margin-top:8px">Nur der Anfang wurde bearbeitet (eingebautes Modell).</div>' : ''}`;
    // Nachschärfen mit einem Klick: kürzer, förmlicher, lockerer
    const again = (extra) => () => { P = { ...P, extra: `${P.extra || ''} ${extra}`.trim() }; transform(); };
    footer({ actions: [
      ['Kopieren', async () => { await navigator.clipboard.writeText(res.text); flash('Kopieren', '✓ Kopiert'); }],
      ['Vorlesen', () => speak(res.text)],
      ['Kürzer', again('Fasse dich deutlich kürzer.')],

  // ---------- Lupe: wo steht das im Text? ----------
  function queryFor(focus) {
    if (focus.type === 'figure') { const f = result.figures[focus.index]; return f ? (f.quote || `${f.label} ${f.value}`) : ''; }
    if (focus.type === 'point') return result.key_points[focus.index] || '';
    if (focus.type === 'finding') { const f = result.findings[focus.index]; return f ? `${f.title} ${f.detail}` : ''; }
    return focus.quote || '';
  }
  const tokens = (q) => (q.toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N},.%€-]*/gu) || [])
    .map((t) => t.replace(/[.,]+$/, '')).filter((t) => t.length > 3 || /\d/.test(t));
  const numKey = (t) => t.replace(/[.\s]/g, '').replace(',', '.');
  function findSource(query, text) {
    if (!query.trim()) return null;
    // 1. wörtlich (Zitat), Leerräume egal
    const words = query.trim().split(/\s+/);
    if (words.length >= 3) {
      const re = new RegExp(words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+'), 'i');
      const m = re.exec(text);
      if (m) return around(text, m.index, m.index + m[0].length);
    }
    // 2. Satz mit den meisten gemeinsamen Wörtern (Zahlen zählen dreifach)
    const want = tokens(query);
    if (!want.length) return null;
    const sents = [...text.matchAll(/[^.!?\n]+(?:[.!?]+|\n|$)/g)];
    let best = null, bestScore = 0;
    for (const m of sents) {
      const have = new Set(tokens(m[0]).map((t) => (/\d/.test(t) ? numKey(t) : t)));
      let score = 0;
      for (const t of want) if (have.has(/\d/.test(t) ? numKey(t) : t)) score += /\d/.test(t) ? 3 : 1;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    if (!best || bestScore < 2) return null;
    const lead = best[0].length - best[0].trimStart().length;
    return around(text, best.index + lead, best.index + best[0].trimEnd().length);
  }
  function around(text, start, end) {
    let a = Math.max(0, text.lastIndexOf('.', start - 2) + 1, start - 160);
    let b = text.indexOf('.', end + 1); b = Math.min(b < 0 ? text.length : b + 1, end + 160);
    return { start, end, before: text.slice(a, start).replace(/\s+/g, ' ').trimStart(), hit: text.slice(start, end), after: text.slice(end, b).replace(/\s+/g, ' ').trimEnd(), cutA: a > 0, cutB: b < text.length };
  }

    const next = (afterEl || anchor).nextElementSibling;
    if (next?.classList.contains('lupe')) { next.remove(); return; }
    document.querySelectorAll('.lupe').forEach((l) => l.remove());
    const text = P.doc.pages.join('\n\n');
    const src = findSource(queryFor(focus), text);
    const box = document.createElement('div');
    box.className = 'lupe';
    box.dataset.noi18n = '';
    box.innerHTML = src
      ? `${src.cutA ? '… ' : ''}${esc(src.before)}<mark>${emph(src.hit)}</mark>${esc(src.after)}${src.cutB ? ' …' : ''}`

    const st = await window.spider.getSettings();
    const cloud = st.provider === 'claude';
    el.className = `where${cloud ? ' cloud' : ''}`;
    el.innerHTML = `${silkIcon(cloud ? 'cloud' : 'lock')}<span>${T(cloud ? 'an Claude' : 'auf diesem PC')}</span>`;
    el.title = T(cloud ? 'Dieser Text wird an Claude (Anthropic) geschickt.' : 'Dieser Text bleibt auf deinem PC.');
  }

  // ---------- Was ist neu? ----------
  function whatsNew() {
    state = 'done';
    $('title').textContent = T('Neu in Silkreader {v}', { v: P.version });
    $('main').innerHTML = `<ul class="news" data-noi18n>${P.items.map((x) => `<li class="rise">${esc(x)}</li>`).join('')}</ul>`;
    footer({ actions: [['Alle Änderungen', () => window.spider.openExternal('https://github.com/Sebbilore/silkreader/blob/main/CHANGELOG.md')], ['OK', close]] });
  }

  window.spider.onPopupDoc((payload) => {
    stopSpeaking();
    P = payload; result = null; run++;
    showWhere();
    setBack(null);
    document.documentElement.style.setProperty('--arrow', `${payload.arrow}px`);
    $('bubble').classList.remove('closing');
    $('bubble').style.animation = 'none'; void $('bubble').offsetWidth; $('bubble').style.animation = '';
    $('foot').classList.add('hidden');
    if (P.kind === 'analyze' && P.result) { result = P.result; showResult(); }
    else if (P.kind === 'analyze') { $('title').textContent = P.doc.title; analyze(); }
    else if (P.kind === 'home') home();
    else if (P.kind === 'notebook') notebook();
    else if (P.kind === 'settings') settings();
    else if (P.kind === 'about') about();
    else if (P.kind === 'whatsnew') whatsNew();
    else if (P.kind === 'report') report();
    else if (P.kind === 'transform') { $('title').textContent = P.title; transform(); }
    else if (P.kind === 'compare') { $('title').textContent = P.title; compare(); }
    else { state = 'done'; $('title').textContent = P.title; $('main').innerHTML = `<p>${esc(P.text)}</p>`; footer({ actions: [['OK', close]] }); }
  });
</script>
</body>
</html>
