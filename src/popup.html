<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13.5px/1.6 var(--font); color: var(--text); }
  /* Die Blase hängt an einem Seidenfaden unter der Spinne */

  b { color: var(--strong); font-weight: 600; }

  .tpl { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; align-items: baseline; }
  .entry .fold { flex: none; background: none; border: 1px solid var(--line-2); border-radius: var(--r-s); color: var(--muted); font: inherit; font-size: 11.5px; padding: 0 7px; cursor: pointer; }
  .entry .fold.on { background: var(--line); border-color: transparent; color: var(--text); } .fpick { margin: 4px 0 8px; } .fpick .chip { font-size: 11px; }
  .aiNote .sent { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; color: var(--ok); } .aiNote .sent .icon { width: 11px; height: 11px; } .aiNote .sent.cloud { color: var(--muted); }
  .langpick { margin: 12px 0 2px; } .langpick .h { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .aiNote { font-size: 12px; color: var(--faint); margin: 12px 0 2px; }
  .where { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 7px; }
  .where .icon { width: 13px; height: 13px; }
  .where.cloud { color: var(--pink-2); }
  .news li { margin-bottom: 9px; }
  .about { text-align: center; padding: 4px 0 6px; }
  .about svg.sp { width: 64px; height: 64px; }
  .about h2 { font: 600 18px var(--font-display); margin: 6px 0 0; }
  .about .v { color: var(--muted); font-size: 12px; }
  .about p { color: var(--muted); font-size: 13px; margin: 10px 0; text-align: left; }
  .linklist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 8px 0 4px; text-align: left; }
  .linklist .link { display: inline-flex; gap: 6px; align-items: center; color: var(--text); } .linklist .link:hover { color: var(--strong); text-decoration: underline; }
  .linklist .icon { width: 14px; height: 14px; color: var(--muted); }
  textarea.rep { height: 90px; }
  /* Zurück-Pfeil im Kopf */
  .back:hover { color: var(--strong); }
  /* Lupe: Originalstelle direkt in der Blase */
  .lupe { margin: 4px 0 10px; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); font-size: 13px; color: var(--muted); animation: silk-rise .2s var(--ease-out); }
  .lupe mark { background: var(--pink-soft); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .lupe .row { display: flex; gap: 14px; margin-top: 6px; }
  .figs .lupe { grid-column: 1 / -1; }
  .lupe .none { font-style: italic; }
  /* Mini-Blase: einfügen, Zwischenablage, Datei */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .chip { background: none; border: 1px solid transparent; color: var(--muted); font: inherit; font-size: 13px; border-radius: var(--r-s);
    height: 30px; padding: 0 10px; cursor: pointer; transition: color var(--t-fast), background var(--t-fast); }
  .chip:hover { color: var(--text); background: var(--line); } .chip.on { color: var(--strong); font-weight: 600; background: linear-gradient(var(--pink), var(--pink)) center bottom 2px / calc(100% - 20px) 3px no-repeat; }
  textarea.in { width: 100%; resize: none; background: var(--raised); border: 1px solid var(--control-line); border-bottom-color: var(--faint); border-radius: var(--r-s); color: var(--text);
    font: inherit; font-size: 13px; padding: 9px 12px; outline: none; height: 80px; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  textarea.in:focus { border-bottom-color: var(--pink); box-shadow: inset 0 -1px 0 var(--pink); }
  textarea.in::placeholder { color: var(--faint); }
  .quick .link { display: inline-flex; align-items: center; gap: 6px; } .quick .link .icon { width: 14px; height: 14px; color: var(--muted); }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .quick .link { color: var(--text); height: 32px; padding: 0 12px; border: 1px solid var(--control-line); border-radius: var(--r-s); background: var(--raised); font-size: 13px; } .quick .link:hover { border-color: var(--faint); text-decoration: none; }
  .clip { font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .icon { width: 13px; height: 13px; vertical-align: -2px; }
  .clip:hover { color: var(--text); }
  .entry { padding: 7px 8px; margin: 0 -8px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; border-radius: var(--r-s); }
  .entry:hover { background: var(--line); }
  .entry .t { flex: 1; min-width: 0; } .entry b { display: block; font-weight: 400; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry small { color: var(--muted); font-size: 11px; }

  .entry .del { background: none; border: none; color: var(--muted); cursor: pointer; visibility: hidden; padding: 0 2px; }
  .entry:hover .del { visibility: visible; } .entry .del:hover { color: var(--bad); }
  /* Einstellungen in der Blase */
  .set { margin: 0 0 12px; } .set > .h { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .set select { background: var(--raised); color: var(--text); border: 1px solid var(--control-line); border-radius: var(--r-s); font: inherit; font-size: 13px; height: 30px; padding: 0 8px; }
  .tog { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 6px 0; cursor: pointer; }
  .tog input { accent-color: var(--primary); }
</style>
</head>
<body>
<svg id="thread" viewBox="0 0 12 20"><line x1="6" y1="0" x2="6" y2="16"/><circle cx="6" cy="16" r="1.6"/></svg>
<div id="bubble" class="glass">
  <header><button class="back x hidden" id="back" title="Zurück"></button><svg class="mark" viewBox="-36 -30 72 60" aria-hidden="true"><g stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -5L18 -15L24 -4M10 -1L21 -7L28 4M10 3L20 2L26 13M8 7L16 9L20 20M-8 -5L-18 -15L-24 -4M-10 -1L-21 -7L-28 4M-10 3L-20 2L-26 13M-8 7L-16 9L-20 20"/></g><circle r="11" fill="currentColor"/></svg><span class="t" id="title">Silkreader</span><span class="where hidden" id="where"></span><button class="x" id="close" title="Schließen (Esc)"></button></header>
  <main id="main"></main>
  <footer id="foot" class="hidden"></footer>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Zahlen, Beträge und Prozente fett
  const emph = (s) => esc(s).replace(/(?<![\p{L}\d][-/]|[\p{L}\d])(\d[\d.,]*\s?(?:%|€|Prozent|Euro|Mio\.?|Mrd\.?|Millionen|Milliarden|Tage|Monate|Jahre)?)/gu, '<b>$1</b>');
  function bullets(text) {
    let parts = String(text || '').split(/\n+|\s*•\s*/).map((t) => t.replace(/^[-–*]\s+/, '').trim()).filter(Boolean);
    if (parts.length === 1 && parts[0].length > 160) parts = parts[0].split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ0-9])/);
    return parts;
  }

  let P = null, result = null, state = 'idle', run = 0;
  $('close').innerHTML = silkIcon('close');
  $('back').innerHTML = silkIcon('back');
  $('close').setAttribute('aria-label', T('Schließen'));
  $('back').setAttribute('aria-label', T('Zurück'));
  document.getElementById('bubble').setAttribute('role', 'dialog');
  document.getElementById('main').setAttribute('aria-live', 'polite'); // Ergebnisse werden vorgelesen, sobald sie da sind

  // Fortschritt als Spinnennetz, das gewebt wird (ohne Schritte: in Dauerschleife)
  const SPIRAL = (() => { let d = '', n = 8 * 3.2; for (let k = 0; k <= n; k++) { const a = (k / 8) * Math.PI * 2 - Math.PI / 2, r = 2 + (k / n) * 9; d += `${k ? 'L' : 'M'}${(Math.cos(a) * r).toFixed(2)} ${(Math.sin(a) * r).toFixed(2)}`; } return d; })();
  const weave = (label) => `<div class="weave indet" id="weave"><svg viewBox="-12 -12 24 24" style="--len:190">
    ${Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2 - Math.PI / 2; return `<line class="sp" x1="0" y1="0" x2="${(Math.cos(a) * 11.5).toFixed(2)}" y2="${(Math.sin(a) * 11.5).toFixed(2)}"/>`; }).join('')}
    <path class="spiral" d="${SPIRAL}"/></svg><span class="stage" id="stage">${label}</span></div>`;
  function weaveProgress(p) {
    const w = $('weave'); if (!w) return;
    w.classList.remove('indet');
    w.querySelector('.spiral').style.strokeDashoffset = (190 * (1 - Math.max(0.04, Math.min(1, p)))).toFixed(1);
  }

  // ---------- Fristen im Text finden (für den Kalender) – feste Regeln aus facts.js ----------
  const findDeadlines = (text) => SilkFacts.findDeadlines(text, { max: 3 });

  // ---------- Analyse ----------
  async function analyze() {
    state = 'running';
    const myRun = ++run;
    $('foot').classList.add('hidden');
    P.quickShown = false;
    $('main').innerHTML = `${weave('Die Spinne liest …')}<div id="live"></div>`;
    const res = await window.spider.analyze(P.doc);
    if (myRun !== run) return;
    if (!res.ok) return showError(res, analyze);
    result = res.result;
    showResult();
  }

  window.spider.onProgress(({ summary, stage, quick, notes }) => {
    if (state !== 'running' || !$('stage')) return;
    if (quick) {
      // Kurzfassung steht – Details kommen darunter
      P.quickShown = true;
      if (quick.title) $('title').textContent = quick.title;
      $('main').innerHTML = `<ul class="lead" data-noi18n>${bullets(quick.summary).map((b) => `<li>${emph(b)}</li>`).join('')}</ul>${weave('Sucht Zahlen, Fristen und Details …')}<div id="live"></div>`;
      return;
    }
    if (notes?.length) {
      // Langes Dokument: Zwischenstand aus den bisher gelesenen Abschnitten
      const box = $('live');
      if (!box.querySelector('.sofar')) box.innerHTML = `<div class="sec sofar"><div class="h">${T('Bisher gefunden')}</div><ul class="muted" data-noi18n></ul></div>`;
      box.querySelector('.sofar ul').insertAdjacentHTML('beforeend', notes.slice(0, 2).map((n) => `<li class="rise">${emph(n)}</li>`).join(''));
      return;
    }
    if (stage?.stage) $('stage').textContent = stage.stage;
    if (stage?.steps) weaveProgress(stage.step / stage.steps);
    if (summary && !P.quickShown) $('live').innerHTML = `<ul class="lead" data-noi18n>${bullets(summary).map((b) => `<li>${emph(b)}</li>`).join('')}</ul><span class="cur">▍</span>`;
    else if (summary) $('live').innerHTML = '';
  });

  // Zahlen-Prüfung: Zahlen, die so nicht im Originaltext stehen, gestrichelt markieren
  let srcNums = null;
  function emphChecked(t) {
    const html = emph(t);
    if (!srcNums) return html;
    return html.replace(/<b>([^<]*)<\/b>/g, (all, inner) => (SilkFacts.unknownNumbers(inner.replace(/&amp;/g, '&'), srcNums).length
      ? `<b class="unsure" title="${T('Steht so nicht im Text – bitte prüfen')}">${inner}</b>` : all));
  }
  const CK = { ok: ['✓', 'Steht so im Text'], calc: ['≈', 'Aus dem Text berechnet'], missing: ['?', 'Nicht im Text gefunden – bitte prüfen'] };
  const ck = (f) => { const c = CK[f.check]; return c ? `<span class="ck ${f.check === 'missing' ? 'miss' : f.check === 'calc' ? 'calc' : ''}" title="${T(c[1])}">${c[0]}</span>` : ''; };

  // „Einspruch“ (Steuer, Bußgeld) oder „Widerspruch“ – wie im Brief; auf Englisch immer „objection“
  const objWord = (L, cap = false) => (I18N.lang === 'en' ? (cap ? 'Objection' : 'an objection') : (L.objection || 'Widerspruch'));
  // Brief-Karte: Was muss ich tun? Bis wann? Was kostet es? (feste Regeln + Handlungen der KI)
  // Langes Datum und „noch X Tage“ für die Aufgabe oben
  const longDay = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString(I18N.locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  function daysChip(iso) {
    const n = Math.round((new Date(`${iso}T00:00:00`) - new Date(new Date().toDateString())) / 864e5);
    const t = n < 0 ? T('abgelaufen') : n === 0 ? T('heute') : n === 1 ? T('morgen') : T('noch {n} Tage', { n });
    return `<span class="days${n > 14 ? ' calm' : ''}">${t}</span>`;
  }
  function letterCard(L, r) {
    const day = (d) => new Date(`${d.iso}T00:00:00`).toLocaleDateString(I18N.locale); // aus dem Notizbuch kommt das Datum als Text
    const due = L.deadlines[0];
    const pay = L.amount && (L.iban || /rechnung|mahnung/.test(L.kind) || /nachzahlung|zu zahlen|offen|forderung/.test(L.amount.label));
    const obj = L.canObject ? L.deadlines.find((d) => /widerspruch|einspruch|rechtsbehelf/i.test(d.sentence)) : null;
    // Die eine Aufgabe groß, darunter das Datum; alles Weitere als Liste
    let big = null, bigDate = null;
    const todo = [];
    if (pay) { big = T('{a} bezahlen', { a: L.amount.text }); bigDate = due; }
    if (L.canObject) {
      const t = obj ? T('Bei Bedarf {w} einlegen', { w: objWord(L) }) : T('Prüfen, ob du {w} einlegen willst', { w: objWord(L) });
      if (!big) { big = t; bigDate = obj; } else todo.push(obj ? `${t} ${T('bis {d}', { d: day(obj) })}` : t);
    }
    if (!big && due) { big = T('Frist beachten'); bigDate = due; }
    const actions = (r.findings || []).filter((f) => f.kind === 'Handlung').slice(0, 3).map((f) => f.title);
    const kv = [];
    if (L.amount && !pay) kv.push([T('Betrag'), `<b>${esc(L.amount.text)}</b>`, '']);
    if (L.recipient) kv.push([T('An'), `<span data-noi18n>${esc(L.recipient)}</span>`, '']);
    if (L.iban) kv.push(['IBAN', `<code data-noi18n>${esc(L.iban)}</code>`, `<button class="link" data-copy="${esc(L.iban.replace(/\s+/g, ''))}">${T('Kopieren')}</button>`]);
    for (const ref of L.refs) kv.push([T(ref.label), `<code data-noi18n>${esc(ref.value)}</code>`, `<button class="link" data-copy="${esc(ref.value)}">${T('Kopieren')}</button>`]);
    L.deadlines.slice(0, 2).forEach((d, i) => { if (d !== bigDate) kv.push([T('Frist'), `<b>${day(d)}</b>${d.relative ? ` <span class="muted">${T(d.fromLetter ? '(ab Briefdatum)' : '(ca., ab heute)')}</span>` : ''}`, `<button class="link" data-ldl="${i}">${T('In den Kalender')}</button>`]); });
    // Unterschrift nötig: als eigene Aufgabe (oder als die große, wenn sonst nichts zu tun ist)
    const S = r.signature;
    if (S) {
      const t = T('Unterschreiben und zurückschicken');
      if (!big || big === T('Frist beachten')) { big = t; bigDate = due || null; } else todo.push(t);
    }
    const bigIdx = bigDate ? L.deadlines.indexOf(bigDate) : -1;
    const CQ = L.consequences;
    return `<div class="letter rise">
      <div class="lh"><b>${T(L.label)}</b><span>${T('Was du tun musst')}</span></div>
      ${big ? `<div class="bigrow"><div class="big">${esc(big)}</div><button class="x say" id="lSay" title="${T('Vorlesen')}" aria-label="${T('Vorlesen')}">${silkIcon('speak')}</button></div>` : ''}
      ${bigDate ? `<div class="when2"><span>${T('bis {d}', { d: longDay(bigDate.iso) })}${bigDate.relative ? ` <span class="muted">${T(bigDate.fromLetter ? '(ab Briefdatum)' : '(ca., ab heute)')}</span>` : ''}</span>${daysChip(bigDate.iso)}</div>` : ''}
      ${todo.length || actions.length ? `<ul class="todo">${todo.map((t) => `<li><span>${esc(t)}</span></li>`).join('')}${actions.map((t) => `<li data-noi18n><span>${emphChecked(t)}</span></li>`).join('')}</ul>` : ''}
      ${S ? sigNote(S) : ''}
      <div class="btnrow">${bigIdx >= 0 ? `<button class="btn primary" data-ldl="${bigIdx}">${T('In den Kalender')}</button>` : ''}${replyButton([...(L.canObject ? ['objection'] : []), ...(L.amount ? ['installments'] : []), 'extension', 'question'], L)}</div>
      ${CQ ? `<details class="whatif"><summary>${silkIcon('info')}<span>${T('Was passiert, wenn ich nichts tue?')}</span></summary><ol>${CQ.steps.map((x) => `<li>${esc(T(x))}</li>`).join('')}</ol>${CQ.tip ? `<p class="muted">${esc(T(CQ.tip))}</p>` : ''}</details>` : ''}
      ${(r.learned || []).length ? `<div class="learned">${silkIcon('pro')}<span>${T('Gelernt:')} ${r.learned.map((x) => esc(T(x))).join(' ')}</span></div>` : ''}
      ${kv.length ? `<details class="paydata"><summary><span>${T('Zahlungsdaten')}</span><span class="muted">${esc(kv.slice(0, 2).map(([k]) => k).join(', '))}</span></summary><div class="kv">${kv.map(([k, v, x]) => `<span>${k}</span><span>${v}</span><span>${x}</span>`).join('')}</div></details>` : ''}
    </div>`;
  }
  // ---------- Antwort-Vorlagen (Pro) ----------
  const PH = ' Lass fehlende Angaben als Platzhalter in [eckigen Klammern]. Nenne Datum des Schreibens und Aktenzeichen, Kunden-, Vertrags- oder Rechnungsnummer.';
  const TEMPLATES = {
    objection: (L) => [T('{w} schreiben', { w: objWord(L, true) }), `Schreibe einen sachlichen, höflichen ${L.objection || 'Widerspruch'} gegen dieses Schreiben (Überschrift: „${L.objection || 'Widerspruch'}“) und bitte um Bestätigung des Eingangs.${PH}`],
    installments: () => [T('Ratenzahlung'), `Schreibe eine höfliche Bitte um Ratenzahlung für den offenen Betrag. Schlage eine monatliche Rate von [Betrag] € ab [Datum] vor und bitte um schriftliche Bestätigung.${PH}`],
    extension: () => [T('Fristverlängerung'), `Schreibe eine höfliche Bitte um Verlängerung der Frist um [Anzahl] Wochen mit kurzer Begründung [Grund].${PH}`],
    question: () => [T('Rückfrage'), `Schreibe eine höfliche Rückfrage zu diesem Schreiben: Bitte um Erklärung von [Punkt] bzw. um Zusendung von [Unterlagen].${PH}`],
    cancel: () => [T('Kündigung'), `Schreibe eine Kündigung dieses Vertrags zum nächstmöglichen Termin. Bitte um schriftliche Bestätigung der Kündigung mit Datum des Vertragsendes.${PH}`],
  };
  // Unterschrift: wo und wohin zurück
  const sigNote = (S) => `<div class="signote">${silkIcon('pen')}<span><b>${T('Unterschrift nötig')}</b>${S.page ? ` ${T('auf Seite {n}', { n: S.page })}` : ''}${S.where ? ` (${T('„{w}“', { w: T(S.where) })})` : ''}.${S.returnTo ? ` ${T('Zurück an:')} <span data-noi18n>${esc(S.returnTo)}</span>` : ''}</span></div>`;
  // Echtheits-Check: Warnung bei typischen Betrugsmerkmalen (immer kostenlos)
  const SCAM = { iban: 'Die IBAN ist aus einem anderen Land ({c}…), obwohl der Brief auf Deutsch ist.', urgent: 'Du sollst sehr schnell zahlen oder handeln – Druck ist ein typisches Merkmal.',
    gift: 'Bezahlt werden soll mit Gutschein- oder Guthabenkarten – das macht keine echte Firma oder Behörde.', crypto: 'Bezahlt werden soll mit Kryptowährung.',
    secret: 'Du sollst PIN, TAN, Passwort oder Kartendaten angeben – das fragt niemand Seriöses so ab.', link: 'Du sollst auf einen Link klicken.',
    parcel: 'Ein Paket soll erst nach einer kleinen Gebühr zugestellt werden – eine bekannte Masche.', prize: 'Für einen Gewinn oder eine Erbschaft soll vorher gezahlt werden.' };
  const scamCard = (X) => `<div class="scam rise" role="alert">${silkIcon('warn')}<div><b class="st">${T('Vorsicht: Das wirkt nicht echt')}</b>
    <div>${T('Ich habe typische Merkmale von Betrug gefunden:')}</div><ul>${X.reasons.map((x) => `<li>${esc(T(SCAM[x.id] || x.text, { c: x.country || '' }))}</li>`).join('')}</ul>
    <p><b>${T('Mein Rat:')}</b> ${T('Nichts bezahlen und auf keinen Link klicken. Ruf den Absender über die Nummer auf seiner echten Webseite an.')}</p></div></div>`;
  // Absender und Vergleich mit früheren Briefen (aus dem lokalen Lernen)
  function senderLines(X) {
    if (!X || (X.nth < 2 && !X.trend)) return '';
    const rows = [];
    if (X.nth >= 2) rows.push(`<div class="sl">${silkIcon('notebook')}<span>${T('Der {n}. Brief von {s} dieses Jahr.', { n: X.nth, s: `<b data-noi18n>${esc(X.name)}</b>` })} <button class="link" id="sAll">${T('Alle anzeigen')}</button></span></div>`);
    if (X.trend) {
      const up = X.trend.to > X.trend.from;
      const lbl = T(X.trend.label.charAt(0).toUpperCase() + X.trend.label.slice(1));
      rows.push(`<div class="sl ${up ? 'up' : 'down'}">${silkIcon(up ? 'trend' : 'trenddown')}<span>${T(up ? '{l} steigt von {a} auf {b}' : '{l} sinkt von {a} auf {b}', { l: lbl, a: `<b>${X.trend.fromText}</b>`, b: `<b>${X.trend.toText}</b>` })} <span class="pct">(${X.trend.pct > 0 ? '+' : ''}${X.trend.pct.toLocaleString(I18N.locale)} %)</span> – ${T('verglichen mit dem Brief vom {d}', { d: new Date(X.trend.since).toLocaleDateString(I18N.locale) })}.</span></div>`);
    }
    return `<div class="senders">${rows.join('')}</div>`;
  }
  // ---------- Die Spinne fragt nach, wenn es passt (höchstens eine Frage pro Ergebnis) ----------
  const SCAM_HELP = ['Such die Webseite des Absenders selbst (nicht über einen Link oder eine Nummer aus dem Brief).', 'Ruf dort an oder schreib über das Kundenkonto. Frag, ob der Brief echt ist.', 'Hast du schon gezahlt? Sofort deine Bank anrufen – manchmal lässt sich eine Überweisung zurückholen.', 'Melde den Fall der Verbraucherzentrale oder der Polizei (Online-Wache).'];
  async function pickQuestion(r) {
    if (P.practice || P.doc?.source === 'history') return null;
    const st = await window.spider.askState();
    if (!st.enabled) return null;

    if (st.explainLang && /[äöüß]|\b(der|die|und|ist|sie)\b/i.test(text) && L) { const n = { tr: 'Türkisch', ar: 'Arabisch', uk: 'Ukrainisch', ru: 'Russisch', pl: 'Polnisch', ro: 'Rumänisch', en: 'Englisch' }[st.explainLang]; if (n) Q.push({ id: 'explain', text: T('Soll ich dir das wieder auf {l} erklären?', { l: T(n) }), yes: T('Auf {l}', { l: T(n) }), no: T('Nein'), run: () => startExplain(st.explainLang) }); }
    if (st.thumbsDownRun >= 2 && st.quality) Q.push({ id: 'quality', text: T('Soll ich es mit dem gründlichen Modell nochmal versuchen?'), yes: T('Nochmal gründlich'), no: T('Nein'), run: () => analyzeAgain() });
    if (r.sender?.nth >= 3) Q.push({ id: 'folder', text: T('Soll ich alle Briefe von {s} in eine Mappe legen?', { s: r.sender.name }), yes: T('Mappe anlegen'), no: T('Nein'), run: async () => { const x = await window.spider.askFolder(P.doc); return x.ok ? T('{n} Briefe liegen jetzt in der Mappe „{f}“ ✓', { n: x.n, f: T(x.folder) }) : T('Mappen gibt es mit Silkreader Pro.'); } });

  }
  function answerBox(title, lines) {

  async function showQuestion(r) {

  function contractCard(C) {
    const day = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString(I18N.locale);
    const mon = (n) => (n >= 12 && n % 12 === 0 ? T(n === 12 ? '{n} Jahr' : '{n} Jahre', { n: n / 12 }) : T(n === 1 ? '{n} Monat' : '{n} Monate', { n: Math.round(n * 10) / 10 }));
    const kv = [];
    if (C.term) kv.push([T('Laufzeit'), mon(C.term), '']);
    if (C.start) kv.push([T('Beginn'), day(C.start), '']);
    if (C.end) kv.push([T('Ende'), `<b>${day(C.end)}</b>`, '']);
    if (C.notice != null) kv.push([T('Kündigungsfrist'), mon(C.notice), '']);
    if (C.cancelBy) kv.push([T('Kündigen bis'), C.cancelPassed ? `<span class="warn">${day(C.cancelBy)} – ${T('verpasst')}</span>` : `<b>${day(C.cancelBy)}</b>`, C.cancelPassed ? '' : `<button class="link" data-cal="${C.cancelBy}">${T('In den Kalender')}</button>`]);
    if (C.renew) kv.push([T('Danach'), C.renew.months ? T('verlängert sich um {m}', { m: mon(C.renew.months) }) : C.renew.indefinite ? T('läuft unbefristet weiter') : T('verlängert sich automatisch'), '']);
    if (C.monthly) kv.push([T('Kosten'), T('{p} pro Monat', { p: C.monthly }), '']);
    return `<div class="letter contract rise">
      <div class="lh"><b>${T('Vertrag')}</b><span>${T('Laufzeit und Kündigung')}</span></div>
      ${C.cancelBy && !C.cancelPassed ? `<div class="big">${T('Kündigen bis {d}', { d: day(C.cancelBy) })}</div><div class="when2">${daysChip(C.cancelBy)}<span class="muted">${T('sonst verlängert sich der Vertrag')}</span></div>` : ''}
      ${kv.length ? `<div class="kv">${kv.map(([k, v, x]) => `<span>${k}</span><span>${v}</span><span>${x}</span>`).join('')}</div>` : ''}
      ${C.priceChange ? `<div class="note warn">${T('Preiserhöhungen sind möglich – bei einer Erhöhung hast du oft ein Sonderkündigungsrecht.')}</div>` : ''}

      ${C.cancelBy && !C.cancelPassed ? `<div class="note">${T('Die Kündigungsfrist steht im Fristen-Netz – Silkreader erinnert dich rechtzeitig.')}</div>` : ''}

    box.querySelector('.x').addEventListener('click', () => box.remove());

  }

  // ---------- Bewertung: nach ein paar erfolgreichen Nutzungen einmal fragen ----------
  async function maybeAskReview() {

    const box = document.createElement('div');

      <div class="row"><button class="link" data-r="yes">${T('Ja, bewerten')}</button><button class="link dim" data-r="meh">${T('Geht so')}</button><button class="link dim" data-r="later">${T('Später')}</button></div>`;

      else box.remove();

  // ---------- Vorlesen (Windows-Stimmen, offline) – die Spinne bewegt dabei den Mund ----------
  let speaking = false;
  const VOICE_LANG = { de: 'de-DE', en: 'en-US', tr: 'tr-TR', ar: 'ar-SA', uk: 'uk-UA', ru: 'ru-RU', pl: 'pl-PL', ro: 'ro-RO' };
  // Tempo merkt sich die Blase (nur auf diesem PC)
  const RATES = { slow: 0.8, normal: 1.05, fast: 1.3 };
  let rateKey = (() => { try { return localStorage.getItem('silkRate') || 'normal'; } catch { return 'normal'; } })();
  let lastSpeak = null, speakGen = 0;
  function speak(text, label = 'Vorlesen', langCode = null, { show = false, from = 0, restart = false } = {}) {
    const synth = window.speechSynthesis;
    if (speaking && !restart) { synth.cancel(); return; }
    const gen = ++speakGen; // eine ältere, abgebrochene Stimme meldet ihr Ende später – das ignorieren
    if (speaking) synth.cancel();
    lastSpeak = { text, label, langCode, show };
    const u = new SpeechSynthesisUtterance(text.slice(from));
    const voices = synth.getVoices();
    const lang = langCode || (/[äöüß]|\b(der|die|und|ist)\b/i.test(text) ? 'de' : 'en');
    u.voice = voices.find((v) => v.lang.toLowerCase().startsWith(lang)) || null;
    u.lang = VOICE_LANG[lang] || 'en-US';
    u.rate = RATES[rateKey] || 1.05;
    const btn = $('foot').querySelector(`[data-a="${label}"]`);
    // Mitlesen: das gerade gesprochene Wort leuchtet
    let box = $('readAlong');
    if (show && !box) {
      box = document.createElement('div');
      box.id = 'readAlong'; box.className = 'readalong rise';
      let pos = 0;
      const words = text.split(/(\s+)/).map((w) => { const start = pos; pos += w.length; return /\S/.test(w) ? `<span data-c="${start}">${esc(w)}</span>` : w; }).join('');
      box.innerHTML = `<div class="rtext" data-noi18n>${words}</div><div class="rbar"><button class="x" id="rPause" aria-label="${T('Pause')}" title="${T('Pause')}">${silkIcon('pause')}</button>
        <span class="rprog"><i id="rProg"></i></span><span class="rates" role="radiogroup" aria-label="${T('Tempo')}">${[['slow', 'Langsam'], ['normal', 'Normal'], ['fast', 'Schnell']].map(([k, l]) => `<button class="chip${k === rateKey ? ' on' : ''}" role="radio" aria-checked="${k === rateKey}" data-rate="${k}">${T(l)}</button>`).join('')}</span>
        <button class="x" id="rClose" aria-label="${T('Schließen')}" title="${T('Schließen')}">${silkIcon('close')}</button></div>`;
      $('main').prepend(box);
      $('main').scrollTop = 0;
      $('rClose').addEventListener('click', () => { synth.cancel(); box.remove(); });
      $('rPause').addEventListener('click', () => {
        if (synth.paused) { synth.resume(); $('rPause').innerHTML = silkIcon('pause'); } else { synth.pause(); $('rPause').innerHTML = silkIcon('speak'); }
      });
      box.querySelector('.rates').addEventListener('click', (e) => {
        const c = e.target.closest('[data-rate]'); if (!c) return;
        rateKey = c.dataset.rate; try { localStorage.setItem('silkRate', rateKey); } catch {}
        box.querySelectorAll('[data-rate]').forEach((x) => { x.classList.toggle('on', x === c); x.setAttribute('aria-checked', String(x === c)); });
        if (speaking) speak(text, label, langCode, { show, from: box._at || 0, restart: true }); // im neuen Tempo an der Stelle weiter
      });
    }
    u.onboundary = (e) => {
      if (gen !== speakGen || !box || !box.isConnected) return;
      const at = from + (e.charIndex || 0);
      box._at = at;
      let hit = null;
      for (const sp of box.querySelectorAll('[data-c]')) { if (Number(sp.dataset.c) <= at) hit = sp; else break; }
      box.querySelector('.now')?.classList.remove('now');
      if (hit) { hit.classList.add('now'); hit.scrollIntoView({ block: 'nearest' }); }
      $('rProg').style.width = `${Math.min(100, (at / Math.max(1, text.length)) * 100)}%`;
    };
    const set = (on) => {
      speaking = on;
      window.spider.rigTalk(on);
      if (btn) btn.innerHTML = `${silkIcon(on ? 'stop' : 'speak')}<span>${T(on ? 'Stopp' : label)}</span>`;
    };
    u.onend = u.onerror = () => {
      if (gen !== speakGen) return;
      set(false);
      if (box?.isConnected) { box.querySelector('.now')?.classList.remove('now'); $('rProg').style.width = '100%'; }
    };
    set(true);
    synth.speak(u);
  }
  const stopSpeaking = () => { if (speaking) window.speechSynthesis.cancel(); };

  // ---------- Frage an den Text ----------
  // Fragen an die Spinne selbst beantwortet sie ohne KI (und freut sich)
  const SMALLTALK = [
    [/^(hallo|hi|hey|moin|servus|hello)\b[\s!.,]*(spinne|silk\w*|spider)?[\s!.]*$/i, 'Hallo! Schön, dass du da bist.', 'hello'],
    [/wer bist du|was bist du|who are you|what are you/i, 'Ich bin Silkreader, eine kleine Spinne. Ich lese deine Briefe hier auf dem PC und erkläre sie dir.', 'flip'],
    [/^(danke|vielen dank|thanks|thank you)\b/i, 'Gern geschehen!', 'heart'],
    [/sinn des lebens|meaning of life|^42$/i, '42. Aber frag mich lieber etwas zu deinem Text.', 'twirl'],
    [/magst du (mich|fliegen)|do you like (me|flies)/i, 'Fliegen? Lieber Briefe. Und dich mag ich sowieso.', 'heart'],
  ];
  async function ask(q) {
    const talk = SMALLTALK.find(([re]) => re.test(q.trim()));
    if (talk) {
      const box = document.createElement('div');
      box.className = 'answer';
      box.innerHTML = `<div class="q">${esc(q)}</div><div class="a">${esc(T(talk[1]))}</div>`;
      $('answers').appendChild(box);
      box.scrollIntoView({ block: 'nearest' });
      window.spider.easterEgg(talk[2]);
      return;
    }
    const box = document.createElement('div');
    box.className = 'answer';
    box.innerHTML = `<div class="q">${esc(q)}</div><div class="a muted">Die Spinne sucht …</div>`;
    $('answers').appendChild(box);
    box.scrollIntoView({ block: 'nearest' });
    const res = await window.spider.ask(P.doc, q);
    const a = box.querySelector('.a');
    if (!res.ok) { a.className = 'a error'; a.textContent = res.error; return; }
    a.className = 'a';
    // Antwort mit Beleg: die Stelle aus dem Brief (nur wenn sie wirklich im Text steht)
    a.innerHTML = emph(res.answer) + (res.quote && res.quoteFound !== false
      ? `<div class="proof">${silkIcon('notebook')}<span><b>${T('Aus dem Text:')}</b> <span data-noi18n>„${esc(res.quote)}“</span> <button class="link">${T('Im Text zeigen')}</button></span></div>`
      : res.quote ? `<div class="muted proof0">${T('Die passende Stelle habe ich nicht wörtlich gefunden – bitte im Original prüfen.')}</div>` : '');
    a.querySelector('.proof .link')?.addEventListener('click', (e) => toggleLupe(box, { type: 'quote', quote: res.quote }, e.target));
    box.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Übersetzen / leichte Sprache / Antwort-Entwurf ----------
  async function transform() {
    state = 'running';
    const myRun = ++run;
    $('foot').classList.add('hidden');
    $('main').innerHTML = `${weave('Die Spinne schreibt …')}<div class="out" id="out" data-noi18n dir="auto"></div>`;
    const res = await window.spider.transform(P.mode, P.text, P.extra || '');
    if (myRun !== run) return;
    if (!res.ok && res.pro) return proView(res.pro);

    $('qualityLink')?.addEventListener('click', () => window.spider.openSettings());
    // Nachschärfen mit einem Klick: kürzer, förmlicher, lockerer

    const readAloud = ['Vorlesen', () => speak(res.text, 'Vorlesen', P.mode?.startsWith('explain:') ? P.mode.slice(8) : null, { show: true })];
    footer({ visible: 4, actions: [
      ['Kopieren', async () => { await navigator.clipboard.writeText(res.text); flash('Kopieren', 'Kopiert'); }],
      ...(P.mode === 'reply' ? [] : [readAloud]),
      ['Kürzer', again('Fasse dich deutlich kürzer.')],
      ...(P.mode === 'reply' ? [['Förmlicher', again('Schreibe förmlicher (Sie-Form).')], ['Lockerer', again('Schreibe lockerer und persönlicher.')], readAloud] : []),
    ] });
    maybeAskReview();
  }
  window.spider.onTransformProgress((text) => { if (state === 'running' && $('out')) { $('weave')?.remove(); $('out').innerHTML = `${esc(text)}<span class="cur">▍</span>`; } });

  // ---------- Vergleichen ----------
  async function compare() {
    state = 'running';
    const myRun = ++run;
    $('main').innerHTML = weave('Die Spinne vergleicht …');
    const res = await window.spider.compare(P.a, P.b);
    if (myRun !== run) return;
    if (!res.ok) return showError(res, compare);
    state = 'done';
    const r = res.result;
    $('main').innerHTML = `
      ${r.tip ? `<p style="margin:0 0 10px">${emph(r.tip)}</p>` : ''}
      ${r.diff.length ? `<div class="sec"><div class="h">Unterschiede</div><ul>${r.diff.map((x) => `<li>${emph(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.same.length ? `<div class="sec"><div class="h">Gemeinsam</div><ul>${r.same.map((x) => `<li>${emph(x)}</li>`).join('')}</ul></div>` : ''}`;
    const text = [`# ${P.title}`, r.tip, '', 'Unterschiede:', ...r.diff.map((x) => `- ${x}`), '', 'Gemeinsam:', ...r.same.map((x) => `- ${x}`)].join('\n');
    footer({ actions: [['Kopieren', async () => { await navigator.clipboard.writeText(text); flash('Kopieren', 'Kopiert'); }]] });

  // ---------- Lupe: wo steht das im Text? ----------
  function queryFor(focus) {
    if (focus.type === 'figure') { const f = result.figures[focus.index]; return f ? (f.quote || `${f.label} ${f.value}`) : ''; }
    if (focus.type === 'point') return result.key_points[focus.index] || '';
    if (focus.type === 'finding') { const f = result.findings[focus.index]; return f ? `${f.title} ${f.detail}` : ''; }
    return focus.quote || '';
  }
  const tokens = (q) => (q.toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N},.%€-]*/gu) || [])
    .map((t) => t.replace(/[.,]+$/, '')).filter((t) => t.length > 3 || /\d/.test(t));
  const numKey = (t) => t.replace(/[.\s]/g, '').replace(',', '.');
  function findSource(query, text) {
    if (!query.trim()) return null;
    // 1. wörtlich (Zitat), Leerräume egal
    const words = query.trim().split(/\s+/);
    if (words.length >= 3) {
      const re = new RegExp(words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+'), 'i');
      const m = re.exec(text);
      if (m) return around(text, m.index, m.index + m[0].length);
    }
    // 2. Satz mit den meisten gemeinsamen Wörtern (Zahlen zählen dreifach)
    const want = tokens(query);
    if (!want.length) return null;
    const sents = [...text.matchAll(/[^.!?\n]+(?:[.!?]+|\n|$)/g)];
    let best = null, bestScore = 0;
    for (const m of sents) {
      const have = new Set(tokens(m[0]).map((t) => (/\d/.test(t) ? numKey(t) : t)));
      let score = 0;
      for (const t of want) if (have.has(/\d/.test(t) ? numKey(t) : t)) score += /\d/.test(t) ? 3 : 1;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    if (!best || bestScore < 2) return null;
    const lead = best[0].length - best[0].trimStart().length;
    return around(text, best.index + lead, best.index + best[0].trimEnd().length);
  }
  function around(text, start, end) {
    let a = Math.max(0, text.lastIndexOf('.', start - 2) + 1, start - 160);
    let b = text.indexOf('.', end + 1); b = Math.min(b < 0 ? text.length : b + 1, end + 160);
    return { start, end, before: text.slice(a, start).replace(/\s+/g, ' ').trimStart(), hit: text.slice(start, end), after: text.slice(end, b).replace(/\s+/g, ' ').trimEnd(), cutA: a > 0, cutB: b < text.length };
  }
  function toggleLupe(anchor, focus, afterEl = null) {
    // In der Zahlentabelle hinter dem Wert einfügen (über beide Spalten)
    if (anchor.parentElement?.classList.contains('figs')) anchor = anchor.nextElementSibling;
    const next = (afterEl || anchor).nextElementSibling;
    if (next?.classList.contains('lupe')) { next.remove(); return; }
    document.querySelectorAll('.lupe').forEach((l) => l.remove());
    const text = P.doc.pages.join('\n\n');
    const src = findSource(queryFor(focus), text);
    const box = document.createElement('div');
    box.className = 'lupe';
    box.dataset.noi18n = '';
    box.innerHTML = src
      ? `${src.cutA ? '… ' : ''}${esc(src.before)}<mark>${emph(src.hit)}</mark>${esc(src.after)}${src.cutB ? ' …' : ''}`
      : `<span class="none">${T('Diese Stelle steht so nicht wörtlich im Text.')}</span>`;
    const row = document.createElement('div');
    row.className = 'row';
    // Die Lupe zeigt Dokumenttext (nie übersetzen) – ihre Knöpfe deshalb direkt übersetzt einsetzen
    if (src && P.doc.screenAt) row.innerHTML += `<button class="link" data-l="screen">${T('Auf dem Bildschirm zeigen')}</button>`;
    row.innerHTML += `<button class="link" data-l="reader">${T('Im Lesemodus')}</button>`;
    box.appendChild(row);
    row.querySelector('[data-l="screen"]')?.addEventListener('click', async (e) => {
      const ok = await window.spider.showOnScreen({ screenAt: P.doc.screenAt, start: src.start, end: src.end });
      if (!ok) e.target.textContent = T('nicht mehr auf dem Bildschirm');
    });
    row.querySelector('[data-l="reader"]').addEventListener('click', () => window.spider.openReader(P.doc, result, focus));
    (afterEl ? afterEl.closest('.answer') || anchor : anchor).after(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ---------- Mini-Blase: Was soll ich lesen? ----------
  const MODES = [['read', 'Lesen'], ['translate', 'Übersetzen'], ['simplify', 'Einfach'], ['reply', 'Antworten']];
  const TITLES = { translate: 'Übersetzung', simplify: 'Einfach erklärt', reply: 'Antwort-Entwurf' };
  async function home() {
    state = 'done';
    let mode = P.mode || 'read';
    $('title').textContent = 'Was soll ich lesen?';
    $('main').innerHTML = `
      <div class="chips" id="modes">${MODES.map(([id, l]) => `<button class="chip${id === mode ? ' on' : ''}" data-m="${id}">${l}</button>`).join('')}</div>
      ${P.hint ? `<div class="muted" style="margin-bottom:6px">${esc(P.hint)}</div>` : ''}
      <textarea class="in" id="homeIn" placeholder="Text einfügen … (Enter)"></textarea>
      <div class="clip hidden" id="clip"></div>
      <div class="quick">
        <button class="link" id="qFile">${silkIcon('file')}${T('Datei')}</button>
        <button class="link" id="qRegion">${silkIcon('region')}${T('Bereich')}</button>
        <button class="link" id="qCam">${silkIcon('camera')}${T('Brief fotografieren')}</button>
      </div>
      <div class="sec hidden" id="recentSec"><div class="h sub">Zuletzt gelesen</div><div id="recent"></div></div>`;
    $('modes').addEventListener('click', (e) => {
      const b = e.target.closest('[data-m]'); if (!b) return;

    });
    const go = (text) => { if (text.trim()) runText(text.trim(), mode); };
    $('homeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(e.target.value); } });
    $('qFile').addEventListener('click', async () => {
      busyDialog = true;
      const r = await window.spider.pickFileBubble();
      busyDialog = false;
      if (r.ok) { setBack(home); P = { kind: 'analyze', doc: r.doc }; $('title').textContent = r.doc.title; analyze(); }
      else if (r.pro) { setBack(home); proView(r.pro); }

    $('qRegion').addEventListener('click', () => window.spider.regionCapture());

    footer({ visible: 2, actions: [['Notizbuch', () => { setBack(home); notebook(); }], ['Fristen', () => { setBack(home); deadlines(); }], ['Einstellungen', () => { setBack(home); settings(); }], ['Lesemodus', () => window.spider.openReader(null)]] });
    setTimeout(() => $('homeIn')?.focus(), 60);
    // Zwischenablage als Vorschlag
    const clip = (await window.spider.clipboardText()).trim();
    if (clip && $('clip')) {
      $('clip').innerHTML = `${silkIcon('clip')} Zwischenablage lesen: „${esc(clip.replace(/\s+/g, ' ').slice(0, 60))}${clip.length > 60 ? '…' : ''}“`;
      $('clip').classList.remove('hidden');
      $('clip').addEventListener('click', () => go(clip));
    }
    const recent = (await window.spider.historyList('')).slice(0, 3);
    if (recent.length && $('recent')) {
      $('recentSec').classList.remove('hidden');
      $('recent').innerHTML = recent.map(entryHtml).join('');
      bindEntries($('recent'), home);
    }
  }
  function runText(text, mode) {
    setBack(home);
    if (mode === 'read') { P = { kind: 'analyze', doc: { title: 'Eingefügter Text', source: 'text', pages: [text] } }; $('title').textContent = P.doc.title; analyze(); }
    else { P = { kind: 'transform', mode, title: TITLES[mode], text }; $('title').textContent = P.title; transform(); }
  }

  // ---------- Notizbuch ----------
  const entryHtml = (h) => `<div class="entry" data-id="${esc(h.id)}"><div class="t"><b>${esc(h.title || h.docTitle)}</b><span>${esc(bullets(h.summary)[0] || '')}</span></div>
    ${h.folder !== undefined ? `<button class="fold${h.folder ? ' on' : ''}" title="${T('Mappe')}">${h.folder ? esc(T(h.folder)) : '+'}</button>` : ''}
    <small>${new Date(h.date).toLocaleDateString(I18N.locale, { day: '2-digit', month: '2-digit' })}</small><button class="del" title="Löschen">✕</button></div>`;
  function bindEntries(box, backTo) {
    box.querySelectorAll('.entry').forEach((el) => el.addEventListener('click', async (e) => {
      if (e.target.classList.contains('del')) { await window.spider.historyDelete(el.dataset.id); el.remove(); return; }

  }
  // ---------- Fristen-Netz: alle offenen Fristen aus gelesenen Briefen ----------

  // ---------- Frage an der Spinne: Frist morgen – schon bezahlt? ----------
  function paidQuestion() {
    state = 'done';
    const d = P.d;
    $('title').textContent = T('Frist {w}', { w: d.days === 0 ? T('heute') : T('morgen') });
    $('main').innerHTML = `<p class="lead1"><b>${T('Hast du das schon erledigt?')}</b></p><p class="muted" data-noi18n>${esc(d.title)}</p><p class="muted" data-noi18n style="font-size:12.5px">${esc(d.sentence)}</p>

  async function deadlines() {
    state = 'done';
    $('title').textContent = 'Fristen';
    const list = await window.spider.deadlinesList();
    const open = list.filter((d) => !d.done), done = list.filter((d) => d.done);
    const when = (d) => (d.days === 0 ? T('heute') : d.days === 1 ? T('morgen') : T('in {n} Tagen', { n: d.days }));
    const day = (d) => new Date(`${d.iso}T00:00:00`).toLocaleDateString(I18N.locale, { weekday: 'short', day: 'numeric', month: 'short' });
    const row = (d, i) => `<div class="fr${d.done ? ' done' : ''}${!d.done && d.days <= 3 ? ' soon' : ''}" data-i="${i}">
        <button class="fchk" data-act="done" title="${T(d.done ? 'Wieder offen' : 'Erledigt')}" aria-label="${T(d.done ? 'Wieder offen' : 'Erledigt')}"></button>
        <div class="ft"><div><b>${day(d)}</b> <span class="fw">${when(d)}${d.relative ? ' · ca.' : ''}</span></div>
          <div class="fn" data-noi18n>${esc(d.title)}</div><div class="fs" data-noi18n title="${esc(d.sentence)}">${esc(d.sentence)}</div>
          <div class="fa"><button class="link" data-act="cal">${T('+ Kalender')}</button><button class="link" data-act="open">${T('Brief öffnen')}</button></div></div></div>`;
    const all = [...open, ...done];
    const marks = await window.spider.bookmarkList();
    let month = 0;
    if (!open.length && done.length) { const now = new Date(); month = (await window.spider.historyList('')).filter((h) => { const d = new Date(Number(h.date)); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length; }
    $('main').innerHTML = (marks.length ? `<div class="sec"><div class="h">${T('Später lesen')}</div>${marks.map((b) => `<div class="bm" data-bm="${esc(b.id)}">${silkIcon('bookmark')}<span><span data-noi18n>${esc(b.title)}</span><span class="muted"> · ${new Date(b.at).toLocaleString(I18N.locale, { weekday: 'short', hour: '2-digit', minute: '2-digit' })}</span></span><button class="link" data-bmo>${T('Jetzt lesen')}</button><button class="x" data-bmx title="${T('Entfernen')}" aria-label="${T('Entfernen')}">${silkIcon('close')}</button></div>`).join('')}</div>` : '')
      + (open.length ? open.map((d) => row(d, all.indexOf(d))).join('')
      : done.length ? `<div class="alldone rise"><b>${T('Alle Fristen erledigt 🎉')}</b><span>${month > 1 ? T('Du hast diesen Monat {n} Briefe geschafft.', { n: month }) : T('Gut gemacht!')}</span></div>`
      : `<div class="muted">${T('Keine offenen Fristen. Lies einen Brief, eine Rechnung oder einen Bescheid – die Spinne sammelt die Fristen hier und erinnert dich rechtzeitig.')}</div>`)
      + (done.length ? `<details class="sec"><summary class="h">${T('Erledigt ({n})', { n: done.length })}</summary>${done.map((d) => row(d, all.indexOf(d))).join('')}</details>` : '');
    $('main').querySelectorAll('[data-bm]').forEach((row) => row.addEventListener('click', async (e) => {
      if (e.target.closest('[data-bmx]')) { await window.spider.bookmarkRemove(row.dataset.bm); deadlines(); }
      else if (e.target.closest('[data-bmo]')) window.spider.bookmarkOpen(row.dataset.bm);
    }));
    $('main').querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
      const d = all[Number(b.closest('.fr').dataset.i)];
      if (b.dataset.act === 'done') { await window.spider.deadlineDone(d.key, !d.done); deadlines(); }
      else if (b.dataset.act === 'cal') { const ok = await window.spider.addCalendar({ title: `${T('Frist')}: ${d.title}`, date: d.iso, note: d.sentence }); b.textContent = ok ? T('✓ geöffnet') : T('nicht möglich'); }
      else {
        const h = await window.spider.historyGet(d.histId);
        if (!h) return;
        setBack(deadlines);
        P = { kind: 'analyze', doc: h.doc, result: h.result };
        result = h.result;
        showResult();
      }
    }));
    $('foot').classList.add('hidden');
  }

  async function notebook(folder = null, query = '') {
    state = 'done';
    $('title').textContent = 'Notizbuch';
    const F = await window.spider.folders();
    $('main').innerHTML = `<input class="ask" id="nbQ" placeholder="${T('Suchen – oder fragen und Enter drücken …')}" style="margin-bottom:8px">
      <div id="nbAnswer"></div>
      ${F.used.length ? `<div class="chips" id="nbFolders"><button class="chip${!folder ? ' on' : ''}" data-f="">${T('Alle')}</button>${F.used.map((f) => `<button class="chip${f === folder ? ' on' : ''}" data-f="${esc(f)}">${T(f)}</button>`).join('')}</div>` : ''}
      <div id="nbList"></div>`;
    const load = async () => {
      const list = await window.spider.historyList($('nbQ')?.value || '', folder);
      if (!$('nbList')) return;
      $('nbList').innerHTML = list.length ? list.map(entryHtml).join('') : `<div class="muted">${$('nbQ').value ? 'Nichts gefunden.' : 'Noch nichts gelesen – die Spinne merkt sich hier die letzten 20 Texte.'}</div>`;
      bindEntries($('nbList'), () => notebook(folder));
      // Mappe wählen (Pro)
      $('nbList').querySelectorAll('.fold').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!F.allowed) { setBack(() => notebook(folder)); proView('folders'); return; }
        const row = b.closest('.entry');
        row.querySelector('.fpick')?.remove();
        const pick = document.createElement('div');
        pick.className = 'chips fpick';
        pick.innerHTML = [...F.all, ''].map((f) => `<button class="chip" data-set="${esc(f)}">${f ? T(f) : T('Keine Mappe')}</button>`).join('');
        row.after(pick);
        pick.addEventListener('click', async (ev) => {
          const c = ev.target.closest('[data-set]'); if (!c) return;
          ev.stopPropagation();
          await window.spider.historyFolder(row.dataset.id, c.dataset.set || null);
          notebook(folder);
        });
      }));
    };
    $('nbQ').addEventListener('input', load);
    // Enter: das Notizbuch fragen (Pro)
    $('nbQ').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !e.target.value.trim()) return;
      const q = e.target.value.trim();
      $('nbAnswer').innerHTML = `<div class="answer"><div class="q">${esc(q)}</div><div class="a muted">${T('Die Spinne blättert im Notizbuch …')}</div></div>`;
      const r = await window.spider.notebookAsk(q);
      if (!r.ok && r.pro) { setBack(() => notebook(folder)); proView(r.pro); return; }
      const a = $('nbAnswer').querySelector('.a');
      if (!r.ok) { a.className = 'a error'; a.textContent = r.error; return; }
      a.className = 'a';
      a.innerHTML = `<span data-noi18n>${emph(r.answer)}</span>${r.sources.map((x) => ` <button class="link" data-open="${esc(x.id)}">→ ${esc(x.title)}</button>`).join('')}`;
      a.querySelectorAll('[data-open]').forEach((btn) => btn.addEventListener('click', async () => {
        const h = await window.spider.historyGet(btn.dataset.open); if (!h) return;
        setBack(() => notebook(folder)); P = { kind: 'analyze', doc: h.doc, result: h.result }; result = h.result; showResult();
      }));
    });
    $('nbFolders')?.addEventListener('click', (e) => { const c = e.target.closest('[data-f]'); if (c) notebook(c.dataset.f || null); });
    if ((await window.spider.getSettings()).privateMode) $('nbList').insertAdjacentHTML('beforebegin', `<div class="muted" style="margin-bottom:6px">${silkIcon('lock')} ${T('Privatmodus: Neue Texte werden nicht gespeichert.')}</div>`);
    $('foot').classList.add('hidden');
    await load();
    if (query) { $('nbQ').value = query; load(); }
    $('nbQ').focus();
  }

    state = 'done';
    $('title').textContent = 'Silkreader';
    $('main').innerHTML = `<div class="crash"><svg class="sp" viewBox="-36 -30 72 60" aria-hidden="true"><g stroke="var(--pink)" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -5L18 -15L24 -4M10 -1L21 -7L28 4M10 3L20 2L26 13M8 7L16 9L20 20M-8 -5L-18 -15L-24 -4M-10 -1L-21 -7L-28 4M-10 3L-20 2L-26 13M-8 7L-16 9L-20 20"/></g><circle r="11" fill="#2b2b2b" stroke="var(--pink)" stroke-width="1.2"/><ellipse cx="-4.2" cy="-1.6" rx="3.6" ry="4.1" fill="#fff"/><ellipse cx="4.2" cy="-1.6" rx="3.6" ry="4.1" fill="#fff"/><circle cx="-3.8" cy="-1" r="1.8" fill="#111"/><circle cx="4.6" cy="-1" r="1.8" fill="#111"/></svg>
      <p><b>${T('Da ist leider etwas schiefgelaufen.')}</b> ${T('Ich habe mich neu gestartet.')}</p></div>
      <p>${T('Darf ich das Problem melden? Gesendet wird nur das Protokoll (Fehlermeldung, Systemversion) – kein Brief und kein Text.')}</p>
      <details class="sec"><summary class="muted">${T('Was genau gesendet wird')}</summary><pre class="crashpre" data-noi18n>${esc(P.detail || '')}</pre></details>
      <p class="muted">${T('Beim Melden öffnet sich GitHub im Browser – dort siehst du alles, bevor es abgeschickt wird.')}</p>`;
    footer({ visible: 2, actions: [['Problem melden', async () => { await window.spider.crashReport(); close(); }], ['Nein danke', close], ['Nie mehr fragen', async () => { await window.spider.crashNever(); close(); }]] });
  }
  // ---------- Tastenkürzel (Taste ?) ----------
  async function shortcutsView() {
    state = 'done';
    $('title').textContent = 'Tastenkürzel';
    const list = await window.spider.shortcuts();
    const extra = [['?', 'Diese Hilfe'], ['Esc', 'Blase schließen'], ['Strg+C', 'Ergebnis kopieren'], ['Enter', 'Frage abschicken']];
    $('main').innerHTML = `<div class="keylist">${list.map((k) => `<div><span>${T(k.desc)}</span><kbd>${esc(k.label)}</kbd></div>`).join('')}${extra.map(([k, d]) => `<div><span>${T(d)}</span><kbd>${esc(k)}</kbd></div>`).join('')}</div>
      <p class="muted" style="margin-top:8px">${T('Ändern kannst du sie in den Einstellungen unter „Erweitert“.')}</p>`;
    footer({ actions: [['Alle Einstellungen …', () => window.spider.openSettings()]] });
  }

  // ---------- Zurück ----------
  let backFn = null;
  function setBack(fn) { backFn = fn; $('back').classList.toggle('hidden', !fn); }
  $('back').addEventListener('click', () => { const fn = backFn; setBack(null); run++; document.querySelectorAll('.lupe').forEach((l) => l.remove()); if (fn) { P = { kind: fn.name, mode: P.mode }; fn(); } });

  // ---------- Hilfen ----------
  const toggleMenu = (open) => { const m = $('actMenu'); if (!m) return; m.classList.toggle('hidden', !open); $('moreActs').setAttribute('aria-expanded', String(open)); if (open) m.querySelector('.link')?.focus(); };
  document.addEventListener('click', (e) => { if (!e.target.closest('#actMenu, #moreActs')) toggleMenu(false); });
  // Fußleiste: die wichtigsten Aktionen sichtbar, der Rest im „…“-Menü
  function footer({ ask: withAsk = false, actions = [], visible = null }) {
    const f = $('foot');
    const n = visible ?? (actions.length <= 4 ? actions.length : 3);
    const btn = ([l]) => `<button class="link" data-a="${l}">${ACTION_ICONS[l] ? silkIcon(ACTION_ICONS[l]) : ''}<span>${T(l)}</span></button>`;
    const rest = actions.slice(n);
    f.innerHTML = `${withAsk ? `<div class="askrow"><input class="ask" id="askIn" placeholder="${T('Frage zum Text stellen')}" aria-label="${T('Frage zum Text stellen')}">${window.spider.voiceAvailable || window.SILK_FORCE_MIC ? `<button class="x mic" id="askMic" title="${T('Frage sprechen (Windows-Spracheingabe)')}" aria-label="${T('Frage sprechen')}">${silkIcon('mic')}</button>` : ''}</div>` : ''}<div class="actions">${actions.slice(0, n).map(btn).join('')}${rest.length ? `<span class="spacer"></span><button class="link mbtn" id="moreActs" aria-label="${T('Weitere Aktionen')}" aria-haspopup="menu" aria-expanded="false">${silkIcon('more')}</button><div class="menu hidden" id="actMenu" role="menu">${rest.map(btn).join('')}</div>` : ''}</div>`;
    actions.forEach(([l, fn]) => f.querySelector(`[data-a="${l}"]`).addEventListener('click', (e) => { if (e.currentTarget.closest('.menu')) toggleMenu(false); fn(); }));
    $('moreActs')?.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu($('actMenu').classList.contains('hidden')); });
    $('askMic')?.addEventListener('click', () => { $('askIn').focus(); $('askMic').classList.add('on'); window.spider.voiceTyping(); setTimeout(() => $('askMic')?.classList.remove('on'), 6000); });
    $('askIn')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) { ask(e.target.value.trim()); e.target.value = ''; }
    });
    f.classList.remove('hidden');
  }
  const ACTION_ICONS = { 'Alle Änderungen': 'notebook', 'Im Browser öffnen': 'send', 'Protokoll öffnen': 'file', 'Über': 'info', Vorlesen: 'speak', Kürzer: 'shorter', Förmlicher: 'tone', Lockerer: 'tone', Kopieren: 'copy', Festhalten: 'keep', 'Später lesen': 'bookmark', 'Als PDF speichern': 'file', Drucken: 'file', Lesemodus: 'reader', Sprache: 'translate', 'In meiner Sprache': 'translate', Fristen: 'calendar', Notizbuch: 'notebook', Einstellungen: 'settings', 'Tastenkürzel & mehr …': 'settings', 'Alle Einstellungen …': 'settings', 'Erneut versuchen': 'send' };
  function flash(label, text) { const b = $('foot').querySelector(`[data-a="${label}"] span`); if (!b) return; b.textContent = T(text); setTimeout(() => (b.textContent = T(label)), 1300); }
  function showError(res, retry) {
    state = 'error';
    $('main').innerHTML = `<p class="error">${esc(res.error)}</p>`;
    footer({ actions: [['Erneut versuchen', retry], ...(res.needsKey ? [['Einstellungen', () => window.spider.openSettings()]] : [])] });
  }
  function markdown(r) {
    return [`# ${r.title}`, '', ...bullets(r.summary).map((b) => `- ${b}`), '', `## ${T('Kernaussagen')}`, ...r.key_points.map((p) => `- ${p}`), '',
      `## ${T('Erkenntnisse')}`, ...r.findings.map((f) => `- **[${T(f.kind)}] ${f.title}** – ${f.detail}`), '',
      `## ${T('Angaben')}`, ...r.figures.map((f) => `- ${f.label}: ${f.value} (${T(`S. ${f.page}`)})`)].join('\n');
  }
  async function copyResult() { await navigator.clipboard.writeText(markdown(result)); flash('Kopieren', 'Kopiert'); }
  async function keepResult() { await window.spider.cocoonAddText(markdown(result)); flash('Festhalten', 'Im Netz'); }
  function close() {
    stopSpeaking();
    run++; state = 'idle';
    $('bubble').classList.add('closing');
    setTimeout(() => window.spider.popupClose(), 160);
  }
  $('close').addEventListener('click', close);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === '?' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') && P.kind !== 'shortcuts') {
      e.preventDefault(); const saved = { P, result };
      setBack(function again() { P = saved.P; result = saved.result; if (result) showResult(); else route(); });
      P = { kind: 'shortcuts' }; shortcutsView();
    }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && state === 'done' && P.kind === 'analyze' && !getSelection().toString() && document.activeElement?.id !== 'askIn') { e.preventDefault(); copyResult(); }
  });

  // Fenstergröße an den Inhalt anpassen (sonst schluckt der leere Rest Klicks)
  let sizeQueued = false;
  function reportSize() {
    if (sizeQueued) return;
    sizeQueued = true;
    requestAnimationFrame(() => {
      sizeQueued = false;
      const head = document.querySelector('header').offsetHeight;
      const foot = $('foot').classList.contains('hidden') ? 0 : $('foot').offsetHeight;
      window.spider.popupSize(14 + head + $('main').scrollHeight + foot + 14);
    });
  }
  new MutationObserver(reportSize).observe($('bubble'), { childList: true, subtree: true, characterData: true, attributes: true });
  // Kleine Bedien-Blasen schließen sich, wenn man woanders hinklickt
  let busyDialog = false;
  window.addEventListener('blur', () => setTimeout(() => {
    if (busyDialog || document.hasFocus() || !P || !['home', 'notebook', 'settings'].includes(P.kind)) return;
    if ($('homeIn')?.value.trim()) return;
    close();
  }, 250));

  // Bleibt der Text auf dem PC oder geht er an Claude? Klein im Kopf der Blase anzeigen
  async function showWhere() {
    const el = $('where');
    if (!['analyze', 'transform', 'compare'].includes(P.kind) || (P.kind === 'analyze' && P.result)) { el.classList.add('hidden'); return; }
    const st = await window.spider.getSettings();
    const cloud = st.provider === 'claude';
    el.className = `where${cloud ? ' cloud' : ''}`;
    el.innerHTML = `${silkIcon(cloud ? 'cloud' : 'lock')}<span>${T(cloud ? 'an Claude' : 'auf diesem PC')}</span>`;
    el.title = T(cloud ? 'Dieser Text wird an Claude (Anthropic) geschickt.' : 'Dieser Text bleibt auf deinem PC.');
  }

  // ---------- Was ist neu? ----------
  function whatsNew() {
    state = 'done';
    $('title').textContent = T('Neu in Silkreader {v}', { v: P.version });
    $('main').innerHTML = `<ul class="news" data-noi18n>${P.items.map((x) => `<li class="rise">${esc(x)}</li>`).join('')}</ul>`;
    footer({ actions: [['Alle Änderungen', () => window.spider.openExternal('https://github.com/Sebbilore/silkreader-download/blob/main/CHANGELOG.md')], ['OK', close]] });
  }

  // Welche Ansicht zeigt die Blase?
  function route() {
    if (P.kind === 'analyze' && P.result) { result = P.result; showResult(); }
    else if (P.kind === 'analyze') { $('title').textContent = P.doc.title; analyze(); }
    else if (P.kind === 'home') home();
    else if (P.kind === 'notebook') notebook();
    else if (P.kind === 'deadlines') deadlines();
    else if (P.kind === 'morning') morning();
    else if (P.kind === 'paidq') paidQuestion();
    else if (P.kind === 'crash') crash();
    else if (P.kind === 'shortcuts') shortcutsView();
    else if (P.kind === 'pro') proView(P.feature || null);
    else if (P.kind === 'settings') settings();
    else if (P.kind === 'about') about();
    else if (P.kind === 'whatsnew') whatsNew();
    else if (P.kind === 'report') report();
    else if (P.kind === 'transform') { $('title').textContent = P.title; transform(); }
    else if (P.kind === 'compare') { $('title').textContent = P.title; compare(); }
    else { state = 'done'; $('title').textContent = P.title; $('main').innerHTML = `<p>${esc(P.text)}</p>`; footer({ actions: [['OK', close]] }); }
  }
  window.spider.onPopupDoc((payload) => {
    stopSpeaking();
    P = payload; result = null; run++;
    showWhere();
    setBack(null);
    document.documentElement.style.setProperty('--arrow', `${payload.arrow}px`);
    $('bubble').classList.remove('closing');
    $('bubble').style.animation = 'none'; void $('bubble').offsetWidth; $('bubble').style.animation = '';
    $('foot').classList.add('hidden');
    route();
  });
</script>
</body>
</html>
