<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Silkreader</title>
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<script src="a11y.js"></script>
<script src="icons.js"></script>
<style>
  :root { --bg: var(--ink); --panel: var(--glass-2); --paper: #ffffff; --paper-ink: #1b1b1f; --paper-bg: #e6e6e6;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
  :root[data-theme="dark"] { --paper-bg: #2a2a2a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--font); overflow: hidden; }
  button { font: inherit; font-size: 14px; cursor: pointer; border-radius: var(--r-s); border: 1px solid var(--control-line);
    background: var(--raised); color: var(--text); height: 34px; padding: 0 14px; }
  button:hover { border-color: var(--faint); }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; padding: 0 20px; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }

  main { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; }

  /* Startansicht: Seitenleiste links, Inhalt auf einer Fläche rechts (wie Windows-11-Apps) */
  #start { flex: 1; display: flex; min-width: 0; }
  #side { width: 232px; flex: none; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  #side .brand { display: flex; align-items: center; gap: 10px; padding: 6px 12px 18px; font-weight: 600; }
  #side .brand svg { width: 22px; height: 22px; color: var(--pink); }
  #side button { position: relative; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border: 0; background: none; color: var(--text); text-align: left; }
  #side button:hover { background: var(--line); }
  #side button.on { background: var(--line); font-weight: 600; }
  #side button.on::before { content: ''; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--pink); }
  #side .icon { width: 16px; height: 16px; }
  #side .badge { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: var(--r-s); padding: 0 6px; }
  #side .grow { flex: 1; }
  .surface { flex: 1; min-width: 0; margin: 8px 8px 8px 0; padding: 28px 32px; background: var(--glass-2); border: 1px solid var(--line); border-radius: var(--r-l);
    display: flex; flex-wrap: wrap; gap: 32px; align-content: flex-start; overflow: auto; }
  .drop { flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px; border-radius: var(--r-l); transition: background .2s; }
  .drop.over { background: var(--pink-soft); outline: 2px solid var(--pink); outline-offset: 8px; }
  .drop h1 { margin: 0; font: 600 28px/1.2 var(--font-display); }
  .drop p { margin: 0; color: var(--muted); }
  .drop textarea { width: 100%; height: 340px; resize: vertical; background: var(--raised); color: var(--text);
    border: 1px solid var(--control-line); border-bottom-color: var(--faint); border-radius: var(--r-s); padding: 14px 16px; font: 14px/1.5 var(--font); }
  .drop textarea:focus { outline: none; border-bottom-color: var(--pink); box-shadow: inset 0 -1px 0 var(--pink); }
  .drop .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .drop .tip { margin-left: auto; font-size: 12px; color: var(--muted); }
  #side2 { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  #side2 h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .dlList { display: flex; flex-direction: column; gap: 2px; }
  .dlRow { display: flex; gap: 12px; padding: 10px 12px; background: var(--raised); cursor: pointer; border: 0; border-radius: 0; height: auto; text-align: left; font-size: 14px; }
  .dlRow:first-child { border-radius: var(--r-m) var(--r-m) 0 0; } .dlRow:last-child { border-radius: 0 0 var(--r-m) var(--r-m); } .dlRow:only-child { border-radius: var(--r-m); }
  .dlRow:hover { filter: brightness(1.06); }
  .dlRow .d { width: 56px; flex: none; color: var(--muted); font-variant-numeric: tabular-nums; } .dlRow.soon .d { color: var(--warn); font-weight: 600; }
  .dlRow .t { min-width: 0; } .dlRow .t span { display: block; font-size: 12px; color: var(--muted); }
  .recent { display: flex; flex-direction: column; }
  .recent button { display: flex; gap: 12px; height: auto; padding: 8px 12px; border: 0; background: none; text-align: left; }
  .recent button:hover { background: var(--line); }
  .recent button .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .recent small { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; }
  kbd { font: 12px var(--font); border: 1px solid var(--control-line); border-radius: var(--r-s); padding: 1px 6px; color: var(--text); background: var(--raised); }

  /* Analyseansicht */
  #analysis { flex: 1; display: none; min-width: 0; }
  #docScroll { flex: 1; overflow: auto; background: var(--paper-bg); position: relative; }
  #doc { position: relative; padding: 28px 28px 200px; max-width: 860px; margin: 0 auto; }
  .page { background: var(--paper); color: var(--paper-ink); padding: 36px 44px; margin-bottom: 20px;
    box-shadow: 0 2px 14px rgba(0,0,0,.12); border-radius: 3px; font: 14px/1.7 Georgia, "Times New Roman", serif; }
  .page-no { font: 11px var(--mono); color: #9a9aa6; text-align: right; margin: -18px -24px 10px 0; }
  .page p { margin: 0 0 .9em; white-space: normal; overflow-wrap: anywhere; }
  .truncated { font: 12px var(--mono); color: #666; text-align: center; padding: 8px; }

  .w { border-radius: 2px; transition: background-color .4s; }
  .w.touched { animation: touched 3.2s ease-out forwards; }
  @keyframes touched {
    0% { box-shadow: 0 0 0 1.5px var(--pink); background: rgba(255,45,138,.12); }
    55% { box-shadow: 0 0 0 1.5px var(--pink); }
    100% { box-shadow: 0 0 0 1px rgba(255,45,138,0); }
  }
  .w.scan { background: rgba(255,45,138,.14); }
  .w.hit { background: rgba(255,45,138,.28); box-shadow: 0 0 0 1.5px var(--pink); }
  .w.hit.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { background: var(--pink); color: #fff; } 100% { background: rgba(255,45,138,.28); } }


  /* Ergebnispanel */
  #panel { width: 430px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  #panelHead { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .meta { font: 12px var(--font); color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .meta b { color: var(--text); font-weight: 600; }
  .meta .scanning { color: var(--pink); }
  #docTitle { font-weight: 600; font-size: 17px; margin: 8px 0 2px; }
  #docTitle small { color: var(--muted); font-weight: 400; font-size: 12px; }
  #counter { font: 12px var(--font); color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .4s; }
  .bar.indeterminate i { width: 30%; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

  #panelBody { flex: 1; overflow: auto; padding: 6px 18px 18px; }
  .status { color: var(--muted); font-size: 13px; padding: 14px 0; }
  .error { background: var(--card); border: 1px solid var(--line-2); color: var(--bad); padding: 12px; border-radius: var(--r-m); margin: 14px 0; }
  .error .row { margin-top: 10px; display: flex; gap: 8px; }
  h3 { font: 600 14px var(--font); color: var(--text); margin: 18px 0 8px; }

  .fig { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 6px; border-bottom: 1px solid var(--line);
    cursor: pointer; border-radius: 6px; animation: rowIn .35s ease-out; }
  .fig:hover { background: var(--card); }
  .fig .label { color: var(--text); }
  .fig .value { font: 600 15px var(--font); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
  .fig .src { font: 11px var(--font); color: var(--muted); grid-column: 2; text-align: right; }
  .fig .src.missing { color: var(--faint); }
  .fig.active { background: var(--pink-soft); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .summary { color: var(--text); line-height: 1.6; animation: rowIn .4s ease-out; }
  ul.summary-list { margin: 0; padding-left: 18px; line-height: 1.55; }
  ul.summary-list li { margin-bottom: 5px; }
  ul.summary-list li::marker { color: var(--faint); }
  #status .cursor { color: var(--pink); animation: blink 1s steps(2) infinite; }
  .summary .cursor { color: var(--pink); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #status .status { padding: 8px 0 0; }
  ul.points { padding-left: 18px; margin: 0; }
  ul.points li { margin-bottom: 6px; animation: rowIn .4s ease-out backwards; }
  .finding { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; margin-bottom: 8px;
    animation: rowIn .3s ease-out backwards; }
  .finding .kind { display: inline-block; font: 600 12px var(--font); color: var(--muted); }
  .finding .t { font-weight: 600; margin: 6px 0 2px; font-size: 15px; }
  .finding .d { color: var(--muted); font-size: 13px; }
  .finding .p { font: 11px var(--font); color: var(--muted); margin-top: 4px; }

  #panelFoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  #panelFoot button { flex: 1; }
  .hidden { display: none !important; }
  /* Die kleine Spinne, die im Fenster herumtollt */
  .mascot { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .mascot .m-spider { position: absolute; left: 0; top: 0; overflow: visible; will-change: transform; }
  .mascot .m-thread { position: absolute; left: 0; top: 0; overflow: visible; }
  .mascot .m-thread line { stroke: var(--silk); stroke-width: 1; }
  .mascot .m-femur { stroke: var(--pink); stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .mascot .m-tibia { stroke: var(--pink-2); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .mascot .m-joint { fill: #c41c69; stroke: #ff7db6; stroke-width: .5; }
  .mascot .m-body { fill: url(#mBody); stroke: var(--pink); stroke-width: 1.4; pointer-events: all; cursor: pointer; }
  .mascot .m-shine { fill: rgba(255,255,255,.42); pointer-events: none; }
  .mascot .m-cheek { fill: rgba(255,45,138,.5); pointer-events: none; }
  .mascot .m-eye { fill: url(#mEye); stroke: #0c0c11; stroke-width: .5; pointer-events: none; }
  .mascot .m-pupil { fill: #0c0c11; pointer-events: none; }
  .mascot .m-glint { fill: #fff; pointer-events: none; }
  .mascot .m-mouth { stroke: #ff2d8a; stroke-width: 1.3; fill: none; stroke-linecap: round; pointer-events: none; }
  .mascot .m-fx span { position: absolute; font-size: 16px; animation: floatUp 1.3s ease-out forwards; }
  @keyframes floatUp { from { transform: translate(0, 0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), -70px) scale(1.2); opacity: 0; } }
  .mascot.sleeping::after { content: 'z z Z'; position: absolute; left: var(--zx); top: var(--zy); font: 700 12px var(--font); color: var(--pink);
    animation: zz 2s ease-in-out infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translateY(6px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  .jump { cursor: pointer; border-radius: 6px; transition: background .15s; }
  .jump:hover { background: var(--card); }
  ul.points li.jump { padding: 2px 4px; margin-left: -4px; }
  .focus { background: var(--pink-soft) !important; }
  .ready { text-align: center; padding: 48px 10px; }
  .ready-icon { font-size: 40px; }
  .ready-title { font-size: 18px; font-weight: 600; margin: 8px 0 18px; }
  button.big { font-size: 15px; height: 40px; padding: 0 22px; }
  button.big kbd { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); color: inherit; margin-left: 6px; }
  .ready-keys { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow);
    color: var(--text); padding: 10px 16px; border-radius: var(--r-l); z-index: 99; animation: rowIn .2s ease-out; }

  /* Notizbuch der Spinne */
  #notebook { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding-top: 8vh; }
  #notebook.open { display: flex; }
  #notebook .nb { width: min(560px, 92vw); max-height: 76vh; display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid var(--line-2); border-radius: var(--r-l); box-shadow: var(--shadow); overflow: hidden; }
  #nbSearch { margin: 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--text);
    font: inherit; padding: 14px 18px; outline: none; }
  #nbList { overflow-y: auto; padding: 6px 0; }
  .nbItem { padding: 10px 18px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .nbItem:hover, .nbItem.sel { background: var(--line); }
  .nbItem .t { flex: 1; min-width: 0; }
  .nbItem b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .nbItem span { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nbItem small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .nbItem .del { border: 0; background: transparent; color: var(--muted); padding: 0 4px; visibility: hidden; }
  .nbItem:hover .del { visibility: visible; }
  .nbItem .del:hover { color: var(--bad); }
  .nbEmpty { color: var(--muted); padding: 22px 18px; text-align: center; }

  @media (max-width: 1000px) { #panel { width: 360px; } .page { padding: 24px; } }
</style>
</head>
<body>
<div id="notebook"><div class="nb">
  <input id="nbSearch" placeholder="Notizbuch durchsuchen …" spellcheck="false">
  <div id="nbList"></div>
</div></div>

<main>
  <section id="start">
    <nav id="side" aria-label="Bereiche">
      <div class="brand"><svg viewBox="-36 -30 72 60" aria-hidden="true"><g stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -5L18 -15L24 -4M10 -1L21 -7L28 4M10 3L20 2L26 13M8 7L16 9L20 20M-8 -5L-18 -15L-24 -4M-10 -1L-21 -7L-28 4M-10 3L-20 2L-26 13M-8 7L-16 9L-20 20"/></g><circle r="11" fill="currentColor"/></svg>Silkreader</div>
      <button class="on" id="navRead"><span class="ic" data-i="file"></span>Lesen</button>
      <button id="navNotebook"><span class="ic" data-i="notebook"></span>Notizbuch</button>
      <button id="navDeadlines"><span class="ic" data-i="calendar"></span>Fristen<span class="badge hidden" id="dlBadge"></span></button>
      <span class="grow"></span>
      <button id="navSettings"><span class="ic" data-i="settings"></span>Einstellungen</button>
    </nav>
    <div class="surface">
      <div class="drop" id="drop">
        <h1>Lesen</h1>
        <p><label for="input">Text einfügen oder eine PDF-, Word- oder Textdatei hierher ziehen.</label></p>
        <textarea id="input"></textarea>
        <div class="row">
          <button class="primary" id="btnAnalyze">Lesen</button>
          <button id="btnFile">Datei öffnen</button>
          <span class="tip"><kbd>Strg</kbd> + <kbd>Enter</kbd> liest sofort</span>
        </div>
      </div>
      <aside id="side2">
        <section><h2>Nächste Fristen</h2><div class="dlList" id="dlList"></div></section>
        <section><h2>Zuletzt gelesen</h2><div class="recent" id="recentList"></div></section>
      </aside>
    </div>
  </section>

  <section id="analysis">
    <div id="docScroll"><div id="doc" data-noi18n></div></div>
    <aside id="panel">
      <div id="panelHead">
        <div class="meta"><span><b>Silkreader</b></span><span id="builtWith">KI-Analyse</span><span class="scanning" id="scanLabel">SCANNING</span></div>
        <div id="docTitle"></div>
        <div id="counter"></div>
        <div class="bar indeterminate" id="bar"><i></i></div>
      </div>
      <div id="panelBody"></div>
      <div id="panelFoot">
        <button id="btnSkip">Animation überspringen</button>
        <button id="btnCopy" class="hidden">Ergebnis kopieren</button>
      </div>
    </aside>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
