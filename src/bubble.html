<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Silkreader</title>
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  svg { display: block; width: 100%; height: 100%; }
  #webSvg { position: absolute; inset: 0; pointer-events: none; will-change: transform; }
  #svg { position: absolute; inset: 0; }
  #thread { stroke: var(--silk); stroke-width: 1; }
  #threadShadow { stroke: rgba(10,10,18,.5); stroke-width: 2.4; }
  #web { transition: opacity 4s; }
  #web line, #web polyline { fill: none; stroke: rgba(245,245,250,.9); stroke-width: .9; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 .8px rgba(20,20,30,.7)); }
  /* Beine mit Gelenken: Oberschenkel kräftig, Unterschenkel feiner, Gelenke als kleine Knöpfe */
  /* Die ruhige Spinne: einfarbige Beine, flacher dunkler Körper mit pinkem Rand, kein Glanz */
  .femur { stroke: var(--pink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .tibia { stroke: var(--pink); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .joint { display: none; }
  #body { fill: #2b2b2b; stroke: var(--pink); stroke-width: 1.2; }
  #shine, #shine2 { display: none; }
  .catch #body { stroke: #fff; stroke-width: 2; }
  .eye { fill: #fff; }
  .pupil { fill: #111; }
  .glint { fill: #fff; }
  .cheek { display: none; }
  .brow { stroke: #f1f1f6; stroke-width: 1.1; fill: none; stroke-linecap: round; opacity: 0; transition: opacity .2s; }
  .happyEye { stroke: #fff; stroke-width: 1.5; fill: none; stroke-linecap: round; opacity: 0; }
  #mouth { stroke: var(--pink); stroke-width: 1.3; fill: none; stroke-linecap: round; }
  #sparkle { fill: #fff; opacity: 0; }
  /* Accessoires je Klick-Modus */
  #acc > g { opacity: 0; transition: opacity .3s; }
  #acc > g.on { opacity: 1; }
  .glasses circle { fill: rgba(255,255,255,.1); stroke: #fff; stroke-width: .9; }
  .glasses path { stroke: #fff; stroke-width: .9; fill: none; stroke-linecap: round; }
  .beanie .cap { fill: var(--pink); stroke: #c41c69; stroke-width: .5; }
  .beanie .band { fill: #fff; }
  .beanie .globe { fill: none; stroke: #fff; stroke-width: .6; }
  .beanie .pom { fill: #fff; }
  .bulb .glass { fill: #fff; filter: drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 0 6px var(--pink-glow)); }
  .bulb .base { fill: #9494a6; }
  .bulb .ray { stroke: #fff; stroke-width: .8; stroke-linecap: round; }
  .letter .env { fill: #fff; stroke: #c9c9d6; stroke-width: .4; }
  .letter .flap { fill: none; stroke: var(--pink); stroke-width: .8; stroke-linejoin: round; }
  .letter .heart { fill: var(--pink); }
  /* Saison-Hüte (Halloween, Weihnachten, Neujahr) */
  .witch .brim, .witch .crown { fill: #2b2b2b; stroke: #555; stroke-width: .4; } .witch .band2 { fill: var(--pink); }
  .santa .cap { fill: #d6243a; } .santa .fur, .santa .pom { fill: #fff; }
  .partyhat .cone { fill: var(--pink); } .partyhat .dot, .partyhat .pom { fill: #fff; }
  #fx { font: 600 10px var(--font); fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 2.6px; text-anchor: middle; pointer-events: none; }
  #confetti rect { pointer-events: none; }
  #spider { cursor: grab; }
  #spider.grabbing { cursor: grabbing; }
  #fly .wing { fill: rgba(220,235,255,.85); stroke: rgba(40,40,60,.6); stroke-width: .4; }
  #fly .fbody { fill: #2b2b33; }
  #zzz { font: 700 11px var(--font); fill: var(--pink); paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 2.4px; }
  /* Ablage-Netz: festgehaltene Dokumente kleben als kleine Karten im Spinnennetz */
  #holdWeb { transition: opacity .4s; }
  #holdWeb .silk { fill: none; stroke: var(--silk); stroke-width: .75; stroke-linecap: round;
    filter: drop-shadow(0 0 .8px rgba(15,15,25,.85)); }
  #holdWeb .dew { fill: var(--dew); filter: drop-shadow(0 0 1.5px rgba(255,255,255,.9)); animation: dew-glint 3s ease-in-out infinite; }
  #holdWeb.zone .silk { stroke: var(--pink); stroke-width: 1; }
  /* Leuchtende Ablagefläche – zugleich nötig, damit Windows auch zwischen den Fäden ablegen lässt */
  #zoneGlow { position: absolute; inset: 0; background: rgba(255,45,138,.025); display: none; }
  #zoneGlow::before { content: ''; position: absolute; left: calc(50% - 82px); top: -18px; width: 164px; height: 164px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,138,.28), rgba(255,45,138,.06) 62%, transparent 72%); animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  /* Dokumente hängen als eingesponnene Kokons im Netz; das echte Symbol schaut oben heraus */
  .item { position: absolute; width: 36px; height: 50px; margin: -16px 0 0 -18px; cursor: grab; }
  .item .sway { position: absolute; inset: 0; transform-origin: 50% 0; animation: sway 3.6s ease-in-out infinite; animation-delay: var(--ph, 0s);
    transition: transform var(--t-mid) var(--ease-spring); }
  @keyframes sway { 0%, 100% { transform: rotate(calc(var(--rot, 0deg) - 3deg)); } 50% { transform: rotate(calc(var(--rot, 0deg) + 3deg)); } }
  .item .hang { position: absolute; left: 17.5px; top: -7px; width: 1px; height: 9px; background: var(--silk); }
  .item .coc { position: absolute; left: 4px; top: 1px; width: 28px; height: 36px; border-radius: 50% 50% 46% 46% / 42% 42% 58% 58%;
    background: radial-gradient(60% 50% at 35% 28%, #fff, rgba(236,236,244,.94) 60%, rgba(196,196,210,.92));
    box-shadow: 0 4px 9px rgba(0,0,0,.4), inset 0 -3px 6px rgba(0,0,0,.12); overflow: hidden; }
  .item .ic { position: absolute; left: 5px; top: 3px; width: 18px; height: 18px; background: center/contain no-repeat;
    display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .item .strands { position: absolute; inset: 0; width: 28px; height: 36px; pointer-events: none; }
  .item .strands path { fill: none; stroke: rgba(255,255,255,.95); stroke-width: 1.1; stroke-linecap: round;
    filter: drop-shadow(0 .5px .4px rgba(0,0,0,.25)); }
  .item.text .coc { background: radial-gradient(60% 50% at 35% 28%, #fff, #ffe9f3 60%, #f3c9dc); }
  .item.missing .coc { opacity: .45; filter: grayscale(1); }
  .item .ext { position: absolute; right: -2px; top: 24px; font: 800 7px var(--font); color: #fff; background: var(--ink); border: 1px solid var(--pink);
    padding: 0 3px; border-radius: 4px; line-height: 10px; z-index: 2; }
  .item .nm { position: absolute; top: 39px; left: 50%; transform: translateX(-50%); max-width: 50px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font: 600 8px var(--font); color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000, 0 1px 2px #000; }
  .item:hover .sway { animation-play-state: paused; transform: scale(1.3) translateY(2px); z-index: 3; }
  .item b { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font: 700 9px var(--font); color: #fff;
    background: var(--ink); border: 1px solid var(--pink); padding: 1px 5px; border-radius: 6px; white-space: nowrap; animation: pop 1.2s forwards; z-index: 4; }
  .item.new { animation: stick .6s var(--ease-spring); }
  @keyframes stick { 0% { transform: translateY(40px) scale(.3) rotate(-40deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 4px); } 20%, 70% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  #zoneHint { position: absolute; left: 50%; transform: translateX(-50%); font: 700 10px var(--font); color: #fff; background: var(--ink); border: 1px solid var(--pink);
    padding: 3px 9px; border-radius: 10px; white-space: nowrap; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  body.faded #svg, body.faded #items, body.faded #webSvg, body.faded #count { opacity: .4; }
  #svg, #items, #webSvg, #count { transition: opacity .8s; }
  /* Eingeklapptes Netz: nur ein kleiner Zähler am Faden */
  #items { transition: opacity .3s, transform .3s; transform-origin: 50% 20%; }
  body.webClosed #items { opacity: 0; transform: scale(.4); pointer-events: none; }
  body.webClosed .item .sway, body.webClosed #holdWeb .dew, body.faded .item .sway { animation: none; } /* zugeklappt: nichts animieren (spart Leistung) */
  #count { position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--pink);
    color: var(--text); font: 700 9px/13px var(--font); text-align: center; display: none; transition: opacity .3s; }
  body.webClosed.hasItems #count { display: block; }
  /* Klick-Modus (Mausrad auf der Spinne): kleines Abzeichen + kurzer Hinweis */
  #modeTip { position: absolute; transform: translateX(-50%); font: 600 11px var(--font); color: var(--text); background: var(--surface);
    border: 1px solid var(--line-2); padding: 2px 9px; border-radius: var(--r-s); white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity var(--t-mid) var(--ease-out); box-shadow: var(--shadow); }
  #modeTip.on { opacity: 1; }
</style>
</head>
<body>
<svg id="webSvg"><g id="holdWeb" opacity="0"></g></svg>
<svg id="svg">
  <defs>
    <radialGradient id="gBody" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#4a4a5c"/><stop offset=".35" stop-color="#1d1d27"/><stop offset="1" stop-color="#08080c"/>
    </radialGradient>
    <radialGradient id="gEye" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dcdce8"/></radialGradient>
    <linearGradient id="gLeg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d8a"/><stop offset="1" stop-color="#ff6aa9"/></linearGradient>
  </defs>
  <g id="web" opacity="0"></g>
  <line id="threadShadow" x1="0" y1="0" x2="0" y2="0"/>
  <line id="thread" x1="0" y1="0" x2="0" y2="0"/>
  <g id="fly" style="display:none">
    <ellipse class="wing" id="wingL" cx="-2.6" cy="-2" rx="2.6" ry="1.6"/>
    <ellipse class="wing" id="wingR" cx="2.6" cy="-2" rx="2.6" ry="1.6"/>
    <ellipse class="fbody" cx="0" cy="0" rx="2.2" ry="2.8"/>
  </g>
  <g id="spider">
    <g id="legs"></g>
    <circle id="body" cx="0" cy="0" r="11"/>
    <ellipse id="shine" cx="-4.6" cy="-6.6" rx="3.6" ry="1.9" transform="rotate(-28 -4.6 -6.6)"/>
    <ellipse id="shine2" cx="5.5" cy="7.5" rx="2.4" ry="1" transform="rotate(-35 5.5 7.5)"/>
    <circle class="cheek" cx="-7.2" cy="4.2" r="1.8"/>
    <circle class="cheek" cx="7.2" cy="4.2" r="1.8"/>
    <ellipse class="eye" id="eyeL" cx="-4.4" cy="-1.6" rx="3.9" ry="4.4"/>
    <ellipse class="eye" id="eyeR" cx="4.4" cy="-1.6" rx="3.9" ry="4.4"/>
    <circle class="pupil" id="pupilL" cx="-4.4" cy="-1.6" r="1.9"/>
    <circle class="pupil" id="pupilR" cx="4.4" cy="-1.6" r="1.9"/>
    <circle class="glint" id="glintL" r=".75"/>
    <circle class="glint" id="glintR" r=".75"/>
    <path class="happyEye" id="happyL" d="M-7 -1 q2.6 -3.4 5.2 0"/>
    <path class="happyEye" id="happyR" d="M1.8 -1 q2.6 -3.4 5.2 0"/>
    <path class="brow" id="browL" d=""/>
    <path class="brow" id="browR" d=""/>
    <path id="mouth" d=""/>
    <g id="acc">
      <g class="glasses" id="accRead"><circle cx="-4.4" cy="-1.4" r="4.4"/><circle cx="4.4" cy="-1.4" r="4.4"/><path d="M-1.2 -2.2q1.2 -1 2.4 0M-8.8 -2.4l-2.4 -1.2M8.8 -2.4l2.4 -1.2"/></g>
      <g class="beanie" id="accTranslate"><path class="cap" d="M-9.6 -6.4a9.6 8.6 0 0 1 19.2 0z"/><rect class="band" x="-10.2" y="-7.6" width="20.4" height="2.6" rx="1.3"/>
        <g transform="translate(3.6 -11)"><circle class="globe" r="2.4"/><path class="globe" d="M-2.4 0h4.8M0 -2.4c1.2 1 1.2 3.8 0 4.8M0 -2.4c-1.2 1 -1.2 3.8 0 4.8"/></g><circle class="pom" cx="0" cy="-15.6" r="2"/></g>
      <g class="bulb" id="accSimplify"><g id="bulbBob"><path class="glass" d="M0 -27a4.6 4.6 0 0 1 2.8 8.2c-.6.5 -.8 1 -.8 1.8h-4c0 -.8 -.2 -1.3 -.8 -1.8A4.6 4.6 0 0 1 0 -27z"/>
        <rect class="base" x="-2" y="-16.6" width="4" height="2.4" rx=".8"/><path class="ray" d="M-7.5 -23h-2M7.5 -23h2M-5.5 -28.5l-1.4 -1.4M5.5 -28.5l1.4 -1.4M0 -30v-2"/></g></g>
      <g class="witch" id="accHalloween"><ellipse class="brim" cx="0" cy="-8.6" rx="13" ry="2.4"/><path class="crown" d="M-6.4 -9 L-1 -24 Q1 -27.5 4.2 -25.6 L1.6 -23.4 L6.4 -9 Z"/><rect class="band2" x="-6.2" y="-12.2" width="12.4" height="2.4" rx=".6"/></g>
      <g class="santa" id="accXmas"><path class="cap" d="M-9.4 -7.2 Q-3 -21 11.6 -15.4 L9.8 -7.2 Z"/><rect class="fur" x="-10.6" y="-9" width="21.2" height="3.4" rx="1.7"/><circle class="pom" cx="12.4" cy="-15.6" r="2.3"/></g>
      <g class="partyhat" id="accNewyear"><path class="cone" d="M-6 -8.4 L0 -25 L6 -8.4 Z"/><circle class="dot" cx="-1.6" cy="-13" r=".9"/><circle class="dot" cx="1.8" cy="-17.6" r=".8"/><circle class="dot" cx="2.4" cy="-11" r=".8"/><circle class="pom" cx="0" cy="-25.6" r="1.9"/></g>
      <g class="letter" id="accReply" transform="translate(15 9) rotate(-14)"><rect class="env" x="-5.5" y="-4" width="11" height="8" rx="1"/><path class="flap" d="M-5.5 -4l5.5 4.2 5.5 -4.2"/><path class="heart" d="M0 1.6l-1.4 -1.3a.8.8 0 0 1 1.4 -.8a.8.8 0 0 1 1.4 .8z"/></g>
    </g>
    <path id="sparkle" d="M14 -14l1 -3 1 3 3 1 -3 1 -1 3 -1 -3 -3 -1z"/>
  </g>
  <text id="zzz" x="0" y="0" opacity="0">z</text>
  <text id="fx" x="0" y="0" opacity="0"></text>
  <g id="confetti"></g>
</svg>
<div id="zoneGlow"></div>
<div id="items"></div>
<div id="zoneHint">Hier ablegen</div>
<div id="count"></div>
<div id="modeTip"></div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  // Elemente einmal nachschlagen statt in jedem Bild
  const el = {
    svg: $('svg'), thread: $('thread'), shadow: $('threadShadow'), spider: $('spider'), web: $('web'),
    eyeL: $('eyeL'), eyeR: $('eyeR'), pupilL: $('pupilL'), pupilR: $('pupilR'), mouth: $('mouth'),
    fly: $('fly'), wingL: $('wingL'), wingR: $('wingR'), zzz: $('zzz'),
    glintL: $('glintL'), glintR: $('glintR'), happyL: $('happyL'), happyR: $('happyR'), browL: $('browL'), browR: $('browR'),
    sparkle: $('sparkle'), bulbBob: $('bulbBob'), fx: $('fx'),
  };
  const W = window.innerWidth, H = window.innerHeight;
  const AX = W / 2; // Aufhängepunkt oben in der Mitte

  // Beine: Hüfte am Körper, Knie nach außen oben, Fuß nach außen unten
  const LEGS = [
    { hx: 8, hy: -5, kx: 18, ky: -15, fx: 24, fy: -4 },
    { hx: 10, hy: -1, kx: 21, ky: -7, fx: 28, fy: 4 },
    { hx: 10, hy: 3, kx: 20, ky: 2, fx: 26, fy: 13 },
    { hx: 8, hy: 7, kx: 16, ky: 9, fx: 20, fy: 20 },
  ].flatMap((l, i) => [{ ...l, side: 1, i }, { ...l, hx: -l.hx, kx: -l.kx, fx: -l.fx, side: -1, i }]);
  // Jedes Bein: Oberschenkel, Unterschenkel mit Fußglied, zwei Gelenke
  const legEls = LEGS.map(() => {
    const mk = (tag, cls) => { const e = document.createElementNS(NS, tag); e.setAttribute('class', cls); $('legs').appendChild(e); return e; };
    const femur = mk('line', 'femur'), tibia = mk('polyline', 'tibia'), knee = mk('circle', 'joint'), ankle = mk('circle', 'joint');
    knee.setAttribute('r', '1.35'); ankle.setAttribute('r', '.9');
    return { femur, tibia, knee, ankle };
  });

  // ---------- Zustand ----------
  let minLen = 24, maxLen = 230;
  let baseLen = 90;           // gewünschte Fadenlänge
  let len = -40, lenV = 0;    // aktuelle Länge (startet oben versteckt → fällt herunter)
  let theta = 0.25, omega = 0; // Pendelwinkel
  let spin = 0, spinTarget = 0;
  let lastAnchor = window.screenX, anchorV = 0;
  let cursor = { x: -999, y: -999 };
  let hover = false, dragging = false, busy = false, catching = false;
  let trick = null, trickUntil = 0, trickStart = 0, lenOverride = null;
  let blinkUntil = 0, nextBlink = performance.now() + 2500;
  let nextTrick = performance.now() + 8000 + Math.random() * 6000;
  let lastActivity = performance.now(), sleeping = false, surprisedUntil = 0, chewUntil = 0;
  let wasNear = false, lastHello = 0;
  let spiderPos = { x: AX, y: 60 };
  let override = null; // direkte Position (z. B. beim Netzbauen), sonst Pendel
  let last = performance.now(), lastDraw = 0;
  const SLEEP_AFTER = 120000;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)'); // Windows: „Animationen anzeigen“ aus

  // ---------- Spinnennetz ----------
  const WEB = { cx: AX, cy: 64, r: 48, spokes: 8 };
  const spokeDirs = Array.from({ length: WEB.spokes }, (_, i) => {
    const a = (i / WEB.spokes) * Math.PI * 2 + Math.PI / WEB.spokes;
    return [Math.cos(a), Math.sin(a)];
  });
  // Spirale als Punktfolge auf den Speichen (von innen nach außen)
  const spiral = [];
  for (let k = 0; k <= WEB.spokes * 4.5; k++) {
    const u = k / (WEB.spokes * 4.5);
    const r = 7 + (WEB.r - 9) * u;
    const [dx, dy] = spokeDirs[k % WEB.spokes];
    spiral.push([WEB.cx + dx * r, WEB.cy + dy * r]);
  }
  let webEls = null, webFade = null;
  function resetWeb() {
    clearTimeout(webFade);
    el.web.innerHTML = '';
    el.web.style.transition = 'none';
    el.web.setAttribute('opacity', '1');
    webEls = {
      spokes: spokeDirs.map(() => {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', WEB.cx); l.setAttribute('y1', WEB.cy); l.setAttribute('x2', WEB.cx); l.setAttribute('y2', WEB.cy);
        el.web.appendChild(l);
        return l;
      }),
      spiral: (() => { const p = document.createElementNS(NS, 'polyline'); el.web.appendChild(p); return p; })(),
    };
  }
  function webStep(p) { // p: 0..1 Fortschritt des Netzbaus → Position der Spinne
    const climb = 0.1, spokesEnd = 0.45;
    if (p < climb) return [WEB.cx, WEB.cy];
    if (p < spokesEnd) {
      const q = (p - climb) / (spokesEnd - climb) * WEB.spokes;
      const k = Math.min(WEB.spokes - 1, Math.floor(q));
      const f = q - k;
      const out = f < 0.6 ? f / 0.6 : 1 - (f - 0.6) / 0.4; // raus und zurück
      for (let j = 0; j < WEB.spokes; j++) {
        const done = j < k ? 1 : j === k ? Math.min(1, f / 0.6) : 0;
        webEls.spokes[j].setAttribute('x2', WEB.cx + spokeDirs[j][0] * WEB.r * done);
        webEls.spokes[j].setAttribute('y2', WEB.cy + spokeDirs[j][1] * WEB.r * done);
      }
      return [WEB.cx + spokeDirs[k][0] * WEB.r * out, WEB.cy + spokeDirs[k][1] * WEB.r * out];
    }
    const q = Math.min(1, (p - spokesEnd) / (1 - spokesEnd - 0.06));
    const n = Math.max(1, Math.floor(q * (spiral.length - 1)));
    webEls.spiral.setAttribute('points', spiral.slice(0, n + 1).map((pt) => pt.join(',')).join(' '));
    return spiral[n];
  }

  // ---------- Fliege ----------
  const fly = { on: false, x: 0, y: 0, vx: 0, vy: 0, caught: false };

  // ---------- Tricks ----------
  const TRICKS = {
    yoyo:   { w: 2, run: () => { lenOverride = minLen - 6; setTimeout(() => (lenOverride = null), 420); return 900; } },
    flip:   { w: 2, run: () => { spinTarget += 360; return 900; } },
    wave:   { w: 2, run: () => 1600 },
    peek:   { w: 1, run: () => { lenOverride = -45; setTimeout(() => (lenOverride = null), 1700); return 2600; } },
    swing:  { w: 1, run: () => { omega += (Math.random() < 0.5 ? -1 : 1) * 3.2; return 1500; } },
    dance:  { w: 2, run: () => 1800 },
    bungee: { w: 2, run: () => { lenOverride = H - 40; setTimeout(() => (lenOverride = null), 380); return 2200; } },
    web:    { w: 3, run: () => { resetWeb(); return 9500; } },
    fly:    { w: 3, run: () => {
      const fromLeft = Math.random() < 0.5;

    lenOverride = 12;

    surprisedUntil = performance.now() + 1600;
    return 1800;
  } };
  // Etwas einspinnen: Salto + tanzen
  TRICKS.wrap = { w: 0, run: () => { spinTarget += 720; return 1200; } };
  // Nichts markiert: Kopf schütteln mit Fragezeichen
  TRICKS.shrug = { w: 0, run: () => 1300 };

  // ---------- Weitere Animationen und kleine Überraschungen ----------
  const T_ = (t) => (window.T ? window.T(t) : t);
  // Schwebender Text über der Spinne (Hatschi!, Herz, Hihi …)
  let fx = null;
  function floatText(text, ms = 1600) { fx = { start: performance.now(), ms }; el.fx.textContent = text; kick(); }
  function drawFx(now) {
    if (!fx) return;
    const p = (now - fx.start) / fx.ms;
    if (p >= 1) { fx = null; el.fx.setAttribute('opacity', '0'); return; }
    el.fx.setAttribute('x', spiderPos.x.toFixed(1)); el.fx.setAttribute('y', (spiderPos.y - 22 - p * 14).toFixed(1));
    el.fx.setAttribute('opacity', (p < 0.12 ? p / 0.12 : 1 - Math.max(0, p - 0.65) / 0.35).toFixed(2));
  }
  // Konfetti (Party, Neujahr)
  let bits = [];
  function confetti(n = 36) {
    const g = $('confetti');
    const cols = ['#ff5c9d', '#ffffff', '#ffd166', '#7ad1ff', '#c42b67'];
    for (let i = 0; i < n; i++) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('width', '3'); r.setAttribute('height', '1.8'); r.setAttribute('fill', cols[i % cols.length]);
      g.appendChild(r);
      bits.push({ el: r, x: spiderPos.x, y: spiderPos.y - 6, vx: (Math.random() - 0.5) * 180, vy: -90 - Math.random() * 140,
        a: Math.random() * 360, va: (Math.random() - 0.5) * 720, born: performance.now() });
    }
    kick();
  }
  function drawConfetti(now, dt) {
    if (!bits.length) return;
    bits = bits.filter((b) => {
      b.vy += 260 * dt; b.vx *= 0.99; b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt;
      const age = (now - b.born) / 1000;
      if (age > 2.6 || b.y > H + 10) { b.el.remove(); return false; }
      b.el.setAttribute('transform', `translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) rotate(${b.a.toFixed(0)})`);
      b.el.setAttribute('opacity', Math.min(1, 2.6 - age).toFixed(2));
      return true;
    });
  }
  Object.assign(TRICKS, {
    stretch: { w: 1, run: () => 2200 },                                   // gähnen und strecken
    heart:   { w: 1, run: () => { floatText('♥', 1800); return 1800; } },
    sneeze:  { w: 1, run: () => {                                         // erst kribbelt es, dann: Hatschi!
      setTimeout(() => {
        if (trick !== 'sneeze') return;
        floatText(T_('Hatschi!'), 1300);
        lenOverride = Math.max(minLen, baseLen - 30);
        setTimeout(() => { if (trick === 'sneeze') lenOverride = null; }, 240);
      }, 900);
      return 2200;
    } },
    twirl:   { w: 1, run: () => { spinTarget += 1080; return 2400; } },   // dreht sich am Faden
    look:    { w: 2, run: () => 2600 },                                   // schaut nach links und rechts
    drum:    { w: 1, run: () => 1800 },                                   // trommelt mit den Vorderbeinen
    // nur als Überraschung
    giggle:  { w: 0, run: () => { floatText(T_('Hihi, das kitzelt!'), 1800); return 1800; } },
    dizzy:   { w: 0, run: () => { floatText(T_('Mir ist schwindelig …'), 2600); return 3000; } },
    party:   { w: 0, run: () => { confetti(); [0, 700, 1400].forEach((d) => setTimeout(() => { if (trick === 'party') spinTarget += 360; }, d)); return 3200; } },
  });
  // Saison: Hexenhut zu Halloween, Mütze zu Weihnachten, Partyhut zu Neujahr
  let seasonCache = { at: 0, v: null };
  function season() {
    if (window.__season !== undefined) return window.__season; // für Tests
    const now = Date.now();
    if (now - seasonCache.at < 60000) return seasonCache.v;
    const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
    const v = (m === 10 && day >= 30) || (m === 11 && day === 1) ? 'halloween'
      : m === 12 && day >= 20 && day <= 26 ? 'xmas'
      : (m === 12 && day === 31) || (m === 1 && day === 1) ? 'newyear' : null;
    seasonCache = { at: now, v };
    return v;
  }
  if (season() === 'newyear') setTimeout(() => confetti(50), 2500);
  // Nachteule: zwischen Mitternacht und 4 Uhr einmal pro Nacht
  function nightOwl() {
    const d = new Date();
    if (d.getHours() >= 4) return false;
    try { if (localStorage.getItem('silkOwl') === d.toDateString()) return false; localStorage.setItem('silkOwl', d.toDateString()); } catch { return false; }
    doTrick('stretch');
    setTimeout(() => showTip(T_('Noch wach? Ich auch …'), 3200), 400);
    return true;
  }
  // Kitzeln: Maus schnell über der Spinne hin und her
  const tickle = { lastX: null, dir: 0, flips: [] };
  function checkTickle(p) {
    const now = performance.now();
    if (dragging || Math.hypot(p.x - spiderPos.x, p.y - spiderPos.y) > 30) { tickle.lastX = null; return; }
    if (tickle.lastX !== null) {
      const dx = p.x - tickle.lastX;
      if (Math.abs(dx) > 2) { const dir = Math.sign(dx); if (tickle.dir && dir !== tickle.dir) tickle.flips.push(now); tickle.dir = dir; }
    }
    tickle.lastX = p.x;
    tickle.flips = tickle.flips.filter((x) => now - x < 1500);
    if (tickle.flips.length >= 7 && trick !== 'giggle') { tickle.flips = []; if (trick) endTrick(); doTrick('giggle'); }
  }
  // Schütteln: Spinne am Faden schnell hin und her ziehen
  const shake = { dir: 0, flips: [] };
  let lastPet = 0;

  // ---------- Ablage-Netz ----------
  // Festgehaltene Dokumente kleben als kleine Dateisymbole (mit Vorschau) im Netz.
  const HOLD = { cx: AX, cy: 64, r: 62 };
  // Plätze rund ums Netz: oben links/rechts, Mitte links/rechts, unten links/rechts
  const SPOTS = [[-56, -36, -7], [56, -36, 6], [-76, 10, 5], [76, 10, -6], [-50, 56, -4], [50, 56, 7]]
    .map(([dx, dy, rot]) => ({ x: HOLD.cx + dx, y: HOLD.cy + dy, rot }));
  (function drawHoldWeb() {
    const g = document.getElementById('holdWeb');
    const N = 12;
    const dirs = Array.from({ length: N }, (_, i) => (i / N) * Math.PI * 2 + 0.13);
    const pt = (a, r) => [HOLD.cx + Math.cos(a) * r, Math.max(1, HOLD.cy + Math.sin(a) * r * 0.92)];
    const add = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; };
    for (const a of dirs) { const [x, y] = pt(a, HOLD.r); add('line', { class: 'silk', x1: HOLD.cx, y1: HOLD.cy, x2: x, y2: y }); }
    // Ringe als leicht durchhängende Bögen zwischen den Speichen
    for (let r = 10; r <= HOLD.r - 4; r += 8.5) {
      let d = '';
      dirs.forEach((a, i) => {
        const b = dirs[(i + 1) % N] + (i === N - 1 ? Math.PI * 2 : 0);
        const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r), [cx, cy] = pt((a + b) / 2, r * 0.86);
        d += `${i ? '' : `M${x1},${y1}`} Q${cx},${cy} ${x2},${y2}`;
      });
      add('path', { class: 'silk', d });
    }
    // ein paar Tautropfen
    [[1, 27], [4, 44], [7, 19], [9, 36], [11, 52]].forEach(([i, r]) => { const [x, y] = pt(dirs[i], r); add('circle', { class: 'dew', cx: x, cy: y, r: 1.3 }); });
  })();

  let itemRects = [], itemIds = [], knownIds = new Set(), dropZone = false;
  let noZoneHelper = false; // Windows-Helfer nicht verfügbar → größere Fangfläche um die Spinne
  let webOpenUntil = 0;
  function webIsOpen() { return dropZone || performance.now() < webOpenUntil; }
  function updateHoldWeb() {
    const g = document.getElementById('holdWeb');
    const open = webIsOpen();
    g.setAttribute('opacity', (itemIds.length && open) || dropZone ? '1' : '0');
    document.body.classList.toggle('webClosed', !open);
    document.body.classList.toggle('hasItems', itemIds.length > 0);
    $('count').textContent = itemIds.length;
    $('count').style.left = `${HOLD.cx + 16}px`;
    g.classList.toggle('zone', dropZone);
    $('zoneGlow').style.display = dropZone ? 'block' : 'none';
    $('zoneHint').style.display = dropZone ? 'block' : 'none';
    $('zoneHint').style.top = `${HOLD.cy + HOLD.r + 4}px`;
  }
  const STRANDS = ['M0 15 Q14 20 28 13', 'M0 21 Q14 27 28 19', 'M1 27 Q14 33 27 25', 'M4 32 Q14 36 24 31', 'M2 11 Q13 25 27 29', 'M26 10 Q15 22 3 31']
    .map((d) => `<path d="${d}"/>`).join('');
  function renderItems(list) {
    const box = $('items');
    box.innerHTML = '';
    itemRects = [];
    itemIds = list.slice(0, SPOTS.length).map((it) => it.id);
    list.slice(0, SPOTS.length).forEach((it, i) => {
      const { x, y } = SPOTS[i];
      const c = document.createElement('div');
      const isPhoto = false; // immer das echte Datei-/Ordnersymbol zeigen
      c.className = `item ${it.type}${isPhoto ? ' photo' : ''}${it.missing ? ' missing' : ''}${knownIds.has(it.id) ? '' : ' new'}`;
      c.style.left = `${x}px`; c.style.top = `${y}px`; c.style.setProperty('--rot', `${SPOTS[i].rot}deg`); c.style.setProperty('--ph', `${-i * 0.7}s`);
      c.title = `${it.name}${it.missing ? ' (Datei fehlt)' : ''}\nKlick: lesen · Ziehen: ablegen · Rechtsklick: kopieren und mehr`;
      c.draggable = true;
      const ext = it.type === 'file' && !it.folder ? (it.name.includes('.') ? it.name.split('.').pop().slice(0, 4).toUpperCase() : '') : '';
      const short = it.type === 'file' ? it.name.replace(/\.[^.]+$/, '') : it.name;
      const icon = it.type === 'text' ? '<div class="ic">📝</div>'
        : `<div class="ic" style="${it.icon ? `background-image:url('${it.icon}')` : ''}">${it.icon ? '' : it.folder ? '📁' : '📄'}</div>`;
      // Kokon: Seidenfäden wickeln sich um das Dokument, oben schaut das Symbol heraus
      c.innerHTML = `<div class="sway"><span class="hang"></span><div class="coc">${icon}<svg class="strands" viewBox="0 0 28 36">${STRANDS}</svg></div>`
        + `${ext ? `<span class="ext">${ext}</span>` : ''}<span class="nm">${short.replace(/[<>&]/g, '')}</span></div>`;
      c.addEventListener('click', () => { doTrick('yoyo'); window.spider.cocoonRead(it.id); });
      c.addEventListener('dragstart', (e) => { e.preventDefault(); window.spider.cocoonDrag(it.id); });
      c.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); window.spider.cocoonMenu(it.id); });
      box.appendChild(c);
      itemRects.push({ x: x - 19, y: y - 19, w: 38, h: 46 });
    });
    if (itemIds.some((id) => !knownIds.has(id))) webOpenUntil = performance.now() + 2500; // Neues kurz zeigen
    knownIds = new Set(itemIds);
    updateHoldWeb();
  }
  function flashCopied(c) {
    const b = document.createElement('b');
    b.textContent = '✓ kopiert';
    c.appendChild(b);
    setTimeout(() => b.remove(), 1300);
  }
  window.spider.onCocoons(renderItems);
  window.spider.onCocoonCopied((id) => { const i = itemIds.indexOf(id); if (i >= 0) flashCopied($('items').children[i]); });
  window.spider.onDropZone((on) => {
    if (on === 'unavailable') { noZoneHelper = true; return; }
    dropZone = on; catching = on; if (on) wake(); updateHoldWeb(); kick();
  });
  const zoneRect = () => (dropZone ? { x: 0, y: 0, w: W, h: H } : null);
  const onWeb = (p) => itemIds.length > 0 && webIsOpen() && Math.hypot(p.x - HOLD.cx, (p.y - HOLD.cy) / 0.92) < HOLD.r + 6;


  // ---------- Bedienung ----------
  let down = null;
  el.svg.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    // Klick aufs Netz (nicht auf die Spinne selbst) = Markiertes festhalten
    const p = { x: e.clientX, y: e.clientY };
    down = { onWeb: onWeb(p) && Math.hypot(p.x - spiderPos.x, p.y - spiderPos.y) > 40 };
    wake();
    window.spider.prewarm(); // Sprechblase lädt schon, während die Maustaste noch unten ist
    el.svg.setPointerCapture(e.pointerId);
    if (!down.onWeb) window.spider.rigDragStart(baseLen);
    // Lange drücken (gut mit Touch und Stift): alle Funktionen im Spinnennetz
    const d0 = down;
    d0.timer = setTimeout(() => {
      if (down !== d0 || dragging) return;
      d0.long = true;
      if (trick) endTrick();
      doTrick('hello');
      window.spider.bubbleMenu();
    }, 550);
  });
  el.svg.addEventListener('pointerup', async (e) => {
    if (!down) return;
    const wasWeb = down.onWeb, wasLong = down.long;
    tapAt = performance.now();
    clearTimeout(down.timer);
    down = null;
    el.svg.releasePointerCapture(e.pointerId);
    if (wasWeb) { doTrick('wrap'); window.spider.pinSelection(); return; }
    const { moved } = await window.spider.rigDragEnd();
    if (wasLong) return;
    if (!moved) {
      if (trick) endTrick();
      doTrick('yoyo');
      window.spider.spiderTake();
    }
  });
  el.svg.addEventListener('contextmenu', (e) => { e.preventDefault(); window.spider.bubbleMenu(); });

  window.addEventListener('dragenter', (e) => { e.preventDefault(); catching = true; wake(); });
  window.addEventListener('dragover', (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; catching = true; });
  window.addEventListener('dragleave', () => { catching = false; });
  // Fallen gelassene Dokumente und Texte werden immer im Kokon festgehalten.
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    catching = false;
    if (trick) endTrick();
    const files = [...e.dataTransfer.files];
    const text = e.dataTransfer.getData('text/plain');
    if (!files.length && !text) return;
    doTrick('wrap');
    if (files.length) window.spider.cocoonAddFiles(files);
    else window.spider.cocoonAddText(text);
  });

  // ---------- Klick-Modus: Mausrad auf der Spinne ----------
  const MODES = [['read', 'Lesen', ''], ['translate', 'Übersetzen', '⇄'], ['simplify', 'Einfach', 'Aa'], ['reply', 'Antworten', '↩']];
  let clickMode = 'read', lastWheel = 0, tipTimer = null, glassesUntil = 0;
  let taskMode = null, taskUntil = 0, shownAcc = null, talking = false;
  const ACC = { read: 'accRead', translate: 'accTranslate', simplify: 'accSimplify', reply: 'accReply', halloween: 'accHalloween', xmas: 'accXmas', newyear: 'accNewyear' };
  // Welches Accessoire trägt die Spinne gerade? Läuft eine Aufgabe: deren Accessoire (Lesebrille, Mütze, Glühbirne, Brief),
  // sonst das des Klick-Modus (im Lese-Modus ohne Brille – die gibt es nur beim Lesen)
  function updateAccessory(now) {
    if (busy && taskMode) taskUntil = now + 3000;
    const m = now < taskUntil ? taskMode : now < glassesUntil ? 'read' : clickMode === 'read' ? season() : clickMode;
    if (m === shownAcc) return;
    shownAcc = m;
    for (const [mode, id] of Object.entries(ACC)) $(id).classList.toggle('on', mode === m);
  }
  window.spider.onRigTask((m) => { taskMode = m; taskUntil = performance.now() + 3000; wake(); });
  window.spider.onRigTalk((on) => { talking = on; wake(); });
  function showTip(text, ms = 1400) {
    const tip = $('modeTip');
    tip.textContent = text;
    tip.style.left = `${spiderPos.x}px`; tip.style.top = `${spiderPos.y + 20}px`;
    tip.classList.add('on');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => tip.classList.remove('on'), ms);
  }
  // Längerer Text kopiert: kleiner Hinweis, die Spinne winkt
  window.spider.onRigHint((t) => {
    if (!t) { $('modeTip').classList.remove('on'); return; }
    wake(); lastNear = performance.now();
    if (!trick) doTrick('hello');
    showTip(t, 8000);
  });
  function setClickMode(m, announce) {
    clickMode = MODES.some(([id]) => id === m) ? m : 'read';
    const [, label] = MODES.find(([id]) => id === clickMode);
    if (clickMode === 'read' && announce) glassesUntil = performance.now() + 2500;
    if (!announce) return;
    const tip = $('modeTip');
    tip.textContent = `Klick: ${label}`;
    tip.style.left = `${spiderPos.x}px`; tip.style.top = `${spiderPos.y + 20}px`;
    tip.classList.add('on');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => tip.classList.remove('on'), 1400);
  }
  // Das Mausrad auf der Spinne schaltet keinen Modus mehr um (kannte niemand, passierte aus Versehen).
  el.svg.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  window.spider.onClickMode((m) => setClickMode(m, false));

  window.spider.onRigInit((d) => { minLen = d.minLen; maxLen = d.maxLen; baseLen = d.length; setClickMode(d.clickMode, false); });
  window.spider.onCursor((p) => {
    cursor = p;
    checkTickle(p);
    if (Math.hypot(p.x - spiderPos.x, p.y - spiderPos.y) < 230 || webIsOpen()) kick();
  });
  window.spider.onThreadLength((l) => { baseLen = l; });
  window.spider.onRigDragging((d) => {
    dragging = d; el.spider.classList.toggle('grabbing', d);
    if (!d && shake.flips.filter((x) => performance.now() - x < 2000).length >= 4) { if (trick) endTrick(); doTrick('dizzy'); }
    if (!d) { shake.flips = []; shake.dir = 0; }
  });
  window.spider.onRigTrick((t) => { wake(); if (trick) endTrick(); doTrick(t); });
  window.spider.onBusy((b) => {
    busy = b;
    kick();
    wake();
    if (b && trick) endTrick();
    if (!b) { doTrick('flip'); proudUntil = performance.now() + 2800; }
  });

  requestAnimationFrame(frame);
</script>
</body>
</html>
