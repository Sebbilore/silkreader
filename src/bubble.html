<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Silkreader</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  svg { display: block; width: 100%; height: 100%; }
  #webSvg { position: absolute; inset: 0; pointer-events: none; will-change: transform; }
  #svg { position: absolute; inset: 0; }
  #thread { stroke: rgba(245,245,250,.95); stroke-width: 1; }
  #threadShadow { stroke: rgba(20,20,30,.45); stroke-width: 2.4; }
  #web { transition: opacity 4s; }
  #web line, #web polyline { fill: none; stroke: rgba(245,245,250,.9); stroke-width: .9; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 .8px rgba(20,20,30,.7)); }
  .leg { stroke: #ff2d8a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #body { fill: #16161d; stroke: #ff2d8a; stroke-width: 1.6; }
  .catch #body { stroke: #fff; stroke-width: 2.2; }
  .eye { fill: #fff; stroke: #16161d; stroke-width: .5; }
  .pupil { fill: #111; }
  .cheek { fill: rgba(255,45,138,.45); }
  #mouth { stroke: #ff2d8a; stroke-width: 1.3; fill: none; stroke-linecap: round; }
  #spider { cursor: grab; }
  #spider.grabbing { cursor: grabbing; }
  #fly .wing { fill: rgba(220,235,255,.85); stroke: rgba(40,40,60,.6); stroke-width: .4; }
  #fly .fbody { fill: #2b2b33; }
  #zzz { font: 700 11px "Segoe UI", system-ui, sans-serif; fill: #ff2d8a; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 2.4px; }
  /* Ablage-Netz: festgehaltene Dokumente kleben als kleine Karten im Spinnennetz */
  #holdWeb { transition: opacity .4s; }
  #holdWeb .silk { fill: none; stroke: rgba(255,255,255,.92); stroke-width: .75; stroke-linecap: round;
    filter: drop-shadow(0 0 .8px rgba(15,15,25,.85)); }
  #holdWeb .dew { fill: rgba(255,255,255,.95); filter: drop-shadow(0 0 1px rgba(120,180,255,.9)); }
  #holdWeb.zone .silk { stroke: #ff2d8a; stroke-width: 1; filter: drop-shadow(0 0 1.5px rgba(255,45,138,.8)); }
  /* Leuchtende Ablagefläche – zugleich nötig, damit Windows auch zwischen den Fäden ablegen lässt */
  #zoneGlow { position: absolute; inset: 0; background: rgba(255,45,138,.025); display: none; }
  #zoneGlow::before { content: ''; position: absolute; left: calc(50% - 82px); top: -18px; width: 164px; height: 164px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,138,.28), rgba(255,45,138,.06) 62%, transparent 72%); animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  .item { position: absolute; width: 36px; height: 44px; margin: -18px 0 0 -18px; cursor: grab; transform: rotate(var(--rot, 0deg));
    transition: transform .18s; }
  .item .card { position: absolute; left: 3px; top: 0; width: 30px; height: 30px; border-radius: 7px; background: #fff;
    box-shadow: 0 3px 7px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); overflow: hidden; }
  .item .ic { position: absolute; inset: 3px; background: center/contain no-repeat; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .item.photo .ic { inset: 0; background-size: cover; }
  .item.text .card { background: #fff6fb; }
  .item.missing .card { opacity: .45; filter: grayscale(1); }
  .item .ext { position: absolute; right: -1px; top: 20px; font: 800 7px "Segoe UI", sans-serif; color: #16161d; background: #fff; border: 1px solid #16161d;
    padding: 0 3px; border-radius: 3px; line-height: 11px; z-index: 2; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  /* Spinnenseide, mit der das Dokument festgeklebt ist */
  .item .card::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(32deg, transparent 47%, rgba(255,255,255,.95) 48%, rgba(255,255,255,.95) 50.5%, transparent 51.5%),
                linear-gradient(-28deg, transparent 60%, rgba(255,255,255,.9) 61%, rgba(255,255,255,.9) 63%, transparent 64%),
                linear-gradient(80deg, transparent 22%, rgba(255,255,255,.7) 23%, rgba(255,255,255,.7) 24.5%, transparent 25.5%); }
  .item .nm { position: absolute; top: 31px; left: 50%; transform: translateX(-50%); max-width: 46px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font: 600 8px "Segoe UI", sans-serif; color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000, 0 1px 2px #000; }
  .item:hover { transform: rotate(0deg) scale(1.35) translateY(2px); z-index: 3; }
  .item b { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font: 700 9px "Segoe UI", sans-serif; color: #ff2d8a;
    background: #fff; padding: 1px 4px; border-radius: 4px; white-space: nowrap; animation: pop 1.2s forwards; z-index: 4; }
  .item.new { animation: stick .6s cubic-bezier(.2,1.5,.4,1); }
  @keyframes stick { 0% { transform: translateY(40px) scale(.3) rotate(-40deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(var(--rot, 0deg)); } }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 4px); } 20%, 70% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  #zoneHint { position: absolute; left: 50%; transform: translateX(-50%); font: 700 10px "Segoe UI", sans-serif; color: #fff; background: #16161d; border: 1px solid #ff2d8a;
    padding: 3px 9px; border-radius: 10px; white-space: nowrap; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  body.faded #svg, body.faded #items, body.faded #webSvg, body.faded #count { opacity: .4; }
  #svg, #items, #webSvg, #count { transition: opacity .8s; }
  /* Eingeklapptes Netz: nur ein kleiner Zähler am Faden */
  #items { transition: opacity .3s, transform .3s; transform-origin: 50% 20%; }
  body.webClosed #items { opacity: 0; transform: scale(.4); pointer-events: none; }
  #count { position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #16161d; border: 1.5px solid #ff2d8a;
    color: #fff; font: 700 9px/13px "Segoe UI", sans-serif; text-align: center; display: none; transition: opacity .3s; }
  body.webClosed.hasItems #count { display: block; }
  /* Klick-Modus (Mausrad auf der Spinne): kleines Abzeichen + kurzer Hinweis */
  #badge circle { fill: #16161d; stroke: #ff2d8a; stroke-width: 1.2; }
  #badge text { fill: #fff; font: 700 7px "Segoe UI", sans-serif; text-anchor: middle; }
  #modeTip { position: absolute; transform: translateX(-50%); font: 600 10px "Segoe UI", sans-serif; color: #fff; background: #16161d;
    border: 1px solid #ff2d8a; padding: 2px 8px; border-radius: 9px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #modeTip.on { opacity: 1; }
</style>
</head>
<body>
<svg id="webSvg"><g id="holdWeb" opacity="0"></g></svg>
<svg id="svg">
  <g id="web" opacity="0"></g>
  <line id="threadShadow" x1="0" y1="0" x2="0" y2="0"/>
  <line id="thread" x1="0" y1="0" x2="0" y2="0"/>
  <g id="fly" style="display:none">
    <ellipse class="wing" id="wingL" cx="-2.6" cy="-2" rx="2.6" ry="1.6"/>
    <ellipse class="wing" id="wingR" cx="2.6" cy="-2" rx="2.6" ry="1.6"/>
    <ellipse class="fbody" cx="0" cy="0" rx="2.2" ry="2.8"/>
  </g>
  <g id="spider">
    <g id="legs"></g>
    <circle id="body" cx="0" cy="0" r="11"/>
    <circle class="cheek" cx="-7.2" cy="4.2" r="1.8"/>
    <circle class="cheek" cx="7.2" cy="4.2" r="1.8"/>
    <ellipse class="eye" id="eyeL" cx="-4.4" cy="-1.6" rx="3.9" ry="4.4"/>
    <ellipse class="eye" id="eyeR" cx="4.4" cy="-1.6" rx="3.9" ry="4.4"/>
    <circle class="pupil" id="pupilL" cx="-4.4" cy="-1.6" r="1.9"/>
    <circle class="pupil" id="pupilR" cx="4.4" cy="-1.6" r="1.9"/>
    <path id="mouth" d=""/>
  </g>
  <text id="zzz" x="0" y="0" opacity="0">z</text>
  <g id="badge" style="display:none"><circle r="6.5"/><text y="2.5" id="badgeTx"></text></g>
</svg>
<div id="zoneGlow"></div>
<div id="items"></div>
<div id="zoneHint">Hier ablegen</div>
<div id="count"></div>
<div id="modeTip"></div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  // Elemente einmal nachschlagen statt in jedem Bild
  const el = {
    svg: $('svg'), thread: $('thread'), shadow: $('threadShadow'), spider: $('spider'), web: $('web'),
    eyeL: $('eyeL'), eyeR: $('eyeR'), pupilL: $('pupilL'), pupilR: $('pupilR'), mouth: $('mouth'),
    fly: $('fly'), wingL: $('wingL'), wingR: $('wingR'), zzz: $('zzz'),
  };
  const W = window.innerWidth, H = window.innerHeight;
  const AX = W / 2; // Aufhängepunkt oben in der Mitte

  // Beine: Hüfte am Körper, Knie nach außen oben, Fuß nach außen unten
  const LEGS = [
    { hx: 8, hy: -5, kx: 18, ky: -15, fx: 24, fy: -4 },
    { hx: 10, hy: -1, kx: 21, ky: -7, fx: 28, fy: 4 },
    { hx: 10, hy: 3, kx: 20, ky: 2, fx: 26, fy: 13 },
    { hx: 8, hy: 7, kx: 16, ky: 9, fx: 20, fy: 20 },
  ].flatMap((l, i) => [{ ...l, side: 1, i }, { ...l, hx: -l.hx, kx: -l.kx, fx: -l.fx, side: -1, i }]);
  const legEls = LEGS.map(() => {
    const p = document.createElementNS(NS, 'polyline');
    p.setAttribute('class', 'leg');
    $('legs').appendChild(p);
    return p;
  });

  // ---------- Zustand ----------
  let minLen = 24, maxLen = 230;
  let baseLen = 90;           // gewünschte Fadenlänge
  let len = -40, lenV = 0;    // aktuelle Länge (startet oben versteckt → fällt herunter)
  let theta = 0.25, omega = 0; // Pendelwinkel
  let spin = 0, spinTarget = 0;
  let lastAnchor = window.screenX, anchorV = 0;
  let cursor = { x: -999, y: -999 };
  let hover = false, dragging = false, busy = false, catching = false;
  let trick = null, trickUntil = 0, trickStart = 0, lenOverride = null;
  let blinkUntil = 0, nextBlink = performance.now() + 2500;
  let nextTrick = performance.now() + 8000 + Math.random() * 6000;
  let lastActivity = performance.now(), sleeping = false, surprisedUntil = 0, chewUntil = 0;
  let wasNear = false, lastHello = 0;
  let spiderPos = { x: AX, y: 60 };
  let override = null; // direkte Position (z. B. beim Netzbauen), sonst Pendel
  let last = performance.now(), lastDraw = 0;
  const SLEEP_AFTER = 120000;

  // ---------- Spinnennetz ----------
  const WEB = { cx: AX, cy: 64, r: 48, spokes: 8 };
  const spokeDirs = Array.from({ length: WEB.spokes }, (_, i) => {
    const a = (i / WEB.spokes) * Math.PI * 2 + Math.PI / WEB.spokes;
    return [Math.cos(a), Math.sin(a)];
  });
  // Spirale als Punktfolge auf den Speichen (von innen nach außen)
  const spiral = [];
  for (let k = 0; k <= WEB.spokes * 4.5; k++) {
    const u = k / (WEB.spokes * 4.5);
    const r = 7 + (WEB.r - 9) * u;
    const [dx, dy] = spokeDirs[k % WEB.spokes];
    spiral.push([WEB.cx + dx * r, WEB.cy + dy * r]);
  }
  let webEls = null, webFade = null;
  function resetWeb() {
    clearTimeout(webFade);
    el.web.innerHTML = '';
    el.web.style.transition = 'none';
    el.web.setAttribute('opacity', '1');
    webEls = {
      spokes: spokeDirs.map(() => {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', WEB.cx); l.setAttribute('y1', WEB.cy); l.setAttribute('x2', WEB.cx); l.setAttribute('y2', WEB.cy);
        el.web.appendChild(l);
        return l;
      }),
      spiral: (() => { const p = document.createElementNS(NS, 'polyline'); el.web.appendChild(p); return p; })(),
    };
  }
  function webStep(p) { // p: 0..1 Fortschritt des Netzbaus → Position der Spinne
    const climb = 0.1, spokesEnd = 0.45;
    if (p < climb) return [WEB.cx, WEB.cy];
    if (p < spokesEnd) {
      const q = (p - climb) / (spokesEnd - climb) * WEB.spokes;
      const k = Math.min(WEB.spokes - 1, Math.floor(q));
      const f = q - k;
      const out = f < 0.6 ? f / 0.6 : 1 - (f - 0.6) / 0.4; // raus und zurück
      for (let j = 0; j < WEB.spokes; j++) {
        const done = j < k ? 1 : j === k ? Math.min(1, f / 0.6) : 0;
        webEls.spokes[j].setAttribute('x2', WEB.cx + spokeDirs[j][0] * WEB.r * done);
        webEls.spokes[j].setAttribute('y2', WEB.cy + spokeDirs[j][1] * WEB.r * done);
      }
      return [WEB.cx + spokeDirs[k][0] * WEB.r * out, WEB.cy + spokeDirs[k][1] * WEB.r * out];
    }
    const q = Math.min(1, (p - spokesEnd) / (1 - spokesEnd - 0.06));
    const n = Math.max(1, Math.floor(q * (spiral.length - 1)));
    webEls.spiral.setAttribute('points', spiral.slice(0, n + 1).map((pt) => pt.join(',')).join(' '));
    return spiral[n];
  }

  // ---------- Fliege ----------
  const fly = { on: false, x: 0, y: 0, vx: 0, vy: 0, caught: false };

  // ---------- Tricks ----------
  const TRICKS = {
    yoyo:   { w: 2, run: () => { lenOverride = minLen - 6; setTimeout(() => (lenOverride = null), 420); return 900; } },
    flip:   { w: 2, run: () => { spinTarget += 360; return 900; } },
    wave:   { w: 2, run: () => 1600 },
    peek:   { w: 1, run: () => { lenOverride = -45; setTimeout(() => (lenOverride = null), 1700); return 2600; } },
    swing:  { w: 1, run: () => { omega += (Math.random() < 0.5 ? -1 : 1) * 3.2; return 1500; } },
    dance:  { w: 2, run: () => 1800 },
    bungee: { w: 2, run: () => { lenOverride = H - 40; setTimeout(() => (lenOverride = null), 380); return 2200; } },
    web:    { w: 3, run: () => { resetWeb(); return 9500; } },
    fly:    { w: 3, run: () => {
      const fromLeft = Math.random() < 0.5;
      Object.assign(fly, { on: true, caught: false, x: fromLeft ? -8 : W + 8, y: 50 + Math.random() * 120, vx: fromLeft ? 40 : -40, vy: 0 });
      el.fly.style.display = '';
      return 5200;
    } },
  };
  function doTrick(name) {
    trick = name;
    trickStart = performance.now();
    trickUntil = trickStart + TRICKS[name].run();
  }
  function randomTrick() {
    const names = Object.keys(TRICKS);
    let r = Math.random() * names.reduce((s, n) => s + TRICKS[n].w, 0);
    for (const n of names) { r -= TRICKS[n].w; if (r <= 0) return n; }
    return names[0];
  }
  function endTrick() {
    if (trick === 'web') {
      override = null;
      // Netz bleibt eine Weile hängen und verblasst dann
      webFade = setTimeout(() => { el.web.style.transition = 'opacity 4s'; el.web.setAttribute('opacity', '0'); }, 45000);
    }
    if (trick === 'fly') { fly.on = false; el.fly.style.display = 'none'; lenOverride = null; }
    if (trick === 'scared' || trick === 'return') lenOverride = null; // nie oben hängen bleiben
    trick = null;
  }
  function wake() {
    lastActivity = performance.now();
    if (!sleeping) return;
    sleeping = false;
    surprisedUntil = performance.now() + 1200;
    el.zzz.setAttribute('opacity', '0');
    doTrick('yoyo');
  }

  // ---------- Animationsschleife ----------
  function frame(now) {
    requestAnimationFrame(frame);
    // Bildrate begrenzen: ruhig 20 fps, schlafend 10 fps, nur bei Action volle Bildrate
    const active = dragging || hover || trick || catching || busy || Math.abs(omega) > 0.6 || Math.abs(lenV) > 40;
    const minGap = sleeping ? 250 : active ? 0 : 83;
    if (now - lastDraw < minGap) return;
    lastDraw = now;

    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    if (trick && now > trickUntil) endTrick();
    if (!sleeping && !busy && !dragging && now - lastActivity > SLEEP_AFTER && !trick) {
      sleeping = true;
    }
    if (!trick && !sleeping && !hover && !dragging && !busy && !catching && now > nextTrick) {
      doTrick(randomTrick());
      nextTrick = now + 8000 + Math.random() * 10000;
    }

    // Faden: gefederte Länge (wippt nach); im Schlaf leichtes Atmen
    let lenTarget = lenOverride ?? (baseLen + (catching ? 22 : 0));
    if (sleeping) lenTarget = baseLen + Math.sin(t * 1.4) * 3;
    if (trick === 'web') lenTarget = WEB.cy - 11;
    const k = 140, damp = 9;
    lenV += (-(len - lenTarget) * k - lenV * damp) * dt;
    len += lenV * dt;

    // Pendel: schwingt, wenn das Fenster seitlich bewegt wird, plus leichte Brise
    const ax = window.screenX;
    const v = (ax - lastAnchor) / Math.max(dt, 0.001);
    const acc = (v - anchorV) / Math.max(dt, 0.001);
    anchorV = v; lastAnchor = ax;
    const L = Math.max(30, len + 20);
    const nearMouse = Math.hypot(cursor.x - spiderPos.x, cursor.y - spiderPos.y) < 130 && !dragging;
    const breeze = sleeping || nearMouse ? 0 : Math.sin(t * 0.7) * 0.25 + Math.sin(t * 1.9) * 0.1;
    omega += (-(1700 / L) * Math.sin(theta) - 1.2 * omega - (Math.max(-6000, Math.min(6000, acc)) / L) * Math.cos(theta) * 0.9 + breeze) * dt;
    if (nearMouse) omega *= Math.pow(0.02, dt); // Maus kommt → Spinne hält still
    if (busy) omega += Math.sin(t * 9) * 1.2 * dt;
    if (trick === 'web') omega *= 0.85;
    theta = Math.max(-1.2, Math.min(1.2, theta + omega * dt));

    spin += (spinTarget - spin) * Math.min(1, dt * 7);

    let sx = AX + Math.sin(theta) * Math.max(len, 0);
    let sy = Math.cos(theta) * len + 11;
    let rot = -theta * 57.3 + spin + (busy ? Math.sin(t * 14) * 8 : 0) + (trick === 'shrug' ? Math.sin(t * 22) * 14 : 0)
      + (trick === 'scared' && lenOverride === null ? Math.sin(t * 60) * 7 : 0);

    if (trick === 'web') {
      const p = (now - trickStart) / (trickUntil - trickStart);
      if (p > 0.1) {
        const [wx, wy] = webStep(p);
        const prev = override || { x: sx, y: sy };
        override = { x: prev.x + (wx - prev.x) * Math.min(1, dt * 14), y: prev.y + (wy - prev.y) * Math.min(1, dt * 14) };
        rot = Math.atan2(override.y - prev.y, override.x - prev.x) * 57.3 - 90;
        if (Math.hypot(override.y - prev.y, override.x - prev.x) < 0.3) rot = 0;
        sx = override.x; sy = override.y;
        len = sy - 11; lenV = 0; theta = Math.asin(Math.max(-1, Math.min(1, (sx - AX) / Math.max(len, 1)))) * 0.5;
      }
    }

    if (trick === 'fly' && fly.on) updateFly(now, dt, t, sx, sy);
    if (fly.caught === true && trick === 'fly') {
      // Spinne schnappt nach der Fliege: Faden zur Fliege, dann zurück
      lenOverride = Math.max(minLen, fly.y - 11);
      const desired = Math.asin(Math.max(-0.9, Math.min(0.9, (fly.x - AX) / Math.max(len, 20))));
      theta += (desired - theta) * Math.min(1, dt * 10);
      omega *= 0.8;
    }

    spiderPos = { x: sx, y: sy };
    el.thread.setAttribute('x1', AX); el.thread.setAttribute('y1', 0);
    el.thread.setAttribute('x2', sx); el.thread.setAttribute('y2', sy - 11);
    el.shadow.setAttribute('x1', AX); el.shadow.setAttribute('x2', sx); el.shadow.setAttribute('y2', sy - 11);
    el.spider.setAttribute('transform', `translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${rot.toFixed(1)})`);
    el.svg.classList.toggle('catch', catching);

    if (trick === 'shrug') {
      el.zzz.textContent = '?';
      el.zzz.setAttribute('x', sx + 13); el.zzz.setAttribute('y', sy - 13);
      el.zzz.setAttribute('opacity', '1');
    } else if (!sleeping && el.zzz.textContent === '?') {
      el.zzz.setAttribute('opacity', '0');
    }
    if (sleeping) {
      const zp = (t * 0.5) % 1;
      el.zzz.textContent = zp < 0.33 ? 'z' : zp < 0.66 ? 'z z' : 'z z Z';
      el.zzz.setAttribute('x', sx + 12); el.zzz.setAttribute('y', sy - 14 - zp * 8);
      el.zzz.setAttribute('opacity', (1 - zp * 0.6).toFixed(2));
    }

    if (clickMode !== 'read') $('badge').setAttribute('transform', `translate(${(sx + 12).toFixed(1)} ${(sy + 10).toFixed(1)})`);
    drawLegs(t);
    drawFace(now);
    hitTest(now);
  }

  function updateFly(now, dt, t, sx, sy) {
    const age = (now - trickStart) / 1000;
    if (!fly.caught) {
      // zickzack-Flug in Richtung Spinne
      const tx = sx + Math.sin(t * 2.3) * 35, ty = sy - 10 + Math.cos(t * 3.1) * 25;
      fly.vx += ((tx - fly.x) * 1.4 - fly.vx * 0.9 + (Math.random() - 0.5) * 900) * dt;
      fly.vy += ((ty - fly.y) * 1.4 - fly.vy * 0.9 + (Math.random() - 0.5) * 900) * dt;
      fly.x += fly.vx * dt; fly.y += fly.vy * dt;
      fly.x = Math.max(6, Math.min(W - 6, fly.x)); fly.y = Math.max(8, Math.min(H - 20, fly.y));
      if (age > 2.6) { fly.caught = true; fly.vx = fly.vy = 0; }
    } else if (fly.caught === true && Math.hypot(fly.x - sx, fly.y - sy) < 14) {
      fly.caught = 'eaten';
      el.fly.style.display = 'none'; // geschnappt!
      chewUntil = now + 1400;
      lenOverride = null;
      trickUntil = Math.min(trickUntil, now + 1600);
    }
    const flap = Math.sin(t * 90) > 0 ? 1.6 : 0.5;
    el.wingL.setAttribute('ry', flap); el.wingR.setAttribute('ry', flap);
    el.fly.setAttribute('transform', `translate(${fly.x.toFixed(1)} ${fly.y.toFixed(1)}) scale(1.5)`);
  }

  function drawLegs(t) {
    const speed = busy ? 20 : hover ? 9 : trick === 'dance' ? 16 : trick === 'web' ? 14 : sleeping ? 0.6 : 3;
    const amp = busy ? 2.2 : trick === 'dance' ? 3.5 : trick === 'web' ? 2.4 : hover ? 1.8 : sleeping ? 0.4 : 1.1;
    LEGS.forEach((l, n) => {
      let { hx, hy, kx, ky, fx, fy } = l;
      const ph = Math.sin(t * speed + l.i * 1.3 + (l.side > 0 ? 0 : Math.PI));
      fy += ph * amp; ky += ph * amp * 0.6;
      if (sleeping) { fx *= 0.72; fy = fy * 0.6 + 4; kx *= 0.8; }
      if (catching) { fx *= 1.25; fy -= 10; kx *= 1.1; ky -= 6; }
      if ((trick === 'wave' || trick === 'hello') && l.i === 0 && l.side === 1) {
        const w = Math.sin(t * 14) * 6;
        kx = 16; ky = -22; fx = 22 + w; fy = -32;
      }
      if (trick === 'bungee' && len > baseLen + 40) { fy -= 10; ky -= 8; } // Beine hoch im freien Fall
      legEls[n].setAttribute('points', `${hx},${hy} ${kx},${ky} ${fx},${fy}`);
    });
  }

  function drawFace(now) {
    if (now > nextBlink) { blinkUntil = now + 130; nextBlink = now + 2500 + Math.random() * 4000; }
    const surprised = now < surprisedUntil;
    const closed = sleeping || now < blinkUntil;
    const ry = closed ? 0.5 : (catching || busy || surprised ? 5 : 4.4);
    el.eyeL.setAttribute('ry', ry); el.eyeR.setAttribute('ry', ry);
    // Pupillen schauen zum Mauszeiger – oder zur Fliege
    const look = trick === 'fly' && fly.on && el.fly.style.display !== 'none' ? fly : cursor;
    const ang = (-theta * 57.3 + spin) * Math.PI / 180;
    for (const [p, ex] of [[el.pupilL, -4.4], [el.pupilR, 4.4]]) {
      const wx = spiderPos.x + ex, wy = spiderPos.y - 1.6;
      const dx = look.x - wx, dy = look.y - wy;
      const rx = dx * Math.cos(-ang) - dy * Math.sin(-ang);
      const ry2 = dx * Math.sin(-ang) + dy * Math.cos(-ang);
      const d = Math.hypot(rx, ry2) || 1;
      const m = Math.min(1.8, d / 30);
      p.setAttribute('cx', ex + (rx / d) * m);
      p.setAttribute('cy', -1.6 + (ry2 / d) * m * 1.2);
      p.style.opacity = closed ? 0 : 1;
      p.setAttribute('r', surprised ? 1.3 : 1.9);
    }
    const chewing = now < chewUntil;
    const mouth = sleeping ? 'M-2 6 Q0 6.8 2 6'
      : chewing ? (Math.sin(now / 70) > 0 ? 'M-2.4 5.4 Q0 8.4 2.4 5.4' : 'M-2.4 6.4 L2.4 6.4')
      : busy || surprised ? 'M-1.6 6.4 a1.6 1.6 0 1 0 3.2 0 a1.6 1.6 0 1 0 -3.2 0'
      : catching ? 'M-3 5.5 Q0 10 3 5.5'
      : hover ? 'M-3.4 5.2 Q0 9 3.4 5.2'
      : 'M-2.4 5.6 Q0 7.6 2.4 5.6';
    if (el.mouth.getAttribute('d') !== mouth) el.mouth.setAttribute('d', mouth);
  }

  // Nur über der Spinne (oder direkt am Faden) Mausereignisse annehmen, sonst durchklicken lassen
  let wasInside = null;
  let lastNear = performance.now();
  function hitTest(now) {
    const d = Math.hypot(cursor.x - spiderPos.x, cursor.y - spiderPos.y);
    const onThread = cursor.y > 0 && cursor.y < spiderPos.y - 10 &&
      Math.abs(cursor.x - (AX + (spiderPos.x - AX) * (cursor.y / Math.max(spiderPos.y, 1)))) < 6;
    const inRect = (r) => r && cursor.x >= r.x && cursor.x <= r.x + r.w && cursor.y >= r.y && cursor.y <= r.y + r.h;
    // Netz aufspannen, wenn die Maus in die Nähe kommt; unauffällig werden nach 30 s Ruhe
    const nearWeb = itemIds.length && Math.hypot(cursor.x - HOLD.cx, cursor.y - HOLD.cy) < HOLD.r + 30;
    if (nearWeb) { const was = webIsOpen(); webOpenUntil = now + 800; if (!was) updateHoldWeb(); }
    else if (document.body.classList.contains('webClosed') !== !webIsOpen()) updateHoldWeb();
    const nearAny = Math.hypot(cursor.x - spiderPos.x, cursor.y - spiderPos.y) < 220 || nearWeb;
    if (nearAny || trick || busy || dragging) lastNear = now;
    const fade = now - lastNear > 30000;
    if (fade !== document.body.classList.contains('faded')) document.body.classList.toggle('faded', fade);
    const inside = dragging || down !== null || d < (noZoneHelper ? 52 : 42) || onThread || (webIsOpen() && itemRects.some(inRect)) || inRect(zoneRect()) || onWeb(cursor);
    if (inside !== wasInside) {
      wasInside = inside;
      window.spider.rigHover(inside);
    }
    if (!dragging) hover = inside && d < 44;

    // Aufwachen, wenn die Maus in die Nähe kommt; Winken, wenn sie neu auftaucht
    const near = d < 130;
    if (near) { if (sleeping) wake(); else lastActivity = now; }
    if (near && !wasNear && !trick && now - lastHello > 30000) { doTrick('hello'); lastHello = now; }
    wasNear = near;
  }
  TRICKS.hello = { w: 0, run: () => 1400 };
  // Ei legen: kurz runter, dann wieder hoch (das Ei fällt im Overlay weiter)
  // Die große Spinne kommt: erschrecken, zittern und nach oben verschwinden …
  TRICKS.scared = { w: 0, run: () => {
    surprisedUntil = performance.now() + 900;
    setTimeout(() => { if (trick === 'scared') lenOverride = -70; }, 650);
    return 15000; // bleibt versteckt, bis 'return' kommt
  } };
  // … und danach vorsichtig wieder herunterlugen
  TRICKS.return = { w: 0, run: () => {
    lenOverride = 12;
    setTimeout(() => { if (trick === 'return') lenOverride = null; }, 900);
    surprisedUntil = performance.now() + 1600;
    return 1800;
  } };
  // Etwas einspinnen: Salto + tanzen
  TRICKS.wrap = { w: 0, run: () => { spinTarget += 720; return 1200; } };
  // Nichts markiert: Kopf schütteln mit Fragezeichen
  TRICKS.shrug = { w: 0, run: () => 1300 };

  // ---------- Ablage-Netz ----------
  // Festgehaltene Dokumente kleben als kleine Dateisymbole (mit Vorschau) im Netz.
  const HOLD = { cx: AX, cy: 64, r: 62 };
  // Plätze rund ums Netz: oben links/rechts, Mitte links/rechts, unten links/rechts
  const SPOTS = [[-56, -36, -7], [56, -36, 6], [-76, 10, 5], [76, 10, -6], [-50, 56, -4], [50, 56, 7]]
    .map(([dx, dy, rot]) => ({ x: HOLD.cx + dx, y: HOLD.cy + dy, rot }));
  (function drawHoldWeb() {
    const g = document.getElementById('holdWeb');
    const N = 12;
    const dirs = Array.from({ length: N }, (_, i) => (i / N) * Math.PI * 2 + 0.13);
    const pt = (a, r) => [HOLD.cx + Math.cos(a) * r, Math.max(1, HOLD.cy + Math.sin(a) * r * 0.92)];
    const add = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; };
    for (const a of dirs) { const [x, y] = pt(a, HOLD.r); add('line', { class: 'silk', x1: HOLD.cx, y1: HOLD.cy, x2: x, y2: y }); }
    // Ringe als leicht durchhängende Bögen zwischen den Speichen
    for (let r = 10; r <= HOLD.r - 4; r += 8.5) {
      let d = '';
      dirs.forEach((a, i) => {
        const b = dirs[(i + 1) % N] + (i === N - 1 ? Math.PI * 2 : 0);
        const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r), [cx, cy] = pt((a + b) / 2, r * 0.86);
        d += `${i ? '' : `M${x1},${y1}`} Q${cx},${cy} ${x2},${y2}`;
      });
      add('path', { class: 'silk', d });
    }
    // ein paar Tautropfen
    [[1, 27], [4, 44], [7, 19], [9, 36], [11, 52]].forEach(([i, r]) => { const [x, y] = pt(dirs[i], r); add('circle', { class: 'dew', cx: x, cy: y, r: 1.3 }); });
  })();

  let itemRects = [], itemIds = [], knownIds = new Set(), dropZone = false;
  let noZoneHelper = false; // Windows-Helfer nicht verfügbar → größere Fangfläche um die Spinne
  let webOpenUntil = 0;
  function webIsOpen() { return dropZone || performance.now() < webOpenUntil; }
  function updateHoldWeb() {
    const g = document.getElementById('holdWeb');
    const open = webIsOpen();
    g.setAttribute('opacity', (itemIds.length && open) || dropZone ? '1' : '0');
    document.body.classList.toggle('webClosed', !open);
    document.body.classList.toggle('hasItems', itemIds.length > 0);
    $('count').textContent = itemIds.length;
    $('count').style.left = `${HOLD.cx + 16}px`;
    g.classList.toggle('zone', dropZone);
    $('zoneGlow').style.display = dropZone ? 'block' : 'none';
    $('zoneHint').style.display = dropZone ? 'block' : 'none';
    $('zoneHint').style.top = `${HOLD.cy + HOLD.r + 4}px`;
  }
  function renderItems(list) {
    const box = $('items');
    box.innerHTML = '';
    itemRects = [];
    itemIds = list.slice(0, SPOTS.length).map((it) => it.id);
    list.slice(0, SPOTS.length).forEach((it, i) => {
      const { x, y } = SPOTS[i];
      const c = document.createElement('div');
      const isPhoto = false; // immer das echte Datei-/Ordnersymbol zeigen
      c.className = `item ${it.type}${isPhoto ? ' photo' : ''}${it.missing ? ' missing' : ''}${knownIds.has(it.id) ? '' : ' new'}`;
      c.style.left = `${x}px`; c.style.top = `${y}px`; c.style.setProperty('--rot', `${SPOTS[i].rot}deg`);
      c.title = `${it.name}${it.missing ? ' (Datei fehlt)' : ''}\nKlick: lesen · Ziehen: ablegen · Rechtsklick: kopieren und mehr`;
      c.draggable = true;
      const ext = it.type === 'file' && !it.folder ? (it.name.includes('.') ? it.name.split('.').pop().slice(0, 4).toUpperCase() : '') : '';
      const short = it.type === 'file' ? it.name.replace(/\.[^.]+$/, '') : it.name;
      const icon = it.type === 'text' ? '<div class="ic">📝</div>'
        : `<div class="ic" style="${it.icon ? `background-image:url('${it.icon}')` : ''}">${it.icon ? '' : it.folder ? '📁' : '📄'}</div>`;
      c.innerHTML = `<div class="card">${icon}</div>${ext ? `<span class="ext">${ext}</span>` : ''}<span class="nm">${short.replace(/[<>&]/g, '')}</span>`;
      c.addEventListener('click', () => { doTrick('yoyo'); window.spider.cocoonRead(it.id); });
      c.addEventListener('dragstart', (e) => { e.preventDefault(); window.spider.cocoonDrag(it.id); });
      c.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); window.spider.cocoonMenu(it.id); });
      box.appendChild(c);
      itemRects.push({ x: x - 19, y: y - 19, w: 38, h: 46 });
    });
    if (itemIds.some((id) => !knownIds.has(id))) webOpenUntil = performance.now() + 2500; // Neues kurz zeigen
    knownIds = new Set(itemIds);
    updateHoldWeb();
  }
  function flashCopied(c) {
    const b = document.createElement('b');
    b.textContent = '✓ kopiert';
    c.appendChild(b);
    setTimeout(() => b.remove(), 1300);
  }
  window.spider.onCocoons(renderItems);
  window.spider.onCocoonCopied((id) => { const i = itemIds.indexOf(id); if (i >= 0) flashCopied($('items').children[i]); });
  window.spider.onDropZone((on) => {
    if (on === 'unavailable') { noZoneHelper = true; return; }
    dropZone = on; catching = on; if (on) wake(); updateHoldWeb();
  });
  const zoneRect = () => (dropZone ? { x: 0, y: 0, w: W, h: H } : null);
  const onWeb = (p) => itemIds.length > 0 && webIsOpen() && Math.hypot(p.x - HOLD.cx, (p.y - HOLD.cy) / 0.92) < HOLD.r + 6;


  // ---------- Bedienung ----------
  let down = null;
  el.svg.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    // Klick aufs Netz (nicht auf die Spinne selbst) = Markiertes festhalten
    const p = { x: e.clientX, y: e.clientY };
    down = { onWeb: onWeb(p) && Math.hypot(p.x - spiderPos.x, p.y - spiderPos.y) > 40 };
    wake();
    el.svg.setPointerCapture(e.pointerId);
    if (!down.onWeb) window.spider.rigDragStart(baseLen);
  });
  el.svg.addEventListener('pointerup', async (e) => {
    if (!down) return;
    const wasWeb = down.onWeb;
    down = null;
    el.svg.releasePointerCapture(e.pointerId);
    if (wasWeb) { doTrick('wrap'); window.spider.pinSelection(); return; }
    const { moved } = await window.spider.rigDragEnd();
    if (!moved) {
      if (trick) endTrick();
      doTrick('yoyo');
      window.spider.spiderTake();
    }
  });
  el.svg.addEventListener('contextmenu', (e) => { e.preventDefault(); window.spider.bubbleMenu(); });

  window.addEventListener('dragenter', (e) => { e.preventDefault(); catching = true; wake(); });
  window.addEventListener('dragover', (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; catching = true; });
  window.addEventListener('dragleave', () => { catching = false; });
  // Fallen gelassene Dokumente und Texte werden immer im Kokon festgehalten.
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    catching = false;
    if (trick) endTrick();
    const files = [...e.dataTransfer.files];
    const text = e.dataTransfer.getData('text/plain');
    if (!files.length && !text) return;
    doTrick('wrap');
    if (files.length) window.spider.cocoonAddFiles(files);
    else window.spider.cocoonAddText(text);
  });

  // ---------- Klick-Modus: Mausrad auf der Spinne ----------
  const MODES = [['read', 'Lesen', ''], ['translate', 'Übersetzen', '⇄'], ['simplify', 'Einfach', 'Aa'], ['reply', 'Antworten', '↩']];
  let clickMode = 'read', lastWheel = 0, tipTimer = null;
  function setClickMode(m, announce) {
    clickMode = MODES.some(([id]) => id === m) ? m : 'read';
    const [, label, glyph] = MODES.find(([id]) => id === clickMode);
    $('badge').style.display = clickMode === 'read' ? 'none' : '';
    $('badgeTx').textContent = glyph;
    if (!announce) return;
    const tip = $('modeTip');
    tip.textContent = `Klick: ${label}`;
    tip.style.left = `${spiderPos.x}px`; tip.style.top = `${spiderPos.y + 20}px`;
    tip.classList.add('on');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => tip.classList.remove('on'), 1400);
  }
  el.svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastWheel < 220) return;
    lastWheel = now;
    wake();
    const i = MODES.findIndex(([id]) => id === clickMode);
    const next = MODES[(i + (e.deltaY > 0 ? 1 : MODES.length - 1)) % MODES.length][0];
    setClickMode(next, true);
    doTrick('flip');
    window.spider.setClickMode(next);
  }, { passive: false });
  window.spider.onClickMode((m) => setClickMode(m, false));

  window.spider.onRigInit((d) => { minLen = d.minLen; maxLen = d.maxLen; baseLen = d.length; setClickMode(d.clickMode, false); });
  window.spider.onCursor((p) => { cursor = p; });
  window.spider.onThreadLength((l) => { baseLen = l; });
  window.spider.onRigDragging((d) => { dragging = d; el.spider.classList.toggle('grabbing', d); });
  window.spider.onRigTrick((t) => { wake(); if (trick) endTrick(); doTrick(t); });
  window.spider.onBusy((b) => {
    busy = b;
    wake();
    if (b && trick) endTrick();
    if (!b) doTrick('flip');
  });

  requestAnimationFrame(frame);
</script>
</body>
</html>
