<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Silkreader</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .leg { stroke: #ff2d8a; stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .body { fill: #16161d; stroke: #ff2d8a; stroke-width: 3; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  .eye { fill: #fff; stroke: #16161d; stroke-width: 1; }
  .pupil { fill: #111; }
  .cheek { fill: rgba(255,45,138,.45); }
  .mouth { stroke: #ff2d8a; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .egg { fill: #fbf7ef; stroke: #d9cdb8; stroke-width: 1.5; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); }
  .crack { stroke: #8a7a62; stroke-width: 1.4; fill: none; stroke-linejoin: round; }
  .trail { stroke: rgba(255,45,138,.55); stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 3 5; }
  .thread { stroke: rgba(245,245,250,.95); stroke-width: 1.2; filter: drop-shadow(0 0 1px rgba(20,20,30,.8)); }
</style>
</head>
<body>
<svg id="svg">
  <g id="trails"></g>
  <line id="thread" class="thread" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
  <g id="egg">
    <g id="eggTop"><path class="egg" d="M-14 2 C-14 -12 -8 -22 0 -22 C8 -22 14 -12 14 2 Z"/></g>
    <g id="eggBottom"><path class="egg" d="M-14 2 C-14 14 -8 20 0 20 C8 20 14 14 14 2 Z"/></g>
    <path id="crack" class="crack" d="" />
  </g>
  <g id="spider" style="display:none">
    <g id="legs"></g>
    <circle class="body" cx="0" cy="0" r="26"/>
    <circle class="cheek" cx="-17" cy="10" r="4.2"/>
    <circle class="cheek" cx="17" cy="10" r="4.2"/>
    <ellipse class="eye" cx="-10.5" cy="-4" rx="9" ry="10.5" id="eyeL"/>
    <ellipse class="eye" cx="10.5" cy="-4" rx="9" ry="10.5" id="eyeR"/>
    <circle class="pupil" id="pupilL" cx="-10.5" cy="-4" r="4.4"/>
    <circle class="pupil" id="pupilR" cx="10.5" cy="-4" r="4.4"/>
    <path class="mouth" id="mouth" d="M-6 13 Q0 18 6 13"/>
  </g>
</svg>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const S = 2.4; // große Spinne = 2,4 × die kleine
  const LEGS = [
    { hx: 8, hy: -5, kx: 18, ky: -15, fx: 24, fy: -4 },
    { hx: 10, hy: -1, kx: 21, ky: -7, fx: 28, fy: 4 },
    { hx: 10, hy: 3, kx: 20, ky: 2, fx: 26, fy: 13 },
    { hx: 8, hy: 7, kx: 16, ky: 9, fx: 20, fy: 20 },
  ].flatMap((l, i) => [{ ...l, side: 1, i }, { ...l, hx: -l.hx, kx: -l.kx, fx: -l.fx, side: -1, i }]);
  const legEls = LEGS.map(() => {
    const p = document.createElementNS(NS, 'polyline');
    p.setAttribute('class', 'leg');
    $('legs').appendChild(p);
    return p;
  });

  const ease = (t) => 1 - (1 - t) ** 3;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function drawLegs(t, walking, splay = 0) {
    LEGS.forEach((l, n) => {
      let { hx, hy, kx, ky, fx, fy } = l;
      // Gangart: diagonale Beinpaare wechseln sich ab
      const ph = Math.sin(t * 16 + (l.i % 2 ? Math.PI : 0) + (l.side > 0 ? 0 : Math.PI));
      if (walking) { fx += ph * 3 * l.side; fy += Math.max(0, ph) * -4; ky += Math.max(0, ph) * -3; }
      fx *= 1 + splay; kx *= 1 + splay * 0.6;
      legEls[n].setAttribute('points', [hx, hy, kx, ky, fx, fy].map((v) => (v * S).toFixed(1)).join(' ').replace(/(\S+) (\S+) ?/g, '$1,$2 '));
    });
  }

  window.spider.onOverlayStart(({ from, anchor, width, height }) => {
    // Bereich, über den die große Spinne "liest": links vom Ende der Markierung, ein paar Zeilen hoch
    const ax = clamp(anchor.x, 260, width - 60), ay = clamp(anchor.y, 140, height - 60);
    const left = clamp(ax - 460, 50, width - 200), right = clamp(ax + 30, left + 150, width - 50);
    const rows = [ay - 96, ay - 64, ay - 32, ay].map((y) => clamp(y, 60, height - 40));
    const land = { x: clamp(ax - 20, 40, width - 40), y: clamp(ay + 46, 60, height - 30) };

    // Weg der großen Spinne: Zeile für Zeile im Zickzack
    const path = [];
    rows.forEach((y, r) => { const xs = r % 2 ? [right, left] : [left, right]; path.push({ x: xs[0], y }, { x: xs[1], y }); });
    const segLen = path.slice(1).map((p, i) => Math.hypot(p.x - path[i].x, p.y - path[i].y));
    const totalLen = segLen.reduce((a, b) => a + b, 0);

    const T = { fall: 750, wobble: 650, hatch: 350, walk: 2600, leave: 600 };
    const t0 = performance.now();
    const egg = $('egg'), sp = $('spider');
    let trail = null, lastRow = -1;

    function frame(now) {
      const el = now - t0;
      const t = now / 1000;
      let k = el;

      if (k < T.fall) {
        // Ei fällt an einem Faden von der kleinen Spinne herunter
        const p = ease(k / T.fall);
        const x = from.x + (land.x - from.x) * p, y = from.y + (land.y - from.y) * p;
        $('thread').style.display = '';
        $('thread').setAttribute('x1', from.x); $('thread').setAttribute('y1', from.y - 10);
        $('thread').setAttribute('x2', x); $('thread').setAttribute('y2', y - 20);
        egg.setAttribute('transform', `translate(${x} ${y}) rotate(${Math.sin(p * 9) * 12 * (1 - p)})`);
        return requestAnimationFrame(frame);
      }
      $('thread').style.display = 'none';
      k -= T.fall;

      if (k < T.wobble) {
        const p = k / T.wobble;
        const squash = p < 0.15 ? 1 - Math.sin(p / 0.15 * Math.PI) * 0.15 : 1;
        egg.setAttribute('transform', `translate(${land.x} ${land.y}) rotate(${Math.sin(p * 30) * 10 * p}) scale(${2 - squash} ${squash})`);
        // Risse wachsen
        const n = Math.floor(p * 6);
        $('crack').setAttribute('d', 'M-14 2' + ' L-9 -3 L-4 3 L1 -4 L6 2 L10 -3 L14 2'.split(' L').slice(0, n + 1).join(' L'));
        return requestAnimationFrame(frame);
      }
      k -= T.wobble;

      if (k < T.hatch) {
        // Ei springt auf, die große Spinne ploppt heraus
        const p = k / T.hatch;
        $('eggTop').setAttribute('transform', `translate(${p * 26} ${-p * 40}) rotate(${p * 70})`);
        $('eggTop').style.opacity = 1 - p;
        sp.style.display = '';
        const sc = 0.3 + ease(p) * 0.8 - Math.sin(p * Math.PI) * 0.1;
        sp.setAttribute('transform', `translate(${land.x} ${land.y - 30 * p}) scale(${sc})`);
        drawLegs(t, false, 0.3 * (1 - p));
        return requestAnimationFrame(frame);
      }
      k -= T.hatch;
      egg.style.opacity = Math.max(0, 1 - k / 400);

      if (k < T.walk) {
        // Über den Text laufen und eine Seidenspur hinterlassen
        let d = ease(Math.min(1, k / T.walk)) * totalLen, i = 0;
        while (i < segLen.length - 1 && d > segLen[i]) { d -= segLen[i]; i++; }
        const a = path[i], b = path[i + 1], f = segLen[i] ? d / segLen[i] : 1;
        const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
        const row = Math.floor(i / 2);
        if (row !== lastRow && i % 2 === 0) {
          lastRow = row;
          trail = document.createElementNS(NS, 'polyline');
          trail.setAttribute('class', 'trail');
          $('trails').appendChild(trail);
        }
        if (trail && i % 2 === 0) trail.setAttribute('points', `${a.x},${a.y + 34} ${x},${y + 34}`);
        sp.setAttribute('transform', `translate(${x.toFixed(1)} ${(y + Math.sin(t * 20) * 1.5).toFixed(1)})`);
        // Augen schauen in Laufrichtung
        const dir = Math.sign(b.x - a.x) || 0;
        $('pupilL').setAttribute('cx', -10.5 + dir * 3); $('pupilR').setAttribute('cx', 10.5 + dir * 3);
        drawLegs(t, true);
        return requestAnimationFrame(frame);
      }
      k -= T.walk;

      if (k < T.leave) {
        // Zufrieden nach oben davon flitzen
        const p = k / T.leave;
        const last = path[path.length - 1];
        sp.setAttribute('transform', `translate(${last.x + p * 40} ${last.y - ease(p) * (last.y + 80)}) scale(${1 - p * 0.3})`);
        $('mouth').setAttribute('d', 'M-8 11 Q0 21 8 11');
        $('trails').style.opacity = 1 - p;
        drawLegs(t, true);
        return requestAnimationFrame(frame);
      }
      window.spider.overlayDone();
    }
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
