<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Silkreader</title>
<link rel="stylesheet" href="theme.css">
<style>
  :root { --pink: #ff5c9d; --yellow: #ffe14d; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Gleiche Spinne wie im Analysefenster (spider.js) */
  #stage { position: absolute; inset: 0; transition: transform .22s var(--ease-out); }
  .w { position: absolute; border-radius: 3px; }
  .w.touched { animation: touched 2.4s ease-out forwards; }
  @keyframes touched {
    0% { box-shadow: 0 0 0 1.5px var(--pink); background: rgba(255,45,138,.16); }
    55% { box-shadow: 0 0 0 1.5px var(--pink); }
    100% { box-shadow: 0 0 0 1px rgba(255,45,138,0); }
  }
  .w.read { animation: read 2.4s ease-out forwards; }
  @keyframes read { 0% { background: rgba(255,45,138,.22); } 100% { background: rgba(255,45,138,0); } }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { Spider } from './spider.js';
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Seite gescrollt: alles (Kästen und Spinne) wandert mit dem Text mit
  window.spider.onOverlayShift(({ dx, dy }) => { $('stage').style.transform = `translate(${dx}px, ${dy}px)`; });

  window.spider.onOverlayStart(async ({ anchor, width, height, words, lines }) => {
    const stage = $('stage');
    const addBox = (x, y, w, h) => {
      const s = document.createElement('span');
      s.className = 'w';
      s.style.left = `${x}px`; s.style.top = `${y}px`; s.style.width = `${w}px`; s.style.height = `${h}px`;
      stage.appendChild(s);
    };

    if (words?.length) {
      // Genaue Wortpositionen vom Programm (UI Automation)
      for (const [x, y, w, h] of words) addBox(x, y, w, h);
    } else if (lines?.length) {
      // Nur Zeilen bekannt: in wortgroße Stücke teilen
      for (const [x, y, w, h] of lines) {
        for (let cx = x; cx < x + w - 8; ) { const ww = Math.min(30 + Math.random() * 50, x + w - cx); addBox(cx, y, ww - 6, h); cx += ww; }
      }
    } else {
      // Geschätzt: links vom Ende der Markierung ein paar Zeilen hoch
      const ax = clamp(anchor.x, 300, width - 60), ay = clamp(anchor.y, 150, height - 60);
      const left = clamp(ax - 460, 40, width - 220), right = clamp(ax + 20, left + 180, width - 40);
      for (const y of [ay - 100, ay - 68, ay - 36, ay - 4]) {
        for (let x = left; x < right; ) { const w = 26 + Math.random() * 60; addBox(x, y - 11, Math.min(w, right - x), 22); x += w + 9; }
      }
    }

    const spider = new Spider(document.scrollingElement, stage);
    spider.follow = false;
    spider.index();
    const ws = spider.words;
    if (!ws.length) return window.spider.overlayDone();

    // Vom nächstgelegenen Bildschirmrand hereinkriechen
    const first = ws[0];
    const fromLeft = first.x < width / 2;
    spider.teleport(fromLeft ? -110 : width + 110, first.y + 14);
    spider.show();
    spider.speed = 620;
    await new Promise((resolve) => { spider.moveTo(first.x, first.y + 14, resolve); setTimeout(resolve, 2500); });

    // Wort für Wort lesen (höchstens ~4,5 Sekunden)
    spider.speed = 420;
    const stride = Math.max(1, Math.ceil(ws.length / 28));
    for (let i = 0; i < ws.length; i += stride) {
      const w = ws[i];
      spider.moveTo(w.x, w.y + 14);
      for (let k = i; k < Math.min(ws.length, i + stride); k++) ws[k].el.classList.add('read');
      await sleep(150);
    }
    await sleep(250);

    // … und wieder zum Rand hinauskriechen
    const last = { x: spider.x, y: spider.y };
    const outLeft = last.x < width / 2;
    spider.speed = 700;
    await new Promise((resolve) => { spider.moveTo(outLeft ? -140 : width + 140, last.y + 20, resolve); setTimeout(resolve, 2200); });
    window.spider.overlayDone();
  });
</script>
</body>
</html>
