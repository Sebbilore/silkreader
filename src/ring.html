<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Silkreader</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default;
    font-family: "Segoe UI", system-ui, sans-serif; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  /* Netz */
  .silk { fill: none; stroke: rgba(255,255,255,.9); stroke-width: .8; stroke-linecap: round;
    filter: drop-shadow(0 0 1px rgba(10,10,20,.9)); }
  .spoke { stroke-dasharray: 140; stroke-dashoffset: 140; animation: grow .22s ease-out forwards; }
  .spiral { stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: grow .45s .12s ease-out forwards; }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  #disc { fill: rgba(17,17,22,.86); stroke: none; }
  /* Felder */
  .slot { cursor: pointer; }
  .slot .hit { fill: transparent; }
  .slot .hl { fill: rgba(255,45,138,.0); transition: fill .12s; }
  .slot.on .hl { fill: rgba(255,45,138,.2); }
  .slot .ic { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .12s; }
  .slot .ic text { fill: #fff; stroke: none; font: 700 10px "Segoe UI", sans-serif; }
  .slot.on .ic { stroke: #ff2d8a; transform: scale(1.18); }
  .slot.on .ic text { fill: #ff2d8a; }
  .slot .lb { fill: rgba(255,255,255,.75); font-size: 9px; text-anchor: middle; paint-order: stroke; stroke: rgba(10,10,15,.9); stroke-width: 2.5px; }
  .slot.on .lb { fill: #fff; }
  .slot.off { opacity: .35; }
  .icons { opacity: 0; animation: fade .2s .12s forwards; } @keyframes fade { to { opacity: 1; } }
  /* Mitte: kleine Spinne + Name der Aktion */
  #center .bd { fill: #16161d; stroke: #ff2d8a; stroke-width: 1.4; }
  #center .eye { fill: #fff; } #center .pu { fill: #111; }
  #root { transform-origin: 150px 150px; animation: pop .25s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  #root.closing { animation: out .14s ease-in forwards; } @keyframes out { to { transform: scale(.6); opacity: 0; } }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 300 300"><g id="root"></g></svg>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const C = 150, R = 118, INNER = 30;
  const $ = (id) => document.getElementById(id);
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e; };

  // Einfache Strich-Symbole (Mitte 0,0)
  const ICONS = {
    read: '<path d="M-7 -5h14M-7 0h14M-7 5h9"/>',
    translate: '<path d="M-7 -3h12l-3 -3M7 3h-12l3 3"/>',
    simplify: '<text x="0" y="4" text-anchor="middle">Aa</text>',
    reply: '<path d="M-1 -6l-6 5 6 5M-7 -1h8a6 6 0 0 1 6 6"/>',
    region: '<rect x="-8" y="-6" width="16" height="12" rx="1.5" stroke-dasharray="3 2.2"/>',
    pin: '<path d="M0 -8v16M-7 -4l14 8M-7 4l14 -8"/><circle r="3.5"/>',
    notebook: '<path d="M-6 -7h10a2 2 0 0 1 2 2v12h-10a2 2 0 0 1 -2 -2z M-6 3a2 2 0 0 0 2 2h10"/>',
    more: '<path d="M-6 0h.01M0 0h.01M6 0h.01" stroke-width="3"/>',
    file: '<path d="M-5 -8h7l4 4v12h-11z M2 -8v4h4"/>',
    clip: '<rect x="-6" y="-6" width="12" height="14" rx="1.5"/><path d="M-3 -8h6v3h-6z"/>',
    reader: '<rect x="-8" y="-6" width="16" height="12" rx="1.5"/><path d="M2 -6v12"/>',
    settings: '<circle r="3"/><path d="M0 -8v2.5M0 5.5v2.5M-8 0h2.5M5.5 0h2.5M-5.7 -5.7l1.8 1.8M3.9 3.9l1.8 1.8M-5.7 5.7l1.8 -1.8M3.9 -3.9l1.8 -1.8"/>',
    hide: '<path d="M-8 0q8 -8 16 0q-8 8 -16 0z"/><path d="M-7 6l14 -12"/>',
    back: '<path d="M2 -6l-6 6 6 6"/>',
  };
  const PAGES = [
    [['read', 'Lesen'], ['translate', 'Übersetzen'], ['simplify', 'Einfach'], ['reply', 'Antworten'],
     ['region', 'Bereich'], ['pin', 'Ins Netz'], ['notebook', 'Notizbuch'], ['more', 'Mehr']],
    [['file', 'Datei lesen'], ['clip', 'Zwischenabl.'], ['reader', 'Lesemodus'], ['settings', 'Einstellungen'],
     ['hide', 'Verstecken'], ['back', 'Zurück']],
  ];

  let page = 0, slots = [], hovered = null;

  function build() {
    const root = $('root');
    root.innerHTML = '';
    root.classList.remove('closing');
    root.style.animation = 'none'; void root.getBoundingClientRect(); root.style.animation = '';
    const items = PAGES[page];
    const n = items.length;
    mk('circle', { id: 'disc', cx: C, cy: C, r: R + 4 }, root);
    // Speichen zwischen den Feldern, Spirale darüber
    const web = mk('g', {}, root);
    const dirs = items.map((_, i) => -Math.PI / 2 + (i - 0.5) * (Math.PI * 2 / n));
    dirs.forEach((a) => mk('line', { class: 'silk spoke', x1: C, y1: C, x2: C + Math.cos(a) * R, y2: C + Math.sin(a) * R }, web));
    let d = '';
    for (let r = INNER + 6, k = 0; r < R - 2; r += 15, k++) {
      dirs.forEach((a, i) => {
        const b = dirs[(i + 1) % n] + (i === n - 1 ? Math.PI * 2 : 0);
        const p1 = [C + Math.cos(a) * r, C + Math.sin(a) * r], p2 = [C + Math.cos(b) * r, C + Math.sin(b) * r];
        const m = (a + b) / 2, sag = r * 0.88;
        d += `${i ? '' : `M${p1}`} Q${C + Math.cos(m) * sag},${C + Math.sin(m) * sag} ${p2}`;
      });
    }
    mk('path', { class: 'silk spiral', d }, web);
    // Felder
    const icons = mk('g', { class: 'icons' }, root);
    slots = items.map(([id, label], i) => {
      const a0 = dirs[i], a1 = dirs[i] + Math.PI * 2 / n, am = (a0 + a1) / 2;
      const g = mk('g', { class: 'slot', 'data-id': id }, icons);
      const wedge = (r0, r1) => `M${C + Math.cos(a0) * r0},${C + Math.sin(a0) * r0} L${C + Math.cos(a0) * r1},${C + Math.sin(a0) * r1}
        A${r1},${r1} 0 0 1 ${C + Math.cos(a1) * r1},${C + Math.sin(a1) * r1} L${C + Math.cos(a1) * r0},${C + Math.sin(a1) * r0} A${r0},${r0} 0 0 0 ${C + Math.cos(a0) * r0},${C + Math.sin(a0) * r0}Z`;
      mk('path', { class: 'hl', d: wedge(INNER, R) }, g);
      mk('path', { class: 'hit', d: wedge(INNER, R + 30) }, g);
      const ix = C + Math.cos(am) * (R * 0.62), iy = C + Math.sin(am) * (R * 0.62);
      const ic = mk('g', { class: 'ic', style: `transform-origin:${ix}px ${iy}px` }, g);
      ic.innerHTML = `<g transform="translate(${ix} ${iy - 5})">${ICONS[id]}</g>`;
      mk('text', { class: 'lb', x: ix, y: iy + 16 }, g).textContent = label;
      g.addEventListener('click', (e) => { e.stopPropagation(); choose(id); });
      return { id, label, a0, a1, g };
    });
    // Mitte: die kleine Spinne
    const c = mk('g', { id: 'center' }, root);
    mk('circle', { class: 'bd', cx: C, cy: C, r: 12 }, c);
    mk('ellipse', { class: 'eye', cx: C - 4.4, cy: C - 2, rx: 3.6, ry: 4.1 }, c);
    mk('ellipse', { class: 'eye', cx: C + 4.4, cy: C - 2, rx: 3.6, ry: 4.1 }, c);
    mk('circle', { class: 'pu', id: 'puL', cx: C - 4.4, cy: C - 2, r: 1.8 }, c);
    mk('circle', { class: 'pu', id: 'puR', cx: C + 4.4, cy: C - 2, r: 1.8 }, c);
    setHover(null);
  }

  function slotAt(x, y) {
    const dx = x - C, dy = y - C, dist = Math.hypot(dx, dy);
    if (dist < INNER || dist > R + 34) return null;
    let a = Math.atan2(dy, dx);
    for (const s of slots) {
      for (const k of [-2, 0, 2]) {
        const aa = a + k * Math.PI;
        if (aa >= s.a0 && aa < s.a1) return s;
      }
    }
    return null;
  }
  function setHover(s) {
    if (hovered === s) return;
    hovered = s;
    slots.forEach((o) => o.g.classList.toggle('on', o === s));
    window.spider.ringHover(s ? s.id : null);
  }
  function choose(id) {
    if (id === 'more' || id === 'back') { page = id === 'more' ? 1 : 0; build(); window.spider.ringHover(null); return; }
    $('root').classList.add('closing');
    setTimeout(() => window.spider.ringAction(id), 90);
  }

  window.addEventListener('mousemove', (e) => {
    setHover(slotAt(e.clientX, e.clientY));
    // Augen schauen zur Maus
    const dx = e.clientX - C, dy = e.clientY - C, dd = Math.hypot(dx, dy) || 1, m = Math.min(1.6, dd / 30);
    for (const [id, ex] of [['puL', -4.4], ['puR', 4.4]]) {
      const p = $(id); if (!p) continue;
      p.setAttribute('cx', C + ex + (dx / dd) * m); p.setAttribute('cy', C - 2 + (dy / dd) * m);
    }
  });
  window.addEventListener('mouseleave', () => setHover(null));
  // Klick ins Leere oder in die Mitte schließt
  window.addEventListener('click', (e) => { if (!slotAt(e.clientX, e.clientY)) window.spider.ringAction(null); });
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); window.spider.ringAction(null); });

  window.spider.onRingOpen(({ page: p = 0 } = {}) => { page = p; build(); });
  // Gedrückt halten + loslassen: Hauptprozess fragt, welches Feld gerade gewählt ist
  window.spider.onRingRelease(() => { if (hovered) choose(hovered.id); });
</script>
</body>
</html>
