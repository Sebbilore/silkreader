<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Silkreader</title>
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<script src="icons.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; font-family: var(--font); }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  /* Netz aus Seide */
  .silk { fill: none; stroke: var(--line-2); stroke-width: 1; stroke-linecap: round; }
  .spoke { stroke-dasharray: 140; stroke-dashoffset: 140; animation: silk-draw .22s var(--ease-out) forwards; }
  .spiral { stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: silk-draw .45s .12s var(--ease-out) forwards; stroke-width: .9; }
  #web { transform-origin: 150px 150px; }
  #web.pluck { animation: pluck .38s var(--ease-spring); }
  @keyframes pluck { 30% { transform: scale(1.018) rotate(.5deg); } 60% { transform: scale(.994) rotate(-.3deg); } }
  #rim { fill: none; stroke: var(--line-2); stroke-width: 1; }
  .disc { fill: var(--surface); }
  .dew { fill: var(--muted); }
  /* Felder */
  .slot { cursor: pointer; }
  .slot .hit { fill: transparent; }
  .slot .hl { fill: var(--line); opacity: 0; transition: opacity var(--t-fast); }
  .slot.on .hl { opacity: 1; }
  .slot .ic { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    transition: transform var(--t-mid) var(--ease-spring), stroke var(--t-fast); }
  .slot.on .ic { stroke: var(--pink); transform: scale(1.1); }
  .slot .lb { fill: var(--text); font: 400 9.5px var(--font); text-anchor: middle; transition: fill var(--t-fast); }
  .slot.on .lb { fill: var(--strong); font-weight: 600; }
  .lockb { fill: var(--pink); stroke: none; } .lockl { fill: none; stroke: var(--pink); stroke-width: 1.8; }
  .slot[data-id="pro"] .ic { stroke: var(--pink); }
  .icons { opacity: 0; animation: fade .2s .12s forwards; } @keyframes fade { to { opacity: 1; } }
  /* Mitte: die kleine Spinne */
  #center .bd { fill: #2b2b2b; stroke: var(--pink); stroke-width: 1.2; }
  #center .shine { fill: transparent; }
  #center .eye { fill: #fff; stroke: var(--line-2); stroke-width: .4; } #center .pu { fill: #111; } #center .gl { fill: #fff; }
  #root { transform-origin: 150px 150px; animation: silk-pop var(--t-mid) var(--ease-spring); }
  #root.closing { animation: silk-out .14s ease-in forwards; }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 300 300"><g id="root"></g></svg>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const C = 150, R = 118, INNER = 30;
  const $ = (id) => document.getElementById(id);
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e; };

  // Seite 1: das Wichtigste (6 Felder), Seite 2: alles Weitere
  const PAGES = [
    [['read', 'Lesen'], ['translate', 'Übersetzen'], ['simplify', 'Einfach'], ['reply', 'Antworten'], ['notebook', 'Notizbuch'], ['more', 'Mehr']],
    [['region', 'Bereich'], ['file', 'Datei lesen'], ['deadlines', 'Fristen'], ['reader', 'Großes Fenster'], ['pro', 'Silkreader Pro'],
     ['settings', 'Einstellungen'], ['hide', 'Verstecken'], ['back', 'Zurück']],
  ];
  // Pro-Funktionen bekommen ein kleines Schloss, solange Pro nicht aktiv ist
  const PRO_IDS = new Set(['translate', 'simplify', 'reply']);
  let proActive = true;
  const LOCK = '<g transform="translate(9 -9) scale(.55)"><rect x="-5" y="-1" width="10" height="7.5" rx="1.6" class="lockb"/><path d="M-3 -1v-2a3 3 0 0 1 6 0v2" class="lockl"/></g>';

  let page = 0, slots = [], hovered = null;

  function build() {
    const root = $('root');
    root.innerHTML = '';
    root.classList.remove('closing');
    root.style.animation = 'none'; void root.getBoundingClientRect(); root.style.animation = '';
    const items = PAGES[page];
    const n = items.length;
    const defs = mk('defs', {}, root);
    defs.innerHTML = `
      <radialGradient id="gDisc" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#2a2a38" stop-opacity=".96"/><stop offset="1" stop-color="#0c0c11" stop-opacity=".95"/></radialGradient>
      <radialGradient id="gHl" cx="${C}" cy="${C}" r="${R}" gradientUnits="userSpaceOnUse"><stop offset=".2" stop-color="#ff2d8a" stop-opacity="0"/><stop offset="1" stop-color="#ff2d8a" stop-opacity=".32"/></radialGradient>
      <radialGradient id="gBody" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#4a4a5c"/><stop offset=".35" stop-color="#1d1d27"/><stop offset="1" stop-color="#08080c"/></radialGradient>`;
    mk('circle', { cx: C, cy: C + 4, r: R + 4, fill: 'rgba(0,0,0,.25)', style: 'filter:blur(8px)' }, root);
    mk('circle', { class: 'disc', cx: C, cy: C, r: R + 4 }, root);
    mk('circle', { id: 'rim', cx: C, cy: C, r: R + 4 }, root);
    // Speichen zwischen den Feldern, Spirale darüber
    const web = mk('g', { id: 'web' }, root);
    const dirs = items.map((_, i) => -Math.PI / 2 + (i - 0.5) * (Math.PI * 2 / n));
    dirs.forEach((a) => mk('line', { class: 'silk spoke', x1: C, y1: C, x2: C + Math.cos(a) * R, y2: C + Math.sin(a) * R }, web));
    let d = '';
    for (let r = INNER + 6, k = 0; r < R - 2; r += 15, k++) {
      dirs.forEach((a, i) => {
        const b = dirs[(i + 1) % n] + (i === n - 1 ? Math.PI * 2 : 0);
        const p1 = [C + Math.cos(a) * r, C + Math.sin(a) * r], p2 = [C + Math.cos(b) * r, C + Math.sin(b) * r];
        const m = (a + b) / 2, sag = r * 0.88;
        d += `${i ? '' : `M${p1}`} Q${C + Math.cos(m) * sag},${C + Math.sin(m) * sag} ${p2}`;
      });
    }
    mk('path', { class: 'silk spiral', d }, web);
    // Felder
    const icons = mk('g', { class: 'icons' }, root);
    slots = items.map(([id, label], i) => {
      const a0 = dirs[i], a1 = dirs[i] + Math.PI * 2 / n, am = (a0 + a1) / 2;
      const g = mk('g', { class: 'slot', 'data-id': id, role: 'button', 'aria-label': label }, icons);
      const wedge = (r0, r1) => `M${C + Math.cos(a0) * r0},${C + Math.sin(a0) * r0} L${C + Math.cos(a0) * r1},${C + Math.sin(a0) * r1}
        A${r1},${r1} 0 0 1 ${C + Math.cos(a1) * r1},${C + Math.sin(a1) * r1} L${C + Math.cos(a1) * r0},${C + Math.sin(a1) * r0} A${r0},${r0} 0 0 0 ${C + Math.cos(a0) * r0},${C + Math.sin(a0) * r0}Z`;
      mk('path', { class: 'hl', d: wedge(INNER, R) }, g);
      mk('path', { class: 'hit', d: wedge(INNER, R + 30) }, g);
      const ix = C + Math.cos(am) * (R * 0.62), iy = C + Math.sin(am) * (R * 0.62);
      const ic = mk('g', { class: 'ic', style: `transform-origin:${ix}px ${iy - 5}px` }, g);
      ic.innerHTML = `<g transform="translate(${ix} ${iy - 5})">${SILK_ICONS[id] || ''}${PRO_IDS.has(id) && !proActive ? LOCK : ''}</g>`;
      mk('text', { class: 'lb', x: ix, y: iy + 16 }, g).textContent = label;
      g.addEventListener('click', (e) => { e.stopPropagation(); choose(id); });
      return { id, label, a0, a1, g };
    });
    // Mitte: die kleine Spinne
    const c = mk('g', { id: 'center' }, root);
    mk('circle', { class: 'bd', cx: C, cy: C, r: 12 }, c);
    mk('ellipse', { class: 'shine', cx: C - 5, cy: C - 7, rx: 3.6, ry: 1.8, transform: `rotate(-28 ${C - 5} ${C - 7})` }, c);
    mk('ellipse', { class: 'eye', cx: C - 4.4, cy: C - 2, rx: 3.6, ry: 4.1 }, c);
    mk('ellipse', { class: 'eye', cx: C + 4.4, cy: C - 2, rx: 3.6, ry: 4.1 }, c);
    mk('circle', { class: 'pu', id: 'puL', cx: C - 4.4, cy: C - 2, r: 1.8 }, c);
    mk('circle', { class: 'pu', id: 'puR', cx: C + 4.4, cy: C - 2, r: 1.8 }, c);
    mk('circle', { class: 'gl', id: 'glL', cx: C - 5.2, cy: C - 3, r: .7 }, c);
    mk('circle', { class: 'gl', id: 'glR', cx: C + 3.6, cy: C - 3, r: .7 }, c);
    setHover(null);
  }

  function slotAt(x, y) {
    const dx = x - C, dy = y - C, dist = Math.hypot(dx, dy);
    if (dist < INNER || dist > R + 34) return null;
    let a = Math.atan2(dy, dx);
    for (const s of slots) {
      for (const k of [-2, 0, 2]) {
        const aa = a + k * Math.PI;
        if (aa >= s.a0 && aa < s.a1) return s;
      }
    }
    return null;
  }
  function setHover(s) {
    if (hovered === s) return;
    hovered = s;
    slots.forEach((o) => o.g.classList.toggle('on', o === s));
    if (s) { pluck(); dew(s); }
    window.spider.ringHover(s ? s.id : null);
  }
  // Das Netz federt kurz nach, Tautropfen laufen die Speichen des gewählten Feldes hinaus
  function pluck() {
    const w = $('web'); if (!w) return;
    w.classList.remove('pluck'); void w.getBoundingClientRect(); w.classList.add('pluck');
  }
  function dew(s) {
    const root = $('root');
    for (const a of [s.a0, s.a1]) {
      const d = mk('circle', { class: 'dew', r: 1.6 }, root);
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / 520), e = 1 - (1 - p) ** 3, r = INNER + 4 + (R - INNER - 6) * e;
        d.setAttribute('cx', C + Math.cos(a) * r); d.setAttribute('cy', C + Math.sin(a) * r);
        d.setAttribute('opacity', (1 - p * p).toFixed(2));
        if (p < 1) requestAnimationFrame(step); else d.remove();
      };
      requestAnimationFrame(step);
    }
  }
  function choose(id) {
    if (id === 'more' || id === 'back') { page = id === 'more' ? 1 : 0; build(); window.spider.ringHover(null); return; }
    $('root').classList.add('closing');
    setTimeout(() => window.spider.ringAction(id), 90);
  }

  window.addEventListener('mousemove', (e) => {
    setHover(slotAt(e.clientX, e.clientY));
    // Augen schauen zur Maus
    const dx = e.clientX - C, dy = e.clientY - C, dd = Math.hypot(dx, dy) || 1, m = Math.min(1.6, dd / 30);
    for (const [id, gid, ex] of [['puL', 'glL', -4.4], ['puR', 'glR', 4.4]]) {
      const p = $(id), g = $(gid); if (!p) continue;
      const px = C + ex + (dx / dd) * m, py = C - 2 + (dy / dd) * m;
      p.setAttribute('cx', px); p.setAttribute('cy', py);
      g.setAttribute('cx', px - 0.9); g.setAttribute('cy', py - 1);
    }
  });
  window.addEventListener('mouseleave', () => setHover(null));
  // Klick ins Leere oder in die Mitte schließt
  window.addEventListener('click', (e) => { if (!slotAt(e.clientX, e.clientY)) window.spider.ringAction(null); });
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); window.spider.ringAction(null); });

  window.spider.onRingOpen(async ({ page: p = 0 } = {}) => {
    page = p;
    try { proActive = (await window.spider.proState()).active; } catch { proActive = true; }
    build();
  });
  // Tastatur: im Uhrzeigersinn weiter (→ ↓ Tab), zurück (← ↑ Umschalt+Tab), Enter/Leertaste wählt
  window.spider.onRingKey((k) => {
    if (k === 'Return' || k === 'Space') { if (hovered) choose(hovered.id); return; }
    const step = ['Right', 'Down', 'Tab'].includes(k) ? 1 : -1;
    const i = hovered ? slots.indexOf(hovered) : (step > 0 ? -1 : 0);
    setHover(slots[(i + step + slots.length) % slots.length]);
  });

  // Gedrückt halten + loslassen: Hauptprozess fragt, welches Feld gerade gewählt ist
  window.spider.onRingRelease(() => { if (hovered) choose(hovered.id); });
</script>
</body>
</html>
